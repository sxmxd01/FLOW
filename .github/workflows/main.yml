name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FocusFlow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4 # <-- This automatically handles the missing files!

      - name: Build APK with Gradle
        run: gradle assembleDebug # <-- Notice we use 'gradle', not './gradlew'

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-APK
          path: FocusFlow/app/build/outputs/apk/debug/app-debug.apk
