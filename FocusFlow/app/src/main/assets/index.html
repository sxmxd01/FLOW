$('#setBtn').addEventListener('click', () => openSheet('settings'));
$('#reviewBtn').addEventListener('click', () => openSheet('review'));
$('#shareBtn').addEventListener('click', () => openSheet('share'));

/* ============================================================
   TOAST (with tappable action, e.g. Undo)
============================================================ */
let toastTimer, toastAction = null;
function toast(msg, opts){
  opts = opts || {};
  const el = $('#toast');
  toastAction = opts.action || null;
  el.innerHTML = `<span class="tmsg">${esc(msg)}</span>${toastAction ? `<button id="toastAction">${esc(toastAction.label)}</button>` : ''}`;
  el.classList.toggle('act', !!toastAction);
  el.classList.toggle('top', sheet.classList.contains('show'));
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), opts.duration || 1800);
}
$('#toast').addEventListener('click', e => {
  if (!e.target.closest('#toastAction') || !toastAction) return;
  const a = toastAction;
  toastAction = null;
  clearTimeout(toastTimer);
  $('#toast').classList.remove('show');
  a.fn();
});

/* ============================================================
   MIDNIGHT CHECK
============================================================ */
let lastToday = iso(new Date());
setInterval(() => {
  const t = iso(new Date());
  if (t !== lastToday){
    if (state.date === lastToday) state.date = t;
    lastToday = t;
    render();
  } else if (state.date === t && !drag){
    renderTimeline();
  }
}, 30000);

/* ============================================================
   NATIVE BRIDGE (Android) — no-ops in a normal browser
============================================================ */
let lastSeenDay = iso(new Date());

function nativeStatusRefresh(){
  if (!NATIVE) return;
  try { nativeStatus = JSON.parse(NATIVE.getStatus()); } catch(_){}
}
function reloadFromNative(){
  if (!NATIVE || drag) return;
  const saved = load();
  if (!saved) return;
  const keepDate = state.date;
  state = saved;
  normalizeState();
  state.date = keepDate;
  _profDirty = true;
  render();
  if (sheetCtx.mode === 'mat' && sheetCtx.id) hideSheet();
  else if (['block','recurring','settings','review'].includes(sheetCtx.mode)) renderSheet();
}
/* data changed natively (notification / widget action) while the UI is alive */
window.__ffExternalChange = reloadFromNative;
/* app returned to the foreground */
window.__ffResume = function(){
  nativeStatusRefresh();
  reloadFromNative();
  const today = iso(new Date());
  if (today !== lastSeenDay){
    lastSeenDay = today; lastToday = today;
    state.date = today;
    render();
    scrollDefault(true);
  } else if (sheetCtx.mode === 'settings'){
    renderSheet();
  }
};
window.__ffStatus = function(json){
  try { nativeStatus = JSON.parse(json); } catch(_){}
  if (sheetCtx.mode === 'settings') renderSheet();
};
/* notification / widget tap → show that block */
window.__ffOpenBlock = function(id, date){
  if (!id) return;
  hideSheet();
  if (date && date !== state.date) state.date = date;
  render();
  const t = findTask(id);
  if (!t) return;
  scrollToTime(t.start);
  if (String(id).startsWith('rec:')) openSheet('recurring', { recurringId: String(id).split(':')[1] });
  else openBlockSheet(id);
};
window.__ffNewBlock = function(){ hideSheet(); openNewBlock(); };
/* system Back button */
window.__ffBack = function(){
  if (sheet.classList.contains('show')){ hideSheet(); return true; }
  return false;
};

function exportBackup(){
  if (!NATIVE) return;
  const bytes = new TextEncoder().encode(JSON.stringify(state));
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  NATIVE.shareFile(btoa(bin), `focusflow-backup-${iso(new Date())}.json`, 'application/json', 'FocusFlow backup');
}
function importBackup(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || data.version !== 2 || typeof data.tasks !== 'object') throw new Error('bad backup');
      const before = snapState();
      state = data;
      normalizeState();
      state.date = iso(new Date());
      _profDirty = true;
      save(); hideSheet(); render();
      scrollDefault(true);
      offerUndo('Backup imported', before, 5000);
    } catch(e){
      toast('Not a FocusFlow backup');
    }
  };
  inp.click();
}
/* no browser context menu on long-press (inputs keep theirs) */
document.addEventListener('contextmenu', e => {
  if (!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) e.preventDefault();
});

/* ============================================================
   BOOT
============================================================ */
function boot(){
  initState();
  $('#reviewBtn').innerHTML = ICON_REVIEW;
  $('#shareBtn').innerHTML = ICON_SHARE;
  $('#setBtn').innerHTML = ICON_SET;
  render();
  requestAnimationFrame(() => scrollDefault(true));
  if (NATIVE){ nativeStatusRefresh(); try { NATIVE.ready(); } catch(_){} }
}
boot();
</script>
