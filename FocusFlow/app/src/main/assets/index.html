<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0b0e">
<meta name="color-scheme" content="dark">
<title>FocusFlow — Study Planner</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  background:#0a0b0e;color:#dfe1e8;overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  overscroll-behavior:none;
}
input,textarea,select{-webkit-user-select:text;user-select:text}
*{touch-action:manipulation}
.blk,.tl-wrap{touch-action:pan-y}
.grip,.bar{touch-action:none}
.blk{transform:translateZ(0);backface-visibility:hidden}

body::before{
  content:"";position:fixed;inset:-30%;z-index:0;pointer-events:none;
  background:
    radial-gradient(40% 30% at 15% 0%, rgba(110,122,160,.16), transparent 70%),
    radial-gradient(36% 28% at 90% 100%, rgba(90,120,130,.10), transparent 70%);
  filter:blur(38px);
}
#app{
  position:relative;z-index:1;height:100vh;height:100dvh;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;padding:0 12px;
}

/* ---------- header ---------- */
header{
  flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top)) 4px 10px;gap:10px;
}
.hl{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand{font-size:16px;font-weight:700;letter-spacing:-.2px;color:#e8eaf0}
.brand span{color:#95a0b8}
.datenav{display:flex;align-items:center;gap:1px;margin-left:-7px}
.nv{width:28px;height:26px;border:0;border-radius:8px;background:transparent;color:#7c8296;font-size:18px;line-height:1;cursor:pointer;font-family:inherit}
.nv:active{background:rgba(255,255,255,.09)}
.date-pill{border:0;background:transparent;font-family:inherit;padding:4px 2px;font-size:11.5px;font-weight:600;color:#8d94a8;letter-spacing:.2px;cursor:pointer}
.hdr-actions{display:flex;gap:6px;flex:0 0 auto}
.ic{
  width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.045);color:#a5acc0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s,color .15s,transform .1s;
}
.ic:active{transform:scale(.92);background:rgba(255,255,255,.10)}

/* ---------- week strip ---------- */
.week{
  flex:0 0 auto;display:flex;gap:6px;padding:2px 0 10px;
  overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;
}
.week::-webkit-scrollbar{display:none}
.day-chip{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;border-radius:13px;cursor:pointer;font-family:inherit;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.065);
  color:#7f8598;font-size:10px;font-weight:600;letter-spacing:.4px;
  transition:background .15s,border-color .15s,color .15s;
}
.day-chip:active{transform:scale(.95)}
.day-chip .dnum{font-size:13.5px;font-weight:700;color:#ccd0dc}
.day-chip.active{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.20);color:#e3e5ec}
.day-chip.active .dnum{color:#fff}
.day-chip.today .dnum{color:#a8dbe8}
.dbar{width:18px;height:2px;border-radius:2px;background:rgba(255,255,255,.11);overflow:hidden;margin-top:1px}
.dbar i{display:block;height:100%;border-radius:2px;background:#8ba2b8;transition:width .3s}

/* ---------- materials ---------- */
.mats{
  flex:0 0 auto;display:flex;gap:8px;padding:0 0 11px;
  overflow-x:auto;scrollbar-width:none;min-height:86px;overscroll-behavior-x:contain;
}
.mats::-webkit-scrollbar{display:none}
.mat{
  position:relative;flex:0 0 158px;padding:10px 10px 8px 12px;border-radius:15px;overflow:hidden;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.075);
}
.mat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);opacity:.95}
.mat-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:6px}
.mat-title{
  font-size:12px;font-weight:600;line-height:1.25;color:#d0d4df;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pct{font-size:11.5px;font-weight:700;color:#a3aabd;flex:0 0 auto;font-variant-numeric:tabular-nums}
.bar{height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track{width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.10);overflow:hidden}
.fill{height:100%;border-radius:3px;background:var(--c);opacity:.95;transition:width .06s linear}

.mat{display:flex;flex-direction:column}
.mat-ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:7px;gap:4px}
.mstep{width:36px;height:27px;border:0;border-radius:8px;background:rgba(255,255,255,.07);color:#cfd4e0;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;touch-action:manipulation;transition:background .1s,transform .1s}
.mstep:active{background:rgba(255,255,255,.17);transform:scale(.93)}
.units{flex:1;border:0;background:transparent;font-family:inherit;color:#e0e3ec;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;padding:4px 0;margin:0;white-space:nowrap}
.units span{color:#6f768a;font-weight:600}
.mat.add{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  flex:0 0 88px;color:#7f8598;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;
  background:rgba(255,255,255,.025);border:1px dashed rgba(255,255,255,.14);
}
.mat.add span{font-size:18px;line-height:1;color:#95a0b8}
.mats-empty{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:#6a7083;font-weight:600;
}

/* ---------- timeline ---------- */
.tl-wrap{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;
  border-radius:18px;background:rgba(255,255,255,.022);
  border:1px solid rgba(255,255,255,.065);
  scrollbar-width:none;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.tl-wrap::-webkit-scrollbar{display:none}
.tl{position:relative}
.hour{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.05)}
.hour span{position:absolute;left:10px;top:-7px;font-size:9.5px;font-weight:600;color:#666c80;font-variant-numeric:tabular-nums}
.now-line{position:absolute;left:44px;right:8px;height:0;border-top:1px dashed rgba(200,130,145,.65);z-index:5}
.now-line::before{content:"";position:absolute;left:-2px;top:-3px;width:6px;height:6px;border-radius:50%;background:#cc8a9a;box-shadow:0 0 6px rgba(204,138,154,.7)}

.empty{
  position:absolute;left:0;right:0;top:32%;text-align:center;padding:0 30px;
  color:#6a7083;font-size:12px;font-weight:600;line-height:1.7;pointer-events:none;
}
.empty b{display:block;color:#959cad;font-size:13px;font-weight:700;margin-bottom:4px}

.blk{
  position:absolute;left:46px;right:9px;border-radius:11px;
  display:flex;align-items:stretch;overflow:hidden;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.09);
  border-left:3px solid var(--c);
  transition:box-shadow .18s, opacity .18s, background .18s;
  will-change:transform;
}
.blk.dragging{
  z-index:20;background:rgba(255,255,255,.10);
  box-shadow:0 16px 32px -14px #000, 0 0 0 1px rgba(255,255,255,.22);
  transition:none;
}
.blk.done{opacity:.45}
.blk.done .blk-title{text-decoration:line-through;color:#a3aabd}
.blk.fixed{
  background:rgba(255,255,255,.028);
  background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 5px, transparent 5px 11px);
  border-color:rgba(255,255,255,.075);
  border-left:3px solid var(--c);
}
.blk.fixed .blk-title{color:#aab0c0}
.lock{flex:0 0 8px}
.grip{
  flex:0 0 26px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.03);cursor:grab;touch-action:none;
}
.grip::before{
  content:"";width:8px;height:16px;opacity:.65;
  background-image:radial-gradient(circle, rgba(255,255,255,.65) 1px, transparent 1.3px);
  background-size:4px 4px;
}
.blk-body{flex:1 1 auto;min-width:0;padding:5px 6px 5px 8px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;cursor:pointer}
.blk-time{font-size:9.5px;font-weight:600;letter-spacing:.3px;color:#868da1;font-variant-numeric:tabular-nums}
.blk-title{font-size:12px;font-weight:600;line-height:1.2;color:#e3e5ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.sm .blk-time{display:none}
.chk{
  flex:0 0 36px;border:0;background:transparent;color:rgba(255,255,255,.25);
  font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:color .15s,transform .1s;
}
.chk:active{transform:scale(.88)}
.blk.done .chk{color:#8bb59a}

/* ---------- bottom bar ---------- */
.bottom{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));
}
.stats{display:flex;flex-direction:column;line-height:1.15}
.stat-v{font-size:15px;font-weight:700;color:#d6dae4;font-variant-numeric:tabular-nums}
.stat-l{font-size:9px;font-weight:600;letter-spacing:.7px;color:#6a7083;text-transform:uppercase}
.spacer{flex:1 1 auto}
.btn{
  border:0;border-radius:12px;font-family:inherit;font-weight:700;cursor:pointer;
  transition:transform .1s, background .15s;
}
.btn:active{transform:scale(.95)}
.btn.primary{padding:13px 18px;font-size:13px;color:#0a0b0e;background:#d1d6e2}
.btn.primary:active{background:#bcc3d2}
.btn.ghost{padding:12px 14px;font-size:12.5px;color:#aab0c0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}
.btn.ghost:active{background:rgba(255,255,255,.11)}
.btn.danger{background:rgba(200,115,125,.14);border:1px solid rgba(200,115,125,.28);color:#d099a2}
.btn.tiny{padding:11px 14px;font-size:12px}

/* ---------- sheet ---------- */
.backdrop{
  position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:520px;margin:0 auto;
  background:rgba(22,24,30,.97);
  -webkit-backdrop-filter:blur(18px) saturate(120%);backdrop-filter:blur(18px) saturate(120%);
  border-top:1px solid rgba(255,255,255,.10);border-radius:22px 22px 0 0;
  padding:10px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(112%);transition:transform .28s cubic-bezier(.2,.85,.3,1);
  box-shadow:0 -20px 50px -22px #000;
  max-height:88dvh;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;
}
.sheet::-webkit-scrollbar{display:none}
.sheet.show{transform:translateY(0)}
.handle{width:36px;height:4px;border-radius:3px;background:rgba(255,255,255,.20);margin:0 auto 16px}
.sheet-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:#7d93a8}
.sheet-title{font-size:15px;font-weight:700;letter-spacing:-.2px;color:#e8eaf0}
.sheet-sub{font-size:11.5px;color:#868da1;font-weight:600;margin-top:2px}
.sec{font-size:9.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#6a7083;margin:16px 0 4px}
.sec:first-child{margin-top:0}
.ctl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.ctl-row > span{font-size:12.5px;font-weight:600;color:#aab0c0;flex:0 0 auto}
.stepper{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.055);border-radius:11px;padding:3px;border:1px solid rgba(255,255,255,.075)}
.stepper button{
  width:36px;height:32px;border:0;border-radius:8px;background:transparent;color:#dfe2ea;
  font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation;
}
.stepper button:active{background:rgba(255,255,255,.12)}
.fld{display:flex;align-items:baseline;justify-content:center;gap:3px;min-width:66px;padding:0 2px}
.fld.wide{min-width:84px}
.fld input.num{width:44px;border:0;background:transparent;color:#e8eaf0;font:inherit;font-size:14px;font-weight:700;text-align:right;padding:2px 3px;outline:none;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;border-radius:6px;margin:0}
.fld.wide input.num{width:80px;text-align:center}
.fld input.num:focus{color:#fff;background:rgba(255,255,255,.10)}
.fld i{font-style:normal;font-size:11px;font-weight:600;color:#7a8094}
.stepper b{min-width:62px;text-align:center;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:#dfe2ea}
.presets{display:flex;gap:6px;padding:2px 0 8px}
.pchip{flex:1;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#a3aabd;border-radius:10px;padding:10px 0;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;touch-action:manipulation;font-variant-numeric:tabular-nums;transition:background .1s,transform .1s}
.pchip.sel{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.27);color:#fff}
.pchip:active{transform:scale(.95)}
.btn.wide{width:100%;margin-top:8px}
.tap{cursor:pointer}
.sub.inline{display:inline;margin:0 0 0 4px}
.splits{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 0 2px}
.split{font-size:11.5px;font-weight:600;color:#868da1;display:inline-flex;align-items:center;gap:6px}
.split b{color:#cfd4e0}
.split i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chiprow.cats{padding:2px 0 8px}
.sheet-actions{display:flex;gap:9px;margin-top:16px}
.sheet-actions .btn{flex:1;padding:15px;font-size:13.5px}
.inp{
  width:100%;padding:13px 15px;border-radius:12px;font-family:inherit;font-size:16px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);
  color:#e8eaf0;outline:none;margin-bottom:10px;-webkit-appearance:none;appearance:none;
}
.inp::placeholder{color:#6a7083}
.inp:focus{border-color:rgba(155,170,195,.50)}
select.inp{background-image:none}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.row .nm{font-size:12.5px;font-weight:600;color:#ccd0dc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.row .sub{font-size:10.5px;color:#7a8094;font-weight:600;margin-top:2px}
.row .right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.xbtn{
  width:34px;height:34px;border:0;border-radius:9px;background:rgba(255,255,255,.05);
  color:#7f8598;font-size:16px;cursor:pointer;font-family:inherit;touch-action:manipulation;
}
.xbtn:active{background:rgba(255,255,255,.12)}

.stars{display:flex;gap:4px}
.star{
  width:36px;height:36px;border:0;border-radius:10px;
  background:rgba(255,255,255,.055);color:#6a7083;
  font-size:14px;cursor:pointer;font-family:inherit;transition:background .12s,color .12s;
  touch-action:manipulation;
}
.star.on{background:rgba(205,218,240,.18);color:#dde3f0}
.star:active{transform:scale(.92)}

.cdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto;vertical-align:middle;margin-right:6px}
.mchip{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 13px;border-radius:11px;font-family:inherit;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);color:#a3aabd;cursor:pointer;
  max-width:100%;touch-action:manipulation;transition:background .12s,border-color .12s,color .12s;
}
.mchip:active{transform:scale(.97)}
.mchip.sel{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.25);color:#e8eaf0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 2px}

.day-mini{
  width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);color:#a3aabd;font-family:inherit;font-size:11px;font-weight:700;
  cursor:pointer;touch-action:manipulation;transition:background .12s,color .12s,border-color .12s;
}
.day-mini.on{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}

.goalbar{height:4px;border-radius:3px;background:rgba(255,255,255,.10);overflow:hidden;margin-top:6px}
.goalbar i{display:block;height:100%;border-radius:3px;background:#95a5bc;transition:width .3s}

.note{font-size:11.5px;line-height:1.6;color:#7a8094;font-weight:500;padding:6px 0 2px}
.note b{color:#aab0c0;font-weight:700}

.share-preview{margin-bottom:18px}
.share-preview img{
  width:100%;border-radius:14px;border:1px solid rgba(255,255,255,.08);
  display:block;background:#0a0b0e;
}
.share-preview .cap{font-size:12px;color:#868da1;line-height:1.55;margin-top:10px;font-weight:500}
.share-preview .btn{width:100%;margin-top:10px}

#toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,14px);z-index:80;
  padding:11px 18px;border-radius:100px;font-size:12.5px;font-weight:600;
  background:rgba(30,32,40,.97);border:1px solid rgba(255,255,255,.11);
  color:#d1d6e2;backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:.25s;max-width:90vw;
  display:flex;align-items:center;gap:10px;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.show.act{pointer-events:auto}
#toast.top{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-14px)}
#toast.top.show{transform:translate(-50%,0)}
#toast .tmsg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast button{
  border:0;background:transparent;color:#dde3f0;font-weight:800;cursor:pointer;
  font-family:inherit;font-size:13px;text-decoration:underline;padding:8px 6px;margin:-8px -6px;flex:0 0 auto;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ===== v3: motion, day bar, settings menu, rituals ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.32,.72,0,1)}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
button{touch-action:manipulation}
.brandrow{display:flex;align-items:center;gap:8px}
.streak{display:none;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#e0b57c;background:rgba(214,164,106,.12);border:1px solid rgba(214,164,106,.26);border-radius:999px;padding:2px 7px 2px 6px}
.streak.on{display:inline-flex;animation:pop .45s var(--spring) both}
.stats.warn .stat-v{color:#e0b57c}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes blkIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.blk.enter{animation:blkIn .34s var(--ease) both}
.blk.carried{opacity:.55}
.blk.done .blk-title{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.chk svg{display:block}

/* day bar */
.daybar{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:7px;margin:0 0 9px;padding:9px 9px 9px 13px;border-radius:15px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.075);overflow:hidden;min-height:56px}
.daybar.hide{display:none}
.daybar::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:var(--p,0%);background:#a3b3c9;opacity:.85;transition:width .6s var(--ease)}
.daybar.idle,.daybar.wrap{background:linear-gradient(135deg,rgba(163,179,201,.11),rgba(255,255,255,.03));border-color:rgba(163,179,201,.18)}
.daybar.closed{opacity:.9}
.db-main{flex:1;min-width:0}
.db-main.tap{cursor:pointer}
.db-t{font-size:13px;font-weight:700;color:#e8eaf0;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db-s{font-size:11px;font-weight:600;color:#7c8296;margin-top:2px;font-variant-numeric:tabular-nums}
.db-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.db-btn{border:0;border-radius:11px;padding:10px 13px;font-family:inherit;font-weight:700;font-size:12.5px;background:rgba(255,255,255,.08);color:#d6dae4;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:transform .12s var(--ease),background .15s}
.db-btn.primary{background:#d1d6e2;color:#0a0b0e}
.db-btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.1);color:#a3aabd}
.db-icon{width:36px;height:36px;border-radius:11px;border:0;background:rgba(255,255,255,.07);color:#cfd4e0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;font-weight:700;font-size:11.5px;transition:transform .12s var(--ease),background .15s}
.db-icon.ok{background:rgba(139,181,154,.18);color:#9fd0b0}
.db-pill{border:0;border-radius:999px;padding:7px 10px;background:rgba(214,164,106,.14);color:#e0b57c;font-family:inherit;font-weight:700;font-size:11px;display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.db-btn:active,.db-icon:active,.db-pill:active,.pchip:active,.mchip:active,.mrow:active{transform:scale(.96)}

/* sheet: spring in, staggered content, directional swaps */
.sheet{transition:transform .42s var(--spring)}
.backdrop{transition:opacity .3s}
@keyframes sIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sFwd{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes sBack{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.sheet.in-open>*:not(.handle){animation:sIn .34s var(--ease) both}
.sheet.in-fwd>*:not(.handle){animation:sFwd .3s var(--ease) both}
.sheet.in-back>*:not(.handle){animation:sBack .3s var(--ease) both}
.sheet>:nth-child(3){animation-delay:.03s!important}.sheet>:nth-child(4){animation-delay:.06s!important}
.sheet>:nth-child(5){animation-delay:.09s!important}.sheet>:nth-child(n+6){animation-delay:.12s!important}
.sheet-back{display:inline-flex;align-items:center;gap:2px;border:0;background:transparent;color:#95a5bc;font-family:inherit;font-weight:600;font-size:13px;padding:2px 8px 10px 0;margin-top:-8px;cursor:pointer}
#toast.top{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-14px)}
#toast.top.show{transform:translate(-50%,0)}

/* settings home + controls */
.menu{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);color:inherit;font-family:inherit;cursor:pointer;text-align:left;transition:transform .12s var(--ease),background .15s}
.gi{width:34px;height:34px;border-radius:10px;background:rgba(163,179,201,.12);color:#a9b9d0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mt b{font-size:13.5px;color:#e8eaf0}
.mt small{font-size:11.5px;color:#7c8296;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#586074;display:flex}
.dotwarn{width:8px;height:8px;border-radius:50%;background:#e0b57c}
.ctl-row span em{display:block;font-style:normal;font-size:10.5px;color:#6a7083;font-weight:500;margin-top:2px}
.stepper .tgl,.tgl{width:46px;height:28px;border-radius:999px;border:0;background:rgba(255,255,255,.14);position:relative;cursor:pointer;padding:0;transition:background .22s;display:block}
.tgl i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#cfd4e0;transition:transform .28s var(--spring)}
.stepper .tgl.on,.tgl.on{background:#7fb392}
.tgl.on i{transform:translateX(18px);background:#fff}
.stepper:has(.tgl){background:none;border:0;padding:0}
.mchip.add{padding:10px 15px;color:#7c8296;border-style:dashed}
.seg{display:flex;background:rgba(255,255,255,.05);border-radius:11px;padding:3px;gap:2px;margin-bottom:4px}
.seg button{flex:1;border:0;background:transparent;color:#8d94a8;font-family:inherit;font-weight:700;font-size:12.5px;padding:9px 0;border-radius:9px;cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:rgba(255,255,255,.12);color:#fff}
.warnline{margin:8px 0 2px;padding:9px 12px;border-radius:11px;background:rgba(214,164,106,.1);border:1px solid rgba(214,164,106,.22);color:#e0b57c;font-size:11.5px;font-weight:600}

/* insights */
.insight{padding:10px 0 2px}
.bars{display:flex;align-items:flex-end;gap:3px;height:64px}
.bars i{flex:1;background:#95a5bc;border-radius:3px 3px 1px 1px;min-height:3px;transform-origin:bottom;animation:barUp .5s var(--ease) both}
@keyframes barUp{from{transform:scaleY(.1)}to{transform:scaleY(1)}}
.axis{display:flex;justify-content:space-between;font-size:10px;color:#6a7083;font-weight:600;margin-top:4px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stats3>div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 4px;text-align:center}

/* rituals */

<body>

  <header>
    <div class="hl">
      <div class="brandrow"><div class="brand">Focus<span>Flow</span></div><div class="streak" id="streak"></div></div>
      <div class="datenav"><button class="nv" id="prevDay" aria-label="Previous day">‹</button><button class="date-pill" id="datePill">—</button><button class="nv" id="nextDay" aria-label="Next day">›</button></div>

  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script>
/* ============================================================
   CONSTANTS
============================================================ */
const STORAGE_KEY = 'focusflow_v2';
const NATIVE = (typeof window.FFNative !== 'undefined') ? window.FFNative : null;
const SNAP = 15, BREAK_MIN = 5;
const MIN_STUDY = 10, MAX_STUDY = 240, MIN_FIXED = 15, MAX_FIXED = 720;
const MAX_BED = 1620;                       // bedtime can slide up to 3:00 AM
const SHARE_W = 1080;
const COLORS = ['#8095c9','#7fb392','#b58da8','#b8a184','#8095c0','#a58ab5','#8296a8'];
const CATS = {
  cl:      { name:'CL',      color:'#7f9fc4' },
  rest:    { name:'Rest',    color:'#a392c0' },
  content: { name:'Content', color:'#c9a46a' }
};
const CAT_KEYS = ['cl','rest','content'];
const catOf = t => CATS[t.cat] || CATS.cl;

const DEFAULT_NOTIF = { start:true, end:true, lead:0, fixed:true, dayStart:true, dayEnd:true };
const DEFAULT_PLAN = {
  blockLen:0,        // 0 = learn it
  minBlock:25, maxBlock:120,
  breakLen:10, longEvery:3, longBreak:25,
  fixedBuffer:5,
  maxDay:0,          // 0 = no cap
  variety:1,         // 0 off · 1 normal · 2 strict
  tone:0,            // -1 mornings · 0 balanced · 1 evenings
  windDown:45, bedStretch:90, rampUp:15,
  refit:true, adapt:true, learn:true, learnDays:10
};
const DEFAULT_UI = {
  haptics:true, zoom:62, weekStart:1, reduceMotion:false,
  h24: (() => { try { return !new Intl.DateTimeFormat(undefined, { hour:'numeric' }).resolvedOptions().hour12; } catch(_){ return false; } })()
};
/* numeric settings editable through typed/stepper fields: path → limits */
const CFG = {
  'plan.blockLen':   { min:0,  max:150, step:5,  unit:'min',    zero:'Auto' },
  'plan.minBlock':   { min:10, max:90,  step:5,  unit:'min' },
  'plan.maxBlock':   { min:30, max:240, step:5,  unit:'min' },
  'plan.breakLen':   { min:0,  max:45,  step:5,  unit:'min' },
  'plan.longEvery':  { min:2,  max:8,   step:1,  unit:'blocks' },
  'plan.longBreak':  { min:10, max:90,  step:5,  unit:'min' },
  'plan.fixedBuffer':{ min:0,  max:30,  step:5,  unit:'min' },
  'plan.maxDay':     { min:0,  max:960, step:30, unit:'min',    zero:'Off' },
  'plan.windDown':   { min:0,  max:180, step:15, unit:'min',    zero:'Off' },
  'plan.bedStretch': { min:0,  max:180, step:15, unit:'min',    zero:'Never' },
  'plan.rampUp':     { min:0,  max:60,  step:5,  unit:'min',    zero:'Off' },
  'notif.lead':      { min:0,  max:60,  step:5,  unit:'min',    zero:'Off' }
};

const ICON = {
  review: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg>',
  share: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>',
  set: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  play: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
  moon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  refit: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>',
  flame: '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.4-1.6-1-2.4C16.5 10 19 12 19 15a7 7 0 0 1-14 0c0-5 5-7 7-13z"/></svg>',
  chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>'
};

/* ============================================================
   HELPERS
============================================================ */
const $   = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const roundTo = (v, n) => Math.round(v / n) * n;
const ceilTo = (v, n) => Math.ceil(v / n) * n;
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const dateObj = key => new Date(key + 'T00:00:00');
const shiftDate = (key, n) => { const d = dateObj(key); d.setDate(d.getDate() + n); return iso(d); };
const isoDow = key => ((dateObj(key).getDay() + 6) % 7) + 1;
const nowMinutes = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60; };
const todayKey = () => iso(new Date());
const getPath = (o, p) => p.split('.').reduce((a, k) => a && a[k], o);
const setPath = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };

const h24 = () => !!(state && state.settings && state.settings.ui && state.settings.ui.h24);
function fmtShort(m){
  m = ((Math.round(m) % 1440) + 1440) % 1440;
  const h = Math.floor(m/60), mm = m % 60;
  if (h24()) return `${pad(h)}:${pad(mm)}`;
  return `${h % 12 === 0 ? 12 : h % 12}:${pad(mm)}`;
}
function fmtTime(m){
  m = ((Math.round(m) % 1440) + 1440) % 1440;
  const h = Math.floor(m/60), mm = m % 60;
  if (h24()) return `${pad(h)}:${pad(mm)}`;
  return `${h % 12 === 0 ? 12 : h % 12}:${pad(mm)} ${h >= 12 ? 'PM' : 'AM'}`;
}
function hourLabel(m){
  const h = Math.floor(m/60) % 24;
  if (h24()) return pad(h);
  return `${h % 12 === 0 ? 12 : h % 12}${h >= 12 ? 'p' : 'a'}`;
}
function fmtDur(m){
  m = Math.round(m);
  if (m < 60) return m + 'm';
  return (m % 60 === 0) ? (m / 60) + 'h' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
}
const maxDur = type => type === 'fixed' ? MAX_FIXED : MAX_STUDY;
const minDur = type => type === 'fixed' ? MIN_FIXED : MIN_STUDY;

/* "930", "9:30", "9.30", "9:30pm", "21:30", "9p" — ref decides AM/PM when omitted */
function parseTime(raw, ref){
  const s = String(raw).trim().toLowerCase().replace(/\s+/g, '');
  const m = s.match(/^(\d{1,2})(?:[:.h]?(\d{2}))?([ap])?m?$/);
  if (!m) return NaN;
  let h = parseInt(m[1], 10);
  const mi = m[2] ? parseInt(m[2], 10) : 0;
  if (mi > 59) return NaN;
  if (m[3]){
    if (h < 1 || h > 12) return NaN;
    h = (h % 12) + (m[3] === 'p' ? 12 : 0);
  } else if (h >= 13 || h === 0){
    if (h > 23) return NaN;
  } else if (h24() && h >= 1 && h <= 12 && s.length > 2){
    /* 24h clock: take it literally */
  } else {
    h = (h % 12) + (((ref || 0) % 1440) >= 720 ? 12 : 0);
  }
  return h * 60 + mi;
}
/* "45", "1h30", "1.5h", "90m" */
function parseDur(raw){
  const s = String(raw).trim().toLowerCase();
  let m = s.match(/^(\d+(?:\.\d+)?)\s*h(?:ours?|rs?)?\s*(\d+)?\s*(?:m|min)?$/);
  if (m) return Math.round(parseFloat(m[1]) * 60 + (m[2] ? parseInt(m[2], 10) : 0));
  m = s.match(/^(\d+(?:\.\d+)?)/);
  return m ? Math.round(parseFloat(m[1])) : NaN;
}
function haptic(ms = 8){
  if (state && state.settings && state.settings.ui && !state.settings.ui.haptics) return;
  try {
    if (NATIVE){ NATIVE.haptic(Array.isArray(ms) ? 30 : ms); return; }
    if (navigator.vibrate) navigator.vibrate(ms);
  } catch(_){}
}

/* ============================================================
   STATE
============================================================ */
let state, drag = null;
const sheetCtx = { mode:null, id:null, recurringId:null, draft:null, phase:null };

function defaultState(){
  return {
    version: 2, date: todayKey(),
    settings: { wake:390, sleep:1380, notif:{ ...DEFAULT_NOTIF }, plan:{ ...DEFAULT_PLAN }, ui:{ ...DEFAULT_UI } },
    subjects: [], materials: [], tasks: {}, recurring: [], history: [], prefs: {}, days: {}
  };
}
function load(){
  try {
    let raw = null;
    if (NATIVE){
      try { raw = NATIVE.getState(); } catch(_){}
      if (!raw) raw = localStorage.getItem(STORAGE_KEY);
    } else raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    return data.version === 2 ? data : null;
  } catch(e){ return null; }
}
let persistAsked = false;
function save(){
  try {
    const out = Object.assign({}, state);
    out.history = (state.history || []).slice(-3000);
    if (NATIVE) NATIVE.saveState(JSON.stringify(out));
    else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(out));
      if (!persistAsked){ persistAsked = true; if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }
    }
  } catch(e){ console.warn('save failed', e); }
}
/* one normaliser for every way state can arrive (boot, native reload, import, undo) */
function normalizeState(){
  const S = state;
  S.recurring = S.recurring || []; S.history = S.history || []; S.tasks = S.tasks || {};
  S.subjects = S.subjects || []; S.materials = S.materials || []; S.prefs = S.prefs || {}; S.days = S.days || {};
  S.settings = S.settings || { wake:390, sleep:1380 };
  S.settings.wake = clamp(S.settings.wake ?? 390, 0, 720);
  S.settings.sleep = clamp(S.settings.sleep ?? 1380, 720, MAX_BED);
  S.settings.notif = Object.assign({}, DEFAULT_NOTIF, S.settings.notif || {});
  S.settings.plan = Object.assign({}, DEFAULT_PLAN, S.settings.plan || {});
  S.settings.ui = Object.assign({}, DEFAULT_UI, S.settings.ui || {});
  for (const m of S.materials){
    if (!Array.isArray(m.subjectIds)) m.subjectIds = m.subjectId ? [m.subjectId] : [];
    m.subjectIds = m.subjectIds.filter(id => S.subjects.some(s => s.id === id));
    m.subjectId = m.subjectIds[0] || null;
  }
  for (const r of S.recurring) if (!CATS[r.cat]) r.cat = 'cl';
  for (const k in S.tasks) for (const t of S.tasks[k]){
    if (t.type === 'fixed'){ if (!CATS[t.cat]) t.cat = 'cl'; continue; }
    if (!Array.isArray(t.subjectIds)){
      const m = t.matId && S.materials.find(x => x.id === t.matId);
      t.subjectIds = t.subjectId ? [t.subjectId] : (m ? [...m.subjectIds] : []);
    }
    t.subjectIds = t.subjectIds.filter(id => S.subjects.some(s => s.id === id));
    t.subjectId = t.subjectIds[0] || null;
  }
  for (const r of S.history){ if (!r.subs) r.subs = r.subjectId ? [r.subjectId] : []; if (r.w == null) r.w = 1; }
  const cutoff = shiftDate(todayKey(), -120);
  for (const k in S.days) if (k < cutoff) delete S.days[k];
  S.history = S.history.filter(r => !r.date || r.date >= cutoff);
  applyUi();
}
function initState(){
  state = load() || defaultState();
  normalizeState();
  state.date = todayKey();
}
const tasksOn = d => (state.tasks[d] || (state.tasks[d] = []));
const dayGet = key => state.days[key] || {};
const dayInfo = key => (state.days[key] || (state.days[key] = {}));
const plan = () => state.settings.plan;

function allTasksOn(dateKey){
  const concrete = [...(state.tasks[dateKey] || [])];
  const dow = isoDow(dateKey);
  const rec = (state.recurring || [])
    .filter(r => r.days && r.days.includes(dow) && (!r.until || dateKey <= r.until))
    .map(r => ({ id:'rec:'+r.id+':'+dateKey, recurringId:r.id, type:'fixed', cat:r.cat || 'cl',
                 title:r.title, start:r.start, dur:r.dur, virtual:true }));
  return [...concrete, ...rec];
}
function findTask(id){
  if (typeof id === 'string' && id.startsWith('rec:')){
    const tpl = state.recurring.find(x => x.id === id.split(':')[1]);
    return tpl ? { id, recurringId:tpl.id, type:'fixed', cat:tpl.cat || 'cl', title:tpl.title, start:tpl.start, dur:tpl.dur, virtual:true } : null;
  }

}
function taskDate(id){ for (const k in state.tasks) if (state.tasks[k].some(x => x.id === id)) return k; return null; }

/* ---------- subjects / materials ---------- */
const subjectById = id => state.subjects.find(s => s.id === id);
const materialById = id => state.materials.find(m => m.id === id);
const subjectName = id => { const s = subjectById(id); return s ? s.name : ''; };
const subjectNames = ids => ids.map(subjectName).filter(Boolean).join(' · ');
/* A study block may reference a material AND any subjects. Credit goes to the block's subjects. */
function subjectsOfTask(t){
  if (!t || t.type === 'fixed') return [];
  const own = (t.subjectIds || []).filter(id => subjectById(id));
  if (own.length) return own;
  const m = t.matId && materialById(t.matId);
  return m ? m.subjectIds : [];
}
function colorForTask(t){
  if (t.type === 'fixed') return catOf(t).color;
  const m = t.matId && materialById(t.matId);
  if (m) return m.color;
  const s = subjectById(subjectsOfTask(t)[0]);
  return s ? (s.color || '#7a8194') : '#7a8194';
}
function subjectMinutes(list, completed){
  const out = {};
  for (const t of list){
    if (t.type !== 'study') continue;
    const mins = completed ? t.dur * ((t.pct || 0) / 100) : t.dur;
    for (const sid of subjectsOfTask(t)) out[sid] = (out[sid] || 0) + mins;
  }
  return out;
}
function studyTitle(matId, subIds){

  return m ? m.title : (subjectNames(subIds) || 'Study').replace(/ · /g, ' + ');
}

/* ============================================================
   UI SETTINGS (applied to the document, no re-render needed)
============================================================ */

function applyUi(){

/* ============================================================
   UNDO — snapshot based, works for any change
============================================================ */
let undoSnap = null;
function snapState(){
  const S = state;
  return JSON.stringify({ tasks:S.tasks, materials:S.materials, subjects:S.subjects, recurring:S.recurring,
                          settings:S.settings, prefs:S.prefs, days:S.days });
}
function offerUndo(desc, before, duration){

  toast(desc, { duration: duration || 4500, action: { label:'Undo', fn: () => {

/* ============================================================
   TIME WINDOW — visible timeline range for a day
============================================================ */
function dayWindow(key){
  key = key || state.date;
  const S = state.settings;
  let lo = S.wake, hi = dayGet(key).bed || S.sleep;
  for (const t of allTasksOn(key)){
    lo = Math.min(lo, Math.floor(t.start / 30) * 30);
    hi = Math.max(hi, Math.ceil((t.start + t.dur) / 30) * 30);
  }
  return [Math.max(0, lo), Math.min(MAX_BED, hi)];
}

/* ============================================================
   OVERLAP / PLACEMENT (manual edits)
============================================================ */
const overlaps = (placed, s, dur) => placed.some(p => s < p.start + p.dur && s + dur > p.start);
function placeBlock(t, placed, lo, hi, pref){
  const maxStart = hi - t.dur;
  const s = clamp(pref, lo, Math.max(lo, maxStart));
  if (!overlaps(placed, s, t.dur)) return s;
  const span = Math.max(60, maxStart - lo);
  for (let d = 5; d <= span; d += 5){
    if (s + d <= maxStart && !overlaps(placed, s + d, t.dur)) return s + d;
    if (s - d >= lo && !overlaps(placed, s - d, t.dur)) return s - d;
  }
  return s;
}
/* keep movable (study) blocks clear of fixed + recurring blocks and of each other */
function resolve(list, key){
  key = key || state.date;
  const [lo, hi] = dayWindow(key);
  const fixed = list.filter(t => t.type === 'fixed');
  const rec = allTasksOn(key).filter(t => t.virtual);
  const movable = list.filter(t => t.type !== 'fixed').sort((a,b) => a.start - b.start);
  const placed = [...fixed, ...rec].sort((a,b) => a.start - b.start);
  for (const t of movable){
    t.start = placeBlock(t, placed, lo, hi, t.start);
    placed.push(t); placed.sort((a,b) => a.start - b.start);
  }
}
function freeIntervals(busy, start, end, minLen = 15){
  const b = [...busy].sort((a,x) => a.start - x.start);
  const out = []; let cur = start;
  for (const x of b){
    const s = Math.max(x.start, start), e = Math.min(x.start + x.dur, end);
    if (s > cur) out.push([cur, s]);
    cur = Math.max(cur, e);
  }
  if (cur < end) out.push([cur, end]);
  return out.filter(([s,e]) => e - s >= minLen);
}

/* ============================================================
   LEARNING MODEL
   Every block teaches the planner, rated or not:
     • stars            → explicit signal (weight 1)
     • done / missed    → implicit signal (weight .3–.45): finished ≈ 3.6/5, missed ≈ 1.6/5
   Signals decay with a half-life you can tune. Estimates are Bayesian-shrunk toward a sensible
   prior, so one block already nudges the plan, and confidence grows with every block.
   Layers: hour-of-day → weekday/weekend → per-subject.  Also learns: ideal block length,
   typical daily output, real wake-up / wind-down times.
============================================================ */
const DUR_BUCKETS = [25, 30, 40, 45, 50, 60, 75, 90];
let modelDirty = true, _model = null;
const priorEnergy = h => {
  const t = h + 0.5, g = (x,c,w) => Math.exp(-((x-c)*(x-c))/(2*w*w));
  return 2 + 3 * (0.25 + 0.75 * Math.max(g(t,10,2.2), g(t,16,2.2), 0.6*g(t,20,1.6)));
};
function recSignal(r){
  if (r.eff > 0) return { v: r.eff, w: 1 };
  const p = clamp((r.pct || 0) / 100, 0, 1);
  return { v: 1.6 + 2 * p, w: r.ended ? 0.45 : 0.3 };
}
function buildModel(){
  const P = plan();
  const tau = Math.max(2, P.learnDays || 10) / Math.LN2;
  const now = Date.now();
  const mk = () => ({ S: new Array(24).fill(0), W: new Array(24).fill(0) });
  const G = mk(), WE = mk(), WD = mk(), SUBJ = {};
  const D = { S:{}, W:{} };
  let n = 0, wsum = 0;
  if (P.learn !== false){
    for (const r of state.history){
      const { v, w } = recSignal(r);
      const age = Math.max(0, (now - r.ts) / 86400000);
      const wt = w * Math.exp(-age / tau);
      if (wt < 0.003) continue;
      n++; wsum += wt;
      const wk = r.date && isoDow(r.date) >= 6 ? WE : WD;
      /* spread the signal over every hour the block touched */
      const end = r.start + r.dur;
      for (let h = Math.floor(r.start / 60); h * 60 < end; h++){
        const ov = Math.min(end, (h + 1) * 60) - Math.max(r.start, h * 60);
        if (ov <= 0) continue;
        const f = ov / r.dur, hh = ((h % 24) + 24) % 24;
        G.S[hh] += wt * f * v; G.W[hh] += wt * f;
        wk.S[hh] += wt * f * v; wk.W[hh] += wt * f;
        for (const sid of (r.subs || [])){
          const o = SUBJ[sid] || (SUBJ[sid] = mk());
          o.S[hh] += wt * f * v; o.W[hh] += wt * f;
        }
      }
      const b = DUR_BUCKETS.reduce((a, x) => Math.abs(x - r.dur) < Math.abs(a - r.dur) ? x : a, 45);
      D.S[b] = (D.S[b] || 0) + wt * v; D.W[b] = (D.W[b] || 0) + wt;
    }
  }
  const base = [];
  for (let h = 0; h < 24; h++) base[h] = (G.S[h] + 1.2 * priorEnergy(h)) / (G.W[h] + 1.2);
  const smooth = a => a.map((v, h) => (a[(h + 23) % 24] + 2 * v + a[(h + 1) % 24]) / 4);
  const gl = smooth(base);
  const split = (acc) => smooth(gl.map((v, h) => (acc.S[h] + 3 * v) / (acc.W[h] + 3)));
  const wd = split(WD), we = split(WE);
  const subj = {};
  for (const sid in SUBJ) subj[sid] = { wd: smooth(wd.map((v, h) => (SUBJ[sid].S[h] + 3 * v) / (SUBJ[sid].W[h] + 3))),
                                         we: smooth(we.map((v, h) => (SUBJ[sid].S[h] + 3 * v) / (SUBJ[sid].W[h] + 3))) };
  _model = { gl, wd, we, subj, D, n, wsum };
  modelDirty = false;
  return _model;
}
const model = () => (!_model || modelDirty) ? buildModel() : _model;
/* expected focus (1–5) for a block [start, start+dur) */
function energy(start, dur, subs, dateKey){
  const m = model(), we = dateKey && isoDow(dateKey) >= 6;
  let s = 0, wsum = 0;
  for (let t = start; t < start + dur; t += 15){
    const h = ((Math.floor(t / 60) % 24) + 24) % 24;
    let v;
    if (subs && subs.length){ v = 0; for (const sid of subs){ const o = m.subj[sid]; v += o ? (we ? o.we[h] : o.wd[h]) : (we ? m.we[h] : m.wd[h]); } v /= subs.length; }
    else v = we ? m.we[h] : m.wd[h];
    s += v; wsum++;
  }
  return s / Math.max(1, wsum);
}
function preferredDur(){
  const P = plan();
  if (P.blockLen > 0) return P.blockLen;
  if (P.learn === false) return 45;
  const m = model();
  let best = 45, bestV = 3.3;
  for (const b of DUR_BUCKETS){
    const v = ((m.D.S[b] || 0) + 1.5 * 3.3) / ((m.D.W[b] || 0) + 1.5);
    if (v > bestV + 0.06){ bestV = v; best = b; }
  }
  return clamp(best, P.minBlock, P.maxBlock);
}
/* record / update what happened to a block (rating optional) — call whenever it changes */
function learnFrom(t, ended){
  if (t.type !== 'study' || plan().learn === false) return;
  const i = state.history.findIndex(r => r.blockId === t.id);
  const rec = { blockId:t.id, ts:Date.now(), date:taskDate(t.id) || state.date, start:t.start, dur:t.dur,
                subs:subjectsOfTask(t), matId:t.matId || null, pct:t.pct || 0, eff:t.eff || 0, ended:!!ended, w:1 };
  if (i >= 0){ rec.ts = state.history[i].ts; state.history[i] = rec; } else state.history.push(rec);
  modelDirty = true;
}
/* typical finished minutes per day (recent days weigh more) */
function typicalOutput(){
  let s = 0, w = 0;
  for (let i = 1; i <= 14; i++){
    const key = shiftDate(todayKey(), -i);
    const ts = (state.tasks[key] || []).filter(t => t.type === 'study');
    const planned = ts.reduce((a, t) => a + t.dur, 0);
    if (planned < 30) continue;
    const done = ts.reduce((a, t) => a + t.dur * ((t.pct || 0) / 100), 0);
    const wt = Math.exp(-i / 6);
    s += done * wt; w += wt;
  }
  return w ? s / w : 0;
}
/* wake-up / bedtime habits from Start day / End day taps */
function learnedWindow(){
  const keys = Object.keys(state.days).sort();
  let st = null, en = null, ns = 0, ne = 0;
  for (const k of keys.slice(-21)){
    const d = state.days[k];
    if (d.startedAt != null){ st = st == null ? d.startedAt : st * 0.65 + d.startedAt * 0.35; ns++; }
    if (d.endedAt != null){ en = en == null ? d.endedAt : en * 0.65 + d.endedAt * 0.35; ne++; }
  }
  return { start: st == null ? null : Math.round(st), end: en == null ? null : Math.round(en), ns, ne };
}
/* window the planner should use for a day (adapts to real habits, within sane limits) */
function plannerWindow(key){
  const S = state.settings, P = plan();
  let lo = S.wake, hi = dayGet(key).bed || S.sleep;
  if (P.adapt){
    const L = learnedWindow();
    if (L.ns >= 2) lo = clamp(L.start, S.wake - 120, S.wake + 180);
    if (L.ne >= 2) hi = Math.max(hi, clamp(L.end, S.sleep - 90, S.sleep + P.bedStretch));
  }
  return [roundTo(lo, 5), Math.min(MAX_BED, hi)];
}

/* ============================================================
   PLANNER ENGINE
   Needs → chunks → scored placement.  Used by Auto-plan, Re-fit and carry-over.
============================================================ */
function buildChunks(key, kept, capacityLeft){
  const P = plan();
  const keptStudy = kept.filter(t => t.type === 'study');
  const goal = {}, needS = {}, credS = {}, credM = {};
  for (const t of keptStudy){
    const mins = t.done ? t.dur : t.dur * ((t.pct || 0) / 100);
    if (t.matId) credM[t.matId] = (credM[t.matId] || 0) + mins;
    for (const sid of subjectsOfTask(t)) credS[sid] = (credS[sid] || 0) + mins;
  }
  for (const s of state.subjects){
    goal[s.id] = s.dailyGoalMin || 0;
    needS[s.id] = Math.max(0, goal[s.id] - (credS[s.id] || 0));
  }
  const items = [];
  for (const m of state.materials){
    const cap = Math.max(0, (m.total - m.done) * m.unitMin - (credM[m.id] || 0));
    if (cap < P.minBlock) continue;
    const own = m.dailyGoalMin || 0;
    items.push({ key:'m:' + m.id, m, cap, own, needM: Math.max(0, own - (credM[m.id] || 0)) });
  }
  const pdur = preferredDur(), minB = P.minBlock, maxB = Math.max(P.maxBlock, minB), MIN_NEED = 15;
  const assigned = {}, chunks = [];
  let total = keptStudy.reduce((a, t) => a + t.dur, 0), capacity = capacityLeft;
  for (let guard = 0; guard < 80 && chunks.length < 14; guard++){
    let best = null;
    for (const it of items){
      if (it.cap < minB) continue;
      let subNeed = 0, subNeedMin = 0;
      for (const sid of it.m.subjectIds){
        if (goal[sid] > 0){ subNeed += needS[sid] / goal[sid]; subNeedMin = Math.max(subNeedMin, needS[sid]); }
      }
      const want = Math.min(it.cap, Math.max(subNeedMin, it.needM));
      if (want < MIN_NEED) continue;
      const ownFrac = it.own > 0 ? it.needM / it.own : 0;
      const behind = 1 - clamp(it.m.done / Math.max(1, it.m.total), 0, 1);
      const pr = 0.6 * subNeed + 0.4 * ownFrac + 0.25 * behind - 0.18 * (assigned[it.key] || 0);
      if (!best || pr > best.pr + 1e-9 || (Math.abs(pr - best.pr) <= 1e-9 && want > best.want)) best = { kind:'mat', it, want, pr, key:it.key };
    }
    for (const s of state.subjects){
      if (needS[s.id] < MIN_NEED) continue;
      if (items.some(it => it.cap >= minB && it.m.subjectIds.includes(s.id))) continue;
      const key2 = 's:' + s.id;
      const pr = 0.6 * (needS[s.id] / Math.max(1, goal[s.id])) + 0.1 - 0.18 * (assigned[key2] || 0);
      if (!best || pr > best.pr + 1e-9) best = { kind:'subj', s, want:needS[s.id], pr, key:key2 };
    }
    if (!best) break;
    const k = Math.max(1, Math.round(best.want / pdur));
    let dur = clamp(roundTo(best.want / k, 5), minB, maxB);
    if (best.kind === 'mat') dur = Math.min(dur, Math.floor(best.it.cap / 5) * 5);
    const overCap = P.maxDay > 0 && total + dur > P.maxDay;
    if (dur < minB || capacity < dur || overCap){
      if (best.kind === 'mat') best.it.cap = 0; else needS[best.s.id] = 0;
      continue;
    }
    capacity -= dur + P.breakLen; total += dur;
    assigned[best.key] = (assigned[best.key] || 0) + 1;
    if (best.kind === 'mat'){
      const subs = best.it.m.subjectIds;
      for (const sid of subs) needS[sid] = Math.max(0, (needS[sid] || 0) - dur);
      best.it.needM = Math.max(0, best.it.needM - dur); best.it.cap -= dur;
      chunks.push({ matId:best.it.m.id, subs:[...subs], dur, title:best.it.m.title });
    } else {
      needS[best.s.id] = Math.max(0, needS[best.s.id] - dur);
      chunks.push({ matId:null, subs:[best.s.id], dur, title:best.s.name });
    }
  }
  chunks.forEach((c, i) => { c.rank = (P.hardFirst && chunks.length > 1) ? 1 - i / (chunks.length - 1) : 0.5; });
  const unmet = Object.keys(needS).reduce((a, k) => a + needS[k], 0);
  return { chunks, unmet };
}

/* score every 15-min start in the free intervals, place chunks one by one (most important first) */
function placeEngine(chunks, free, placed, o){
  const P = plan(), key = o.key;
  const wVar = [0, 0.9, 1.8][P.variety] ?? 0.9;
  const learned = model().n > 0;
  const wE = learned ? 1.9 : 1.0, wSpread = learned ? 0.7 : 1.2;
  const span = Math.max(60, o.hi - o.lo);
  const out = [], left = [];
  const segLoad = s => { const seg = Math.floor((s - o.lo) / 120);
    return placed.reduce((a, p) => Math.floor((p.start - o.lo) / 120) === seg ? a + (p.end - p.start) : a, 0); };
  const chainLen = (s, e) => {
    const all = [...placed, { start:s, end:e }].sort((a, b) => a.start - b.start);
    let best = 1, cur = 1;
    for (let i = 1; i < all.length; i++){ cur = (all[i].start - all[i-1].end <= o.brk + 5) ? cur + 1 : 1; best = Math.max(best, cur); }
    return best;
  };
  const bestStart = (c, dur) => {
    let best = null;
    for (const [a, b] of free){
      const cands = new Set([a, b - dur]);
      for (let s = ceilTo(a, 15); s + dur <= b; s += 15) cands.add(s);
      for (const s of cands){
        if (s < a || s + dur > b) continue;
        const e = s + dur;
        if (placed.some(p => s < p.end + o.brk && e > p.start - o.brk)) continue;
        let sc = wE * clamp(energy(s, dur, c.subs, key) / 5, 0, 1) * (1 + 0.5 * c.rank);
        sc += wSpread * (1 - clamp(segLoad(s) / 90, 0, 1));
        const f = (s - o.lo) / span;
        sc += 0.35 * (P.tone > 0 ? f : P.tone < 0 ? 1 - f : 0);
        if (o.soon) sc += o.soon * (1 - clamp((s - o.lo) / 240, 0, 1));      // overdue work wants to happen soon
        for (const p of placed){
          const gap = s >= p.end ? s - p.end : (p.start >= e ? p.start - e : 999);
          if (gap > 60) continue;
          if (wVar && p.subs.some(x => c.subs.includes(x))) sc -= wVar; else sc += 0.12;
          if (gap <= o.brk + 5) sc += 0.2;
        }
        if (s === a || e === b) sc += 0.15;
        const chain = chainLen(s, e);
        if (chain > P.longEvery) sc -= 0.5 * (chain - P.longEvery);
        if (P.windDown > 0 && e > o.hi - P.windDown) sc -= 0.4;
        if (s < o.lo + P.rampUp && o.ramp) sc -= 0.15;
        if (s % 15 === 0) sc += 0.05;
        if (!best || sc > best.sc + 1e-9) best = { s, sc };
      }
    }
    return best;
  };
  for (const c of chunks){
    let spot = null, dur = c.dur;
    const floor = Math.max(MIN_STUDY, roundTo(c.dur * (1 - (o.shrinkFrac || 0)), 5));
    for (; dur >= floor; dur -= 5){ spot = bestStart(c, dur); if (spot) break; }
    if (!spot){ left.push(c); continue; }
    placed.push({ start:spot.s, end:spot.s + dur, subs:c.subs });
    out.push({ chunk:c, start:spot.s, dur });
  }
  return { out, left };
}

/* ============================================================
   AUTO-PLAN
============================================================ */
function autoPlan(){
  const key = state.date, P = plan();
  if (key < todayKey()){ toast('That day is over'); return; }
  if (!state.subjects.length && !state.materials.length){ toast('Add a subject first'); return; }
  const info = dayGet(key);
  let [lo, hi] = plannerWindow(key);
  const ramp = info.startedAt == null;
  if (info.startedAt != null) lo = info.startedAt;
  else if (ramp) lo += P.rampUp;
  if (key === todayKey()) lo = Math.max(lo, ceilTo(nowMinutes() + (info.startedAt != null ? 0 : 5), 5));
  hi = Math.max(hi, dayWindow(key)[1]);
  if (hi - lo < P.minBlock){ toast('No time left'); return; }

  const before = snapState();
  const concrete = tasksOn(key);
  const rec = allTasksOn(key).filter(t => t.virtual);
  const kept = concrete.filter(t => t.type === 'fixed' || t.done || ((t.pct || 0) > 0 && key === todayKey() && t.start + t.dur <= lo));
  const buf = P.fixedBuffer;
  const busy = [...kept, ...rec].map(t => t.type === 'fixed' ? { start:t.start - buf, dur:t.dur + 2 * buf } : { start:t.start, dur:t.dur });
  const free = freeIntervals(busy, lo, hi, P.minBlock);
  if (!free.length){ toast('No free time'); return; }
  const capacity = free.reduce((a, [s, e]) => a + (e - s), 0);
  const { chunks, unmet } = buildChunks(key, kept, capacity);
  if (!chunks.length){ toast('Goals already met'); return; }

  const placed = kept.filter(t => t.type === 'study').map(t => ({ start:t.start, end:t.start + t.dur, subs:subjectsOfTask(t) }));
  const { out } = placeEngine(chunks, free, placed, { key, lo, hi, brk:P.breakLen, shrinkFrac:0.3, ramp });
  if (!out.length){ toast('No room for a block'); return; }
  const created = out.map(p => ({
    id:uid(), type:'study', matId:p.chunk.matId, subjectId:p.chunk.subs[0] || null, subjectIds:[...p.chunk.subs],
    title:p.chunk.title, start:p.start, dur:p.dur, done:false, pct:0, eff:0
  })).sort((a, b) => a.start - b.start);
  state.tasks[key] = [...kept, ...created];
  resolve(state.tasks[key], key);
  save(); render();
  scrollToTime(created[0].start);
  haptic([10, 30, 10]);
  const mins = created.reduce((a, t) => a + t.dur, 0);
  offerUndo(`${created.length} block${created.length > 1 ? 's' : ''} · ${fmtDur(mins)}${unmet > 20 ? ' · some goals won\'t fit' : ''}`, before);
}

/* ============================================================
   RE-FIT — you're late (or behind): slot missed blocks into gaps and breaks, tighten breaks,
   shrink a little, re-pack the rest of the day, and only then slide bedtime (never past your
   limit). Whatever still can't fit rolls to tomorrow instead of disappearing.
============================================================ */
function refit(T){
  const key = todayKey(), P = plan();
  const list = tasksOn(key);
  const study = list.filter(t => t.type === 'study');
  const untouched = t => !t.done && !(t.pct > 0);
  const missed = study.filter(t => untouched(t) && t.start < T).sort((a, b) => a.start - b.start);
  if (!missed.length) return { moved:0 };
  const future = study.filter(t => untouched(t) && t.start >= T).sort((a, b) => a.start - b.start);
  const rec = allTasksOn(key).filter(t => t.virtual);
  const buf = P.fixedBuffer;
  const base = [...list.filter(t => t.type === 'fixed'), ...rec].map(t => ({ start:t.start - buf, dur:t.dur + 2 * buf }));
  const past = study.filter(t => !untouched(t));            // done / partly done: stay exactly where they are
  const hiBase = dayGet(key).bed || state.settings.sleep;
  const toChunk = (t, i, n) => ({ ref:t, subs:subjectsOfTask(t), dur:t.dur, title:t.title, rank: n > 1 ? 1 - i / (n - 1) : 1 });

  const solve = (move, stay, hi, relaxed) => {
    const occupied = [...base, ...past.map(t => ({ start:t.start, dur:t.dur })), ...stay.map(t => ({ start:t.start, dur:t.dur }))];
    const free = freeIntervals(occupied, T, hi, 10);
    const placed = [...past, ...stay].map(t => ({ start:t.start, end:t.start + t.dur, subs:subjectsOfTask(t) }));
    const brk = relaxed ? Math.min(BREAK_MIN, P.breakLen) : P.breakLen;
    return placeEngine(move.map((t, i) => toChunk(t, i, move.length)), free, placed,
      { key, lo:T, hi, brk, shrinkFrac: relaxed ? 0.25 : 0, ramp:false, soon:1.1 });
  };
  const attempts = [
    () => ({ r: solve(missed, future, hiBase, false), tight:false, bed:null, all:false }),
    () => ({ r: solve(missed, future, hiBase, true),  tight:true,  bed:null, all:false }),
    () => ({ r: solve([...missed, ...future], [], hiBase, true), tight:true, bed:null, all:true })
  ];
  if (P.bedStretch > 0) for (let x = 15; x <= P.bedStretch; x += 15){
    const hi = Math.min(MAX_BED, hiBase + x);
    attempts.push(() => ({ r: solve([...missed, ...future], [], hi, true), tight:true, bed:hi, all:true }));
  }
  let chosen = null, fallback = null;
  for (const run of attempts){
    const a = run();
    if (!a.r.left.length){ chosen = a; break; }
    if (!fallback || a.r.left.length < fallback.r.left.length) fallback = a;
  }
  const pick = chosen || fallback;
  const res = { moved:0, tight:pick.tight, shrunk:0, bedTo:pick.bed, carried:0 };
  for (const p of pick.r.out){
    const t = p.chunk.ref;
    if (t.dur !== p.dur) res.shrunk++;
    if (t.start !== p.start || t.dur !== p.dur) res.moved++;
    t.start = p.start; t.dur = p.dur;
  }
  if (pick.r.left.length){
    const lost = pick.r.left.map(c => c.ref);
    res.carried = carryBlocks(lost, shiftDate(key, 1), true);
  }
  if (pick.bed) dayInfo(key).bed = pick.bed;
  resolve(list, key);
  return res;
}

/* move / copy unfinished blocks to another day, placed from that day's start with breaks between */
function carryBlocks(blocks, toKey, removeFromToday){
  const P = plan();
  const [lo] = plannerWindow(toKey);
  let cur = lo + P.rampUp, n = 0;
  const dest = tasksOn(toKey);
  for (const t of blocks){
    const rem = t.pct > 0 ? Math.max(15, roundTo(t.dur * (1 - t.pct / 100), 5)) : t.dur;
    dest.push({ id:uid(), type:'study', matId:t.matId || null, subjectId:(t.subjectIds || [])[0] || null,
                subjectIds:[...(t.subjectIds || [])], title:t.title, start:cur, dur:rem, done:false, pct:0, eff:0, carried:true });
    cur += rem + P.breakLen; n++;
    if (removeFromToday){ const src = tasksOn(taskDate(t.id) || state.date); const i = src.indexOf(t); if (i >= 0) src.splice(i, 1); }
    else t.carried = true;
  }
  resolve(dest, toKey);
  return n;
}

/* ============================================================
   DAY RITUAL — Start day / End day
============================================================ */
function startDay(T, doRefit){
  const key = todayKey(), info = dayInfo(key);
  const before = snapState();
  info.startedAt = T; delete info.endedAt;
  const res = doRefit ? refit(T) : { moved:0 };
  save(); render();
  return { res, before };
}
function dayStats(key){
  const ts = (state.tasks[key] || []).filter(t => t.type === 'study');
  const planned = ts.reduce((a, t) => a + t.dur, 0);
  const done = ts.reduce((a, t) => a + t.dur * ((t.pct || 0) / 100), 0);
  const open = ts.filter(t => !t.done && (t.pct || 0) < 100);
  const rated = ts.filter(t => t.eff > 0).map(t => t.eff);
  return { ts, planned, done, open, pct: planned ? done / planned : 0, avg: rated.length ? rated.reduce((a, b) => a + b, 0) / rated.length : 0 };
}
function endDay(carry){
  const key = todayKey(), info = dayInfo(key);
  const before = snapState();
  const st = dayStats(key);
  for (const t of st.ts) learnFrom(t, true);                  // missed blocks teach the planner too
  info.endedAt = Math.round(nowMinutes());
  let carried = 0;
  if (carry){
    const movers = st.ts.filter(t => !t.done && (t.pct || 0) < 85 && !t.carried);
    if (movers.length) carried = carryBlocks(movers, shiftDate(key, 1), false);
  }
  save(); render();
  return { st, carried, before };
}
function streak(){
  let n = 0;
  for (let i = 0; i < 120; i++){
    const key = shiftDate(todayKey(), -i), st = dayStats(key);
    if (!st.planned){ if (i === 0) continue; break; }
    if (st.pct >= 0.6) n++; else if (i > 0) break;
  }
  return n;
}
/* planned vs what you usually finish (or your own cap) */
function workload(key){
  const planned = dayStats(key).planned, P = plan();
  const typical = typicalOutput();
  const cap = P.maxDay > 0 ? P.maxDay : (typical > 90 ? typical * 1.35 : 0);
  return { planned, cap, over: cap > 0 && planned > cap + 10, typical };
}
function currentBlock(key){
  const m = nowMinutes();
  const live = allTasksOn(key).filter(t => !t.done && m >= t.start && m < t.start + t.dur);
  return live.find(t => t.type === 'study') || live[0] || null;
}
function nextBlock(key){
  const m = nowMinutes();
  return allTasksOn(key).filter(t => !t.done && t.start > m).sort((a, b) => a.start - b.start)[0] || null;
}
function missedBlocks(key){
  const m = nowMinutes();
  return (state.tasks[key] || []).filter(t => t.type === 'study' && !t.done && !(t.pct > 0) && t.start + t.dur <= m);
}

/* ============================================================
   MOTION HELPERS — transform / opacity only, skipped when reduced motion is on
============================================================ */
const reducedMotion = () => document.documentElement.classList.contains('rm') ||
  (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function anim(el, frames, opts){
  if (!el || reducedMotion() || !el.animate) return;
  el.animate(frames, Object.assign({ duration: 240, easing: 'cubic-bezier(.2,.8,.2,1)' }, opts || {}));
}
const pop = el => anim(el, [{ transform:'scale(.9)' }, { transform:'scale(1.08)' }, { transform:'scale(1)' }], { duration: 260 });

/* ============================================================
   DELETE (all undoable)
============================================================ */
function deleteTaskObj(t){
  const before = snapState(), list = tasksOn(taskDate(t.id) || state.date);
  const i = list.findIndex(x => x.id === t.id);
  if (i < 0) return;
  list.splice(i, 1);
  save(); render(); haptic(15);
  offerUndo('Block deleted', before);
}
function deleteRecurring(id){
  const before = snapState();
  state.recurring = state.recurring.filter(r => r.id !== id);
  save(); render(); haptic(15);
  offerUndo('Weekly block removed', before);
}
function deleteSubject(id){
  const before = snapState();
  state.subjects = state.subjects.filter(s => s.id !== id);
  normalizeState(); save(); render(); haptic(15);
  offerUndo('Subject removed', before);
}
function deleteMaterial(id){
  const before = snapState();
  state.materials = state.materials.filter(m => m.id !== id);
  save(); render(); haptic(15);
  offerUndo('Material removed', before);
}

/* ============================================================
   RENDER
============================================================ */
function weekDates(){
  const d = dateObj(state.date), ws = state.settings.ui.weekStart;
  const back = ws === 1 ? (d.getDay() + 6) % 7 : d.getDay();
  const first = new Date(d); first.setDate(d.getDate() - back);
  return Array.from({ length: 7 }, (_, i) => { const x = new Date(first); x.setDate(first.getDate() + i); return x; });
}
const dayProgress = key => dayStats(key).pct;
function renderWeek(){
  const today = todayKey();
  $('#week').innerHTML = weekDates().map(d => {
    const key = iso(d), p = dayProgress(key);
    return `<button class="day-chip ${key === state.date ? 'active' : ''} ${key === today ? 'today' : ''}" data-date="${key}">
      <span class="dow">${'SMTWTFS'[d.getDay()]}</span><span class="dnum">${d.getDate()}</span>
      <span class="dbar"><i style="width:${(p * 100).toFixed(0)}%"></i></span></button>`;
  }).join('');
}
const matPct = m => Math.round((m.done / Math.max(1, m.total)) * 100);
function renderMats(){
  const add = `<button class="mat add" id="addMat"><span>+</span>Material</button>`;
  $('#mats').innerHTML = state.materials.map(m => `
    <div class="mat" style="--c:${m.color}" data-id="${m.id}">
      <div class="mat-hd" data-edit="1"><span class="mat-title">${esc(m.title)}</span><span class="pct">${matPct(m)}%</span></div>
      <div class="track"><div class="fill" style="width:${matPct(m)}%"></div></div>
      <div class="mat-ft">
        <button class="mstep" data-mstep="-1" aria-label="one unit less">−</button>
        <button class="units" data-edit="1">${m.done}<span>/${m.total}</span></button>
        <button class="mstep" data-mstep="1" aria-label="one unit more">+</button>
      </div>
    </div>`).join('') + add;
}

let lastRender = { key:null, ids:new Set() };
function renderTimeline(){
  const tl = $('#tl'), key = state.date;
  const [lo, hi] = dayWindow(key);
  const list = allTasksOn(key);
  let html = '';
  for (let m = ceilTo(lo, 60); m <= hi; m += 60)
    html += `<div class="hour" style="top:${(m - lo) * PXPM}px"><span>${hourLabel(m)}</span></div>`;
  html += `<div class="now-line" id="nowLine" style="display:none"></div>`;
  const fresh = lastRender.key === key;
  for (const t of list){
    const top = (t.start - lo) * PXPM, h = Math.max(t.dur * PXPM, 24), fixed = t.type === 'fixed';
    const tag = fixed ? ` · ${catOf(t).name}` : (t.pct > 0 && !t.done ? ` · ${t.pct}%` : '');
    const isNew = fresh && !lastRender.ids.has(t.id);
    html += `<div class="blk ${t.done ? 'done' : ''} ${fixed ? 'fixed' : ''} ${t.dur <= 30 ? 'sm' : ''} ${t.carried ? 'carried' : ''} ${isNew ? 'enter' : ''}"
      data-id="${t.id}" style="top:${top}px;height:${h}px;--c:${colorForTask(t)}">
      ${fixed ? '<div class="lock"></div>' : '<div class="grip"></div>'}
      <div class="blk-body">
        <div class="blk-time">${fmtShort(t.start)} – ${fmtShort(t.start + t.dur)}${tag}${t.virtual ? ' ↻' : ''}${t.carried ? ' →' : ''}</div>
        <div class="blk-title">${esc(t.title)}</div>
      </div>
      ${fixed ? '' : `<button class="chk" aria-label="toggle done">${ICON.check}</button>`}
    </div>`;
  }
  if (!list.length) html += `<div class="empty">Tap the timeline to add a block</div>`;
  tl.style.height = ((hi - lo) * PXPM + 26) + 'px';
  tl.innerHTML = html;
  lastRender = { key, ids:new Set(list.map(t => t.id)) };
  updateNowLine();
}
function updateNowLine(){
  const el = $('#nowLine');
  if (!el) return;
  const [lo, hi] = dayWindow(state.date), m = nowMinutes();
  if (state.date !== todayKey() || m < lo || m > hi){ el.style.display = 'none'; return; }
  el.style.display = ''; el.style.top = ((m - lo) * PXPM) + 'px';
}

/* ---------- day bar: Start day · live block · Re-fit · End day ---------- */
let dayBarHtml = '';
function renderDayBar(){
  const el = $('#dayBar'), key = state.date;
  if (key !== todayKey()){ el.classList.add('hide'); if (dayBarHtml){ el.innerHTML = ''; dayBarHtml = ''; } return; }
  el.classList.remove('hide');
  const info = dayGet(key), st = dayStats(key), cur = currentBlock(key), nxt = nextBlock(key), missed = missedBlocks(key);
  const m = nowMinutes();
  let html, prog = 0, tone = 'live';
  if (info.endedAt != null){
    tone = 'closed';
    html = `<div class="db-main"><div class="db-t">Day closed</div><div class="db-s">${Math.round(st.pct * 100)}% · ${fmtDur(st.done)} done</div></div>
      <button class="db-btn" data-db="report">Report</button><button class="db-btn ghost" data-db="reopen">Reopen</button>`;
  } else if (info.startedAt == null){
    tone = 'idle';
    html = `<div class="db-main"><div class="db-t">${st.ts.length ? 'Ready when you are' : 'Plan your day'}</div>
      <div class="db-s">${st.ts.length ? `${st.ts.length} block${st.ts.length > 1 ? 's' : ''} · ${fmtDur(st.planned)}` : 'Add blocks or tap Auto'}</div></div>
      <button class="db-btn primary" data-db="start">${ICON.play}<span>Start day</span></button>`;
  } else {
    const fit = missed.length ? `<button class="db-pill" data-db="refit">${ICON.refit}<span>${missed.length} missed</span></button>` : '';
    const end = `<button class="db-icon" data-db="end" aria-label="End day">${ICON.moon}</button>`;
    if (cur){
      const left = cur.start + cur.dur - m;
      prog = clamp((m - cur.start) / cur.dur, 0, 1);
      const act = cur.type === 'study' && !cur.virtual
        ? `<button class="db-icon ok" data-db="done" aria-label="Done">${ICON.check}</button><button class="db-icon txt" data-db="ext" aria-label="Add 10 minutes">+10</button>` : '';
      html = `<div class="db-main tap" data-db="open" data-id="${cur.id}"><div class="db-t"><i class="db-dot" style="background:${colorForTask(cur)}"></i>${esc(trunc(cur.title, 26))}</div>
        <div class="db-s">${Math.max(1, Math.ceil(left))} min left</div></div>${fit}${act}${end}`;
    } else if (nxt){
      html = `<div class="db-main tap" data-db="open" data-id="${nxt.id}"><div class="db-t">Next · ${esc(trunc(nxt.title, 22))}</div>
        <div class="db-s">in ${fmtDur(Math.max(1, Math.ceil(nxt.start - m)))} · ${fmtTime(nxt.start)}</div></div>${fit}${end}`;
    } else {
      tone = 'wrap';
      html = `<div class="db-main"><div class="db-t">${st.open.length ? 'Wrap up?' : 'All clear'}</div>
        <div class="db-s">${Math.round(st.pct * 100)}% done${missed.length ? ` · ${missed.length} missed` : ''}</div></div>${fit}
        <button class="db-btn primary" data-db="end">${ICON.moon}<span>End day</span></button>`;
    }
  }
  const sig = tone + html;
  el.style.setProperty('--p', (prog * 100).toFixed(1) + '%');
  if (sig !== dayBarHtml){
    const was = dayBarHtml.slice(0, 5);
    el.className = 'daybar ' + tone;
    el.innerHTML = html;
    if (dayBarHtml && was !== tone.slice(0, 5)) anim(el, [{ opacity:0, transform:'translateY(4px)' }, { opacity:1, transform:'none' }], { duration:200 });
    dayBarHtml = sig;
  }
}
$('#dayBar').addEventListener('click', e => {
  const b = e.target.closest('[data-db]');
  if (!b) return;
  const act = b.dataset.db;
  if (act === 'start') openStartDay();
  else if (act === 'end') openEndDay();
  else if (act === 'report'){ openSheet('share', { phase:'report' }); }
  else if (act === 'reopen'){ const before = snapState(); delete dayInfo(todayKey()).endedAt; save(); render(); offerUndo('Day reopened', before, 3000); }
  else if (act === 'refit'){
    const before = snapState(), res = refit(Math.ceil(nowMinutes() / 5) * 5);
    save(); render(); haptic([10, 30, 10]);
    offerUndo(refitSummary(res), before);
  }
  else if (act === 'done'){ const t = currentBlock(state.date); if (t) toggleDone(t, true); }
  else if (act === 'ext'){
    const t = currentBlock(state.date);
    if (t && !t.virtual){ const before = snapState(); t.dur = Math.min(maxDur(t.type), t.dur + 10); resolve(tasksOn(state.date)); save(); render(); haptic(6); offerUndo('+10 min', before, 2500); }
  }
  else if (act === 'open'){ const id = b.dataset.id; id.startsWith('rec:') ? openSheet('recurring', { recurringId:id.split(':')[1] }) : openBlockSheet(id); }
});
function refitSummary(r){
  if (!r.moved && !r.carried) return 'Nothing to move';
  const parts = [`${r.moved} moved`];
  if (r.shrunk) parts.push(`${r.shrunk} shortened`);
  if (r.bedTo) parts.push(`bed ${fmtTime(r.bedTo)}`);
  if (r.carried) parts.push(`${r.carried} → tomorrow`);
  return 'Re-fit · ' + parts.join(' · ');
}
function toggleDone(t, force){
  const next = force != null ? force : !t.done;
  t.done = next; t.pct = next ? 100 : 0;
  if (next) learnFrom(t, false); else { state.history = state.history.filter(r => r.blockId !== t.id); modelDirty = true; }
  save(); haptic(next ? 10 : 5); render();
  if (next){ const el = document.querySelector(`.blk[data-id="${t.id}"] .chk`); pop(el); }
}

function renderStats(){
  const st = dayStats(state.date), w = workload(state.date), s = streak();
  const p = $('#statPlanned');
  p.textContent = (st.planned / 60).toFixed(1).replace(/\.0$/, '') + 'h';
  p.parentElement.classList.toggle('warn', w.over);
  $('#statDone').textContent = st.planned ? Math.round(st.pct * 100) + '%' : '0%';
  const d = dateObj(state.date);
  $('#datePill').textContent = (state.date === todayKey() ? 'Today · ' : '') +
    d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  const sk = $('#streak');
  sk.innerHTML = s >= 2 ? `${ICON.flame}<span>${s}</span>` : '';
  sk.classList.toggle('on', s >= 2);
}
function render(){
  renderWeek(); renderMats(); renderTimeline(); renderStats(); renderDayBar();
}
function scrollToTime(min, instant){
  const [lo] = dayWindow();
  $('#tlWrap').scrollTo({ top:Math.max(0, (min - lo) * PXPM - 50), behavior: instant || reducedMotion() ? 'auto' : 'smooth' });
}
function scrollDefault(instant){
  const [lo] = dayWindow();
  const list = allTasksOn(state.date);
  const target = state.date === todayKey()
    ? Math.max(lo, nowMinutes() - 60)
    : (list.length ? Math.min(...list.map(t => t.start)) : lo);
  scrollToTime(target, instant);
}
function goDate(key){
  if (key === state.date) return;
  const dir = key > state.date ? 1 : -1;
  state.date = key;
  render(); scrollDefault(true);
  anim($('#tlWrap'), [{ opacity:0, transform:`translateX(${dir * 16}px)` }, { opacity:1, transform:'none' }], { duration:230 });
  haptic(4);
}

/* single minute-aligned tick: moves the now-line and refreshes the day bar; sleeps while hidden */
let tickTimer = null, lastToday = todayKey();
function tick(){
  clearTimeout(tickTimer);
  const t = todayKey();
  if (t !== lastToday){ if (state.date === lastToday) state.date = t; lastToday = t; render(); }
  else if (!drag){ updateNowLine(); renderDayBar(); }
  if (!document.hidden) tickTimer = setTimeout(tick, 60000 - (Date.now() % 60000) + 50);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); else clearTimeout(tickTimer); });

/* ============================================================
   DRAG (grip, 8px threshold)
============================================================ */
const tlEl = $('#tl');
let dragRaf = null, dragPendingY = null;
tlEl.addEventListener('pointerdown', e => {
  const grip = e.target.closest('.grip');
  if (!grip) return;
  const blk = grip.closest('.blk'), t = findTask(blk.dataset.id);
  if (!t || t.type === 'fixed') return;
  const [lo, hi] = dayWindow();
  drag = { id:t.id, el:blk, y0:e.clientY, x0:e.clientX, s0:t.start, ns:t.start, moved:false, started:false,
           dur:t.dur, lo, hi, pointerId:e.pointerId, before:snapState() };
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started){
    if (Math.abs(e.clientY - drag.y0) < 8 && Math.abs(e.clientX - drag.x0) < 8) return;
    drag.started = true;
    try { drag.el.setPointerCapture(drag.pointerId); } catch(_){}
    drag.el.classList.add('dragging'); haptic(8);
  }
  drag.moved = true;
  const ns = clamp(roundTo(drag.s0 + (e.clientY - drag.y0) / PXPM, SNAP), drag.lo, Math.max(drag.lo, drag.hi - drag.dur));
  if (ns !== drag.ns) haptic(2);
  drag.ns = ns; dragPendingY = (ns - drag.s0) * PXPM;
  if (dragRaf === null) dragRaf = requestAnimationFrame(() => {
    if (drag && dragPendingY !== null) drag.el.style.transform = `translate3d(0,${dragPendingY}px,0)`;
    dragRaf = null;
  });
  e.preventDefault();
}, { passive:false });
function endDrag(commit){
  if (!drag) return;
  const d = drag; drag = null;
  if (dragRaf){ cancelAnimationFrame(dragRaf); dragRaf = null; }
  dragPendingY = null;
  d.el.classList.remove('dragging'); d.el.style.transform = '';
  if (commit && d.started && d.moved && d.ns !== d.s0){
    const t = findTask(d.id);
    if (t){ t.start = d.ns; resolve(tasksOn(state.date)); save(); render(); haptic(6); offerUndo('Moved to ' + fmtTime(t.start), d.before, 3200); }
  }
}
window.addEventListener('pointerup', () => endDrag(true));
window.addEventListener('pointercancel', () => endDrag(false));

tlEl.addEventListener('click', e => {
  const chk = e.target.closest('.chk');
  if (chk){ const t = findTask(chk.closest('.blk').dataset.id); if (t) toggleDone(t); return; }
