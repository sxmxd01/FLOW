<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0b0e">
<meta name="color-scheme" content="dark">
<title>FocusFlow — Study Planner</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  background:#0a0b0e;color:#dfe1e8;overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  overscroll-behavior:none;
}
input,textarea,select{-webkit-user-select:text;user-select:text}
*{touch-action:manipulation}
.blk,.tl-wrap{touch-action:pan-y}
.grip,.bar{touch-action:none}
.blk{transform:translateZ(0);backface-visibility:hidden}

body::before{
  content:"";position:fixed;inset:-30%;z-index:0;pointer-events:none;
  background:
    radial-gradient(40% 30% at 15% 0%, rgba(110,122,160,.16), transparent 70%),
    radial-gradient(36% 28% at 90% 100%, rgba(90,120,130,.10), transparent 70%);
  filter:blur(38px);
}
#app{
  position:relative;z-index:1;height:100vh;height:100dvh;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;padding:0 12px;
}

/* ---------- header ---------- */
header{
  flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top)) 4px 10px;gap:10px;
}
.hl{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand{font-size:16px;font-weight:700;letter-spacing:-.2px;color:#e8eaf0}
.brand span{color:#95a0b8}
.datenav{display:flex;align-items:center;gap:1px;margin-left:-7px}
.nv{width:28px;height:26px;border:0;border-radius:8px;background:transparent;color:#7c8296;font-size:18px;line-height:1;cursor:pointer;font-family:inherit}
.nv:active{background:rgba(255,255,255,.09)}
.date-pill{border:0;background:transparent;font-family:inherit;padding:4px 2px;font-size:11.5px;font-weight:600;color:#8d94a8;letter-spacing:.2px;cursor:pointer}
.hdr-actions{display:flex;gap:6px;flex:0 0 auto}
.ic{
  width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.045);color:#a5acc0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s,color .15s,transform .1s;
}
.ic:active{transform:scale(.92);background:rgba(255,255,255,.10)}

/* ---------- week strip ---------- */
.week{
  flex:0 0 auto;display:flex;gap:6px;padding:2px 0 10px;
  overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;
}
.week::-webkit-scrollbar{display:none}
.day-chip{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;border-radius:13px;cursor:pointer;font-family:inherit;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.065);
  color:#7f8598;font-size:10px;font-weight:600;letter-spacing:.4px;
  transition:background .15s,border-color .15s,color .15s;
}
.day-chip:active{transform:scale(.95)}
.day-chip .dnum{font-size:13.5px;font-weight:700;color:#ccd0dc}
.day-chip.active{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.20);color:#e3e5ec}
.day-chip.active .dnum{color:#fff}
.day-chip.today .dnum{color:#a8dbe8}
.dbar{width:18px;height:2px;border-radius:2px;background:rgba(255,255,255,.11);overflow:hidden;margin-top:1px}
.dbar i{display:block;height:100%;border-radius:2px;background:#8ba2b8;transition:width .3s}

/* ---------- materials ---------- */
.mats{
  flex:0 0 auto;display:flex;gap:8px;padding:0 0 11px;
  overflow-x:auto;scrollbar-width:none;min-height:86px;overscroll-behavior-x:contain;
}
.mats::-webkit-scrollbar{display:none}
.mat{
  position:relative;flex:0 0 158px;padding:10px 10px 8px 12px;border-radius:15px;overflow:hidden;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.075);
}
.mat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);opacity:.95}
.mat-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:6px}
.mat-title{
  font-size:12px;font-weight:600;line-height:1.25;color:#d0d4df;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pct{font-size:11.5px;font-weight:700;color:#a3aabd;flex:0 0 auto;font-variant-numeric:tabular-nums}
.bar{height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track{width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.10);overflow:hidden}
.fill{height:100%;border-radius:3px;background:var(--c);opacity:.95;transition:width .06s linear}

.mat{display:flex;flex-direction:column}
.mat-ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:7px;gap:4px}
.mstep{width:36px;height:27px;border:0;border-radius:8px;background:rgba(255,255,255,.07);color:#cfd4e0;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;touch-action:manipulation;transition:background .1s,transform .1s}
.mstep:active{background:rgba(255,255,255,.17);transform:scale(.93)}
.units{flex:1;border:0;background:transparent;font-family:inherit;color:#e0e3ec;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;padding:4px 0;margin:0;white-space:nowrap}
.units span{color:#6f768a;font-weight:600}
.mat.add{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  flex:0 0 88px;color:#7f8598;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;
  background:rgba(255,255,255,.025);border:1px dashed rgba(255,255,255,.14);
}
.mat.add span{font-size:18px;line-height:1;color:#95a0b8}
.mats-empty{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:#6a7083;font-weight:600;
}

/* ---------- timeline ---------- */
.tl-wrap{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;
  border-radius:18px;background:rgba(255,255,255,.022);
  border:1px solid rgba(255,255,255,.065);
  scrollbar-width:none;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.tl-wrap::-webkit-scrollbar{display:none}
.tl{position:relative}
.hour{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.05)}
.hour span{position:absolute;left:10px;top:-7px;font-size:9.5px;font-weight:600;color:#666c80;font-variant-numeric:tabular-nums}
.now-line{position:absolute;left:44px;right:8px;height:0;border-top:1px dashed rgba(200,130,145,.65);z-index:5}
.now-line::before{content:"";position:absolute;left:-2px;top:-3px;width:6px;height:6px;border-radius:50%;background:#cc8a9a;box-shadow:0 0 6px rgba(204,138,154,.7)}

.empty{
  position:absolute;left:0;right:0;top:32%;text-align:center;padding:0 30px;
  color:#6a7083;font-size:12px;font-weight:600;line-height:1.7;pointer-events:none;
}
.empty b{display:block;color:#959cad;font-size:13px;font-weight:700;margin-bottom:4px}

.blk{
  position:absolute;left:46px;right:9px;border-radius:11px;
  display:flex;align-items:stretch;overflow:hidden;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.09);
  border-left:3px solid var(--c);
  transition:box-shadow .18s, opacity .18s, background .18s;
  will-change:transform;
}
.blk.dragging{
  z-index:20;background:rgba(255,255,255,.10);
  box-shadow:0 16px 32px -14px #000, 0 0 0 1px rgba(255,255,255,.22);
  transition:none;
}
.blk.done{opacity:.45}
.blk.done .blk-title{text-decoration:line-through;color:#a3aabd}
.blk.fixed{
  background:rgba(255,255,255,.028);
  background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 5px, transparent 5px 11px);
  border-color:rgba(255,255,255,.075);
  border-left:3px solid var(--c);
}
.blk.fixed .blk-title{color:#aab0c0}
.lock{flex:0 0 8px}
.grip{
  flex:0 0 26px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.03);cursor:grab;touch-action:none;
}
.grip::before{
  content:"";width:8px;height:16px;opacity:.65;
  background-image:radial-gradient(circle, rgba(255,255,255,.65) 1px, transparent 1.3px);
  background-size:4px 4px;
}
.blk-body{flex:1 1 auto;min-width:0;padding:5px 6px 5px 8px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;cursor:pointer}
.blk-time{font-size:9.5px;font-weight:600;letter-spacing:.3px;color:#868da1;font-variant-numeric:tabular-nums}
.blk-title{font-size:12px;font-weight:600;line-height:1.2;color:#e3e5ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.sm .blk-time{display:none}
.chk{
  flex:0 0 36px;border:0;background:transparent;color:rgba(255,255,255,.25);
  font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:color .15s,transform .1s;
}
.chk:active{transform:scale(.88)}
.blk.done .chk{color:#8bb59a}

/* ---------- bottom bar ---------- */
.bottom{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));
}
.stats{display:flex;flex-direction:column;line-height:1.15}
.stat-v{font-size:15px;font-weight:700;color:#d6dae4;font-variant-numeric:tabular-nums}
.stat-l{font-size:9px;font-weight:600;letter-spacing:.7px;color:#6a7083;text-transform:uppercase}
.spacer{flex:1 1 auto}
.btn{
  border:0;border-radius:12px;font-family:inherit;font-weight:700;cursor:pointer;
  transition:transform .1s, background .15s;
}
.btn:active{transform:scale(.95)}
.btn.primary{padding:13px 18px;font-size:13px;color:#0a0b0e;background:#d1d6e2}
.btn.primary:active{background:#bcc3d2}
.btn.ghost{padding:12px 14px;font-size:12.5px;color:#aab0c0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}
.btn.ghost:active{background:rgba(255,255,255,.11)}
.btn.danger{background:rgba(200,115,125,.14);border:1px solid rgba(200,115,125,.28);color:#d099a2}
.btn.tiny{padding:11px 14px;font-size:12px}

/* ---------- sheet ---------- */
.backdrop{
  position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:520px;margin:0 auto;
  background:rgba(22,24,30,.97);
  -webkit-backdrop-filter:blur(18px) saturate(120%);backdrop-filter:blur(18px) saturate(120%);
  border-top:1px solid rgba(255,255,255,.10);border-radius:22px 22px 0 0;
  padding:10px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(112%);transition:transform .28s cubic-bezier(.2,.85,.3,1);
  box-shadow:0 -20px 50px -22px #000;
  max-height:88dvh;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;
}
.sheet::-webkit-scrollbar{display:none}
.sheet.show{transform:translateY(0)}
.handle{width:36px;height:4px;border-radius:3px;background:rgba(255,255,255,.20);margin:0 auto 16px}
.sheet-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:#7d93a8}
.sheet-title{font-size:15px;font-weight:700;letter-spacing:-.2px;color:#e8eaf0}
.sheet-sub{font-size:11.5px;color:#868da1;font-weight:600;margin-top:2px}
.sec{font-size:9.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#6a7083;margin:16px 0 4px}
.sec:first-child{margin-top:0}
.ctl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.ctl-row > span{font-size:12.5px;font-weight:600;color:#aab0c0;flex:0 0 auto}
.stepper{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.055);border-radius:11px;padding:3px;border:1px solid rgba(255,255,255,.075)}
.stepper button{
  width:36px;height:32px;border:0;border-radius:8px;background:transparent;color:#dfe2ea;
  font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation;
}
.stepper button:active{background:rgba(255,255,255,.12)}
.fld{display:flex;align-items:baseline;justify-content:center;gap:3px;min-width:66px;padding:0 2px}
.fld.wide{min-width:84px}
.fld input.num{width:44px;border:0;background:transparent;color:#e8eaf0;font:inherit;font-size:14px;font-weight:700;text-align:right;padding:2px 3px;outline:none;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;border-radius:6px;margin:0}
.fld.wide input.num{width:80px;text-align:center}
.fld input.num:focus{color:#fff;background:rgba(255,255,255,.10)}
.fld i{font-style:normal;font-size:11px;font-weight:600;color:#7a8094}
.stepper b{min-width:62px;text-align:center;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:#dfe2ea}
.presets{display:flex;gap:6px;padding:2px 0 8px}
.pchip{flex:1;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#a3aabd;border-radius:10px;padding:10px 0;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;touch-action:manipulation;font-variant-numeric:tabular-nums;transition:background .1s,transform .1s}
.pchip.sel{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.27);color:#fff}
.pchip:active{transform:scale(.95)}
.btn.wide{width:100%;margin-top:8px}
.tap{cursor:pointer}
.sub.inline{display:inline;margin:0 0 0 4px}
.splits{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 0 2px}
.split{font-size:11.5px;font-weight:600;color:#868da1;display:inline-flex;align-items:center;gap:6px}
.split b{color:#cfd4e0}
.split i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chiprow.cats{padding:2px 0 8px}
.sheet-actions{display:flex;gap:9px;margin-top:16px}
.sheet-actions .btn{flex:1;padding:15px;font-size:13.5px}
.inp{
  width:100%;padding:13px 15px;border-radius:12px;font-family:inherit;font-size:16px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);
  color:#e8eaf0;outline:none;margin-bottom:10px;-webkit-appearance:none;appearance:none;
}
.inp::placeholder{color:#6a7083}
.inp:focus{border-color:rgba(155,170,195,.50)}
select.inp{background-image:none}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.row .nm{font-size:12.5px;font-weight:600;color:#ccd0dc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.row .sub{font-size:10.5px;color:#7a8094;font-weight:600;margin-top:2px}
.row .right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.xbtn{
  width:34px;height:34px;border:0;border-radius:9px;background:rgba(255,255,255,.05);
  color:#7f8598;font-size:16px;cursor:pointer;font-family:inherit;touch-action:manipulation;
}
.xbtn:active{background:rgba(255,255,255,.12)}

.stars{display:flex;gap:4px}
.star{
  width:36px;height:36px;border:0;border-radius:10px;
  background:rgba(255,255,255,.055);color:#6a7083;
  font-size:14px;cursor:pointer;font-family:inherit;transition:background .12s,color .12s;
  touch-action:manipulation;
}
.star.on{background:rgba(205,218,240,.18);color:#dde3f0}
.star:active{transform:scale(.92)}

.cdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto;vertical-align:middle;margin-right:6px}
.mchip{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 13px;border-radius:11px;font-family:inherit;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);color:#a3aabd;cursor:pointer;
  max-width:100%;touch-action:manipulation;transition:background .12s,border-color .12s,color .12s;
}
.mchip:active{transform:scale(.97)}
.mchip.sel{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.25);color:#e8eaf0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 2px}

.day-mini{
  width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);color:#a3aabd;font-family:inherit;font-size:11px;font-weight:700;
  cursor:pointer;touch-action:manipulation;transition:background .12s,color .12s,border-color .12s;
}
.day-mini.on{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}

.goalbar{height:4px;border-radius:3px;background:rgba(255,255,255,.10);overflow:hidden;margin-top:6px}
.goalbar i{display:block;height:100%;border-radius:3px;background:#95a5bc;transition:width .3s}

.note{font-size:11.5px;line-height:1.6;color:#7a8094;font-weight:500;padding:6px 0 2px}
.note b{color:#aab0c0;font-weight:700}

.share-preview{margin-bottom:18px}
.share-preview img{
  width:100%;border-radius:14px;border:1px solid rgba(255,255,255,.08);
  display:block;background:#0a0b0e;
}
.share-preview .cap{font-size:12px;color:#868da1;line-height:1.55;margin-top:10px;font-weight:500}
.share-preview .btn{width:100%;margin-top:10px}

#toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,14px);z-index:80;
  padding:11px 18px;border-radius:100px;font-size:12.5px;font-weight:600;
  background:rgba(30,32,40,.97);border:1px solid rgba(255,255,255,.11);
  color:#d1d6e2;backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:.25s;max-width:90vw;
  display:flex;align-items:center;gap:10px;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.show.act{pointer-events:auto}
#toast.top{bottom:auto;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-14px)}
#toast.top.show{transform:translate(-50%,0)}
#toast .tmsg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast button{
  border:0;background:transparent;color:#dde3f0;font-weight:800;cursor:pointer;
  font-family:inherit;font-size:13px;text-decoration:underline;padding:8px 6px;margin:-8px -6px;flex:0 0 auto;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="hl">
      <div class="brand">Focus<span>Flow</span></div>
      <div class="datenav"><button class="nv" id="prevDay" aria-label="Previous day">‹</button><button class="date-pill" id="datePill">—</button><button class="nv" id="nextDay" aria-label="Next day">›</button></div>
    </div>
    <div class="hdr-actions">
      <button class="ic" id="reviewBtn" aria-label="Review"></button>
      <button class="ic" id="shareBtn" aria-label="Share"></button>
      <button class="ic" id="setBtn" aria-label="Settings"></button>
    </div>
  </header>

  <div class="week" id="week"></div>
  <div class="mats" id="mats"></div>

  <div class="tl-wrap" id="tlWrap">
    <div class="tl" id="tl"></div>
  </div>

  <div class="bottom">
    <div class="stats"><div class="stat-v" id="statPlanned">0h</div><div class="stat-l">planned</div></div>
    <div class="stats"><div class="stat-v" id="statDone">0%</div><div class="stat-l">done</div></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="autoBtn">Auto</button>
    <button class="btn primary" id="addBtn">+ Block</button>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script>
/* ============================================================
   CONSTANTS
============================================================ */
const HH = 62;
const PXPM = HH / 60;
const SNAP = 15;
const MIN_DUR = 25;
const MAX_DUR = 150;
const MIN_FIXED = 15;
const MAX_FIXED = 720;
const BREAK = 10;
const STORAGE_KEY = 'focusflow_v2';
/* Android bridge (null when opened in a normal browser) */
const NATIVE = (typeof window.FFNative !== 'undefined') ? window.FFNative : null;
const DEFAULT_NOTIF = { start:true, end:true, lead:0, fixed:true };
let nativeStatus = { notif:true, exact:true };
const SHARE_W = 1080;

function fmtShort(m){

  const h = Math.floor(m/60), mm = m%60;
  const hh = h % 12 === 0 ? 12 : h % 12;
  return `${hh}:${pad(mm)}`;
}

/* Typed input: "930", "9:30", "9.30", "9:30pm", "21:30", "9p" … ref = current value (decides AM/PM when omitted) */
function parseTime(raw, ref){
  const s = String(raw).trim().toLowerCase().replace(/\s+/g, '');
  const m = s.match(/^(\d{1,2})(?:[:.h]?(\d{2}))?([ap])?m?$/);
  if (!m) return NaN;
  let h = parseInt(m[1], 10);
  const mi = m[2] ? parseInt(m[2], 10) : 0;
  if (mi > 59) return NaN;
  if (m[3]){
    if (h < 1 || h > 12) return NaN;
    h = (h % 12) + (m[3] === 'p' ? 12 : 0);
  } else if (h >= 13 || h === 0){
    if (h > 23) return NaN;
  } else {
    h = (h % 12) + ((ref || 0) >= 720 ? 12 : 0);
  }
  return h * 60 + mi;
}
/* Typed input: "45", "1h30", "1.5h", "90m" */
function parseDur(raw){
  const s = String(raw).trim().toLowerCase();
  let m = s.match(/^(\d+(?:\.\d+)?)\s*h(?:ours?|rs?)?\s*(\d+)?\s*(?:m|min)?$/);
  if (m) return Math.round(parseFloat(m[1]) * 60 + (m[2] ? parseInt(m[2], 10) : 0));
  m = s.match(/^(\d+(?:\.\d+)?)/);
  return m ? Math.round(parseFloat(m[1])) : NaN;
}

function load(){
  try {
    let raw = null;
    if (NATIVE){
      try { raw = NATIVE.getState(); } catch(_){}
      if (!raw) raw = localStorage.getItem(STORAGE_KEY);   // one-time migration path
    } else {
      raw = localStorage.getItem(STORAGE_KEY);
    }
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (data.version !== 2) return null;
    return data;
  } catch(e){ return null; }
}

let persistAsked = false;
function save(){
  try {
    const trimmed = Object.assign({}, state);
    trimmed.history = (state.history || []).slice(-2000);
    if (NATIVE){
      NATIVE.saveState(JSON.stringify(trimmed));
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
      if (!persistAsked){
        persistAsked = true;
        if (navigator.storage && navigator.storage.persist){
          navigator.storage.persist().catch(()=>{});
        }
      }
    }
  } catch(e){ console.warn('save failed', e); }
}

function normalizeState(){
  if (!state.recurring) state.recurring = [];
  if (!state.history) state.history = [];
  if (!state.tasks) state.tasks = {};
  if (!state.subjects) state.subjects = [];
  if (!state.materials) state.materials = [];
  if (!state.prefs) state.prefs = {};
  if (!state.settings) state.settings = { wake: 390, sleep: 1380 };
  state.settings.notif = Object.assign({}, DEFAULT_NOTIF, state.settings.notif || {});
  /* materials can belong to several subjects (legacy: single subjectId) */
  for (const m of state.materials){
    if (!Array.isArray(m.subjectIds)) m.subjectIds = m.subjectId ? [m.subjectId] : [];
    m.subjectIds = m.subjectIds.filter(id => state.subjects.some(s => s.id === id));
    m.subjectId = m.subjectIds[0] || null;
  }
  /* fixed blocks always carry a category */
  for (const r of state.recurring) if (!CATS[r.cat]) r.cat = 'cl';
  for (const k in state.tasks) for (const t of state.tasks[k]) if (t.type === 'fixed' && !CATS[t.cat]) t.cat = 'cl';
}
function initState(){
  state = load() || defaultState();
  normalizeState();
  state.date = iso(new Date());      // an app opens on today
}

const tasksOn = d => (state.tasks[d] || (state.tasks[d] = []));

function allTasksOn(dateKey){
  const concrete = [...(state.tasks[dateKey] || [])];
  const dow = isoDow(dateKey);
  const recurring = (state.recurring || [])
    .filter(r => r.days && r.days.includes(dow) && (!r.until || dateKey <= r.until))
    .map(r => ({
      id: 'rec:' + r.id + ':' + dateKey,
      recurringId: r.id,
      type: 'fixed',
      cat: r.cat || 'cl',
      title: r.title,
      start: r.start,
      dur: r.dur,
      virtual: true
    }));
  return [...concrete, ...recurring];
}

function findTask(id){
  if (typeof id === 'string' && id.startsWith('rec:')){
    const parts = id.split(':');
    const tpl = state.recurring.find(x => x.id === parts[1]);
    if (!tpl) return null;
    return {
      id, recurringId: tpl.id, type: 'fixed', cat: tpl.cat || 'cl',
      title: tpl.title, start: tpl.start, dur: tpl.dur, virtual: true
    };
  }
  for (const k in state.tasks){
    const t = state.tasks[k].find(x => x.id === id);
    if (t) return t;
  }
  return null;
}

function colorForTask(t){
  if (t.type === 'fixed') return catOf(t).color;
  if (t.matId){
    const m = state.materials.find(x => x.id === t.matId);
    if (m) return m.color;
  }
  const sid = subjectsOfTask(t)[0];
  if (sid){
    const s = state.subjects.find(x => x.id === sid);
    if (s) return s.color || '#7a8194';
  }
  return '#7a8194';
}
/* every subject a study block counts toward (a material may serve several) */
function subjectsOfTask(t){
  if (!t || t.type === 'fixed') return [];
  const m = t.matId ? state.materials.find(x => x.id === t.matId) : null;
  if (m && m.subjectIds && m.subjectIds.length) return m.subjectIds;
  if (t.subjectIds && t.subjectIds.length) return t.subjectIds.filter(id => state.subjects.some(s => s.id === id));
  return t.subjectId && state.subjects.some(s => s.id === t.subjectId) ? [t.subjectId] : [];
}
const subjectName = id => { const s = state.subjects.find(x => x.id === id); return s ? s.name : ''; };
const subjectNames = ids => ids.map(subjectName).filter(Boolean).join(' · ');
/* minutes per subject; completed = weighted by pct, otherwise planned */
function subjectMinutes(list, completed){
  const out = {};
  for (const t of list){
    if (t.type !== 'study') continue;
    const mins = completed ? t.dur * ((t.pct || 0) / 100) : t.dur;
    for (const sid of subjectsOfTask(t)) out[sid] = (out[sid] || 0) + mins;
  }
  return out;
}

/* ============================================================
   TIME WINDOW
============================================================ */
function dayWindow(){
  const w = state.settings.wake;
  let s = state.settings.sleep;
  if (s <= w) s = 1440;
  return [w, s];
}

/* ============================================================
   OVERLAP / PLACEMENT
============================================================ */
function overlaps(placed, s, dur){
  return placed.some(p => s < p.start + p.dur && s + dur > p.start);
}
function placeBlock(t, placed, lo, hi, pref){
  const maxStart = hi - t.dur;
  let s = clamp(pref, lo, Math.max(lo, maxStart));
  if (!overlaps(placed, s, t.dur)) return s;
  const span = Math.max(60, maxStart - lo);
  for (let d = 5; d <= span; d += 5){
    if (s + d <= maxStart && !overlaps(placed, s+d, t.dur)) return s+d;
    if (s - d >= lo && !overlaps(placed, s-d, t.dur)) return s-d;
  }
  return s;
}
function resolve(list){
  const [lo, hi] = dayWindow();
  const recurring = allTasksOn(state.date).filter(t => t.virtual);
  const fixed = list.filter(t => t.type === 'fixed').sort((a,b) => a.start - b.start);
  const movable = list.filter(t => t.type !== 'fixed').sort((a,b) => a.start - b.start);
  const placed = [...fixed, ...recurring];
  for (const t of movable){
    t.start = placeBlock(t, placed, lo, hi, t.start);
    placed.push(t);
    placed.sort((a,b) => a.start - b.start);
  }
}
function freeIntervals(busy, start, end, minLen = 20){
  const b = [...busy].sort((a,x) => a.start - x.start);
  const out = [];
  let cur = start;
  for (const x of b){
    const s = Math.max(x.start, start), e = Math.min(x.start + x.dur, end);
    if (s > cur) out.push([cur, s]);
    cur = Math.max(cur, e);
  }
  if (cur < end) out.push([cur, end]);
  return out.filter(([s,e]) => e - s >= minLen);
}

/* ============================================================
   LEARNING
============================================================ */
function nearestBucket(d){
  const B = [30,45,60,80];
  return B.reduce((a,b) => Math.abs(b-d) < Math.abs(a-d) ? b : a, 45);
}
function priorScore(h){
  const t = h + 0.5;
  const g = (x,c,w) => Math.exp(-((x-c)*(x-c))/(2*w*w));
  return 0.25 + 0.75 * Math.max(g(t,10,2.2), g(t,16,2.2), 0.6*g(t,20,1.6));
}
let _profCache = null, _profDirty = true;
function hourProfile(){
  if (_profCache && !_profDirty) return _profCache;
  const S = new Array(24).fill(0), W = new Array(24).fill(0);
  const now = Date.now();
  for (const r of state.history){
    const age = (now - r.ts) / 86400000;
    const wt = Math.exp(-age / 5);
    const h = clamp(Math.floor(r.start / 60), 0, 23);
    S[h] += wt * r.eff;
    W[h] += wt;
  }
  const raw = [];
  for (let h = 0; h < 24; h++){
    const prior = 2 + 3 * priorScore(h);
    if (W[h] < 0.01){
      raw[h] = prior;
    } else {
      const obs = (S[h] + 3 * 0.5) / (W[h] + 0.5);
      const conf = Math.min(1, W[h] / 2);
      raw[h] = conf * obs + (1 - conf) * prior;
    }
  }
  _profCache = raw.map((v,h) => (raw[(h+23)%24] + 2*v + raw[(h+1)%24]) / 4);
  _profDirty = false;
  return _profCache;
}
function preferredDur(){
  const B = [30,45,60,80];
  const S = {}, W = {};
  const now = Date.now();
  for (const r of state.history){
    const age = (now - r.ts) / 86400000;
    const wt = Math.exp(-age / 5);
    const b = nearestBucket(r.dur);
    S[b] = (S[b]||0) + wt * r.eff;
    W[b] = (W[b]||0) + wt;
  }
  let best = 45, bestV = 3;
  for (const b of B){
    const v = W[b] ? (S[b] + 3*0.5) / (W[b] + 0.5) : 3;
    if (v > bestV + 0.08){ bestV = v; best = b; }
  }
  return best;
}
function slotScore(prof, start, dur){
  const h0 = Math.floor(start/60), h1 = Math.floor((start + dur - 1)/60);
  let s = 0, n = 0;
  for (let h = h0; h <= h1; h++){ s += prof[((h % 24) + 24) % 24]; n++; }
  return s / Math.max(1,n);
}
function logFeedback(t){
  state.history = state.history.filter(r => r.blockId !== t.id);
  state.history.push({
    blockId: t.id, ts: Date.now(), date: state.date,
    matId: t.matId || null, subjectId: subjectsOfTask(t)[0] || null,
    start: t.start, dur: t.dur,
    pct: t.pct || 0, eff: t.eff || 3
  });
  _profDirty = true;
}

/* ============================================================
   AUTO PLANNER (v2)
   1. Needs  – per-subject goals + per-material goals, minus what is already done today.
               A material counts fully toward every subject it belongs to, so multi-subject
               materials are picked first when several goals are open.
   2. Chunks – repeatedly pick the most valuable item (unmet goals, how far behind it is, a
               round-robin penalty for variety) and cut it into blocks of your preferred length.
   3. Placement – every start time on a 15-min grid is scored: your best hours, spread across the
               day, never the same subject back-to-back, tight packing, no 3-in-a-row marathons,
               nothing in the past, buffers around fixed blocks, wind-down before bed.
============================================================ */
function autoPlan(){
  const todayKey = iso(new Date());
  if (state.date < todayKey){ toast('That day is over'); return; }
  const [wake, hi] = dayWindow();
  const now = new Date();
  let lo = wake;
  if (state.date === todayKey){
    lo = Math.max(lo, Math.ceil((now.getHours() * 60 + now.getMinutes() + 5) / 15) * 15);
  }
  if (hi - lo < MIN_DUR){ toast('No time left today'); return; }
  if (!state.subjects.length && !state.materials.length){ toast('Add a subject or material first'); return; }

  const before = snapState();
  const concrete = tasksOn(state.date);
  const recurring = allTasksOn(state.date).filter(t => t.virtual);

  /* ---- what stays: fixed blocks, done blocks, past blocks with progress ---- */
  const kept = concrete.filter(t =>
    t.type === 'fixed' || t.done ||
    ((t.pct || 0) > 0 && state.date === todayKey && t.start + t.dur <= lo));
  const keptStudy = kept.filter(t => t.type === 'study');

  /* ---- needs ---- */
  const goal = {}, needS = {}, credS = {}, credM = {};
  for (const t of keptStudy){
    const mins = t.done ? t.dur : t.dur * ((t.pct || 0) / 100);
    if (t.matId) credM[t.matId] = (credM[t.matId] || 0) + mins;
    for (const sid of subjectsOfTask(t)) credS[sid] = (credS[sid] || 0) + mins;
  }
  for (const s of state.subjects){
    goal[s.id] = s.dailyGoalMin || 0;
    needS[s.id] = Math.max(0, goal[s.id] - (credS[s.id] || 0));
  }
  const items = [];
  for (const m of state.materials){
    const rem = Math.max(0, (m.total - m.done) * m.unitMin);
    const cap = Math.max(0, rem - (credM[m.id] || 0));
    if (cap < MIN_DUR) continue;
    const own = m.dailyGoalMin || 0;
    items.push({ key: 'm:' + m.id, m, cap, own, needM: Math.max(0, own - (credM[m.id] || 0)) });
  }

  /* ---- time capacity ---- */
  const padded = [...kept, ...recurring].map(t => t.type === 'fixed'
    ? { start: t.start - 5, dur: t.dur + 10 } : { start: t.start, dur: t.dur });
  const free = freeIntervals(padded, lo, hi);
  if (!free.length){ toast('No free time'); return; }
  let capacity = free.reduce((a, [s, e]) => a + (e - s), 0);

  /* ---- 2. chunks ---- */
  const pdur = preferredDur();
  const assigned = {};
  const chunks = [];
  const MAX_BLOCKS = 12;
  const MIN_NEED = 15;          // a leftover of 15+ min still earns a (minimum-length) block
  for (let guard = 0; guard < 60 && chunks.length < MAX_BLOCKS; guard++){
    let best = null;
    for (const it of items){
      if (it.cap < MIN_DUR) continue;
      let subNeed = 0, subNeedMin = 0;
      for (const sid of it.m.subjectIds){
        if (goal[sid] > 0){ subNeed += needS[sid] / goal[sid]; subNeedMin = Math.max(subNeedMin, needS[sid]); }
      }
      const want = Math.min(it.cap, Math.max(subNeedMin, it.needM));
      if (want < MIN_NEED) continue;
      const ownFrac = it.own > 0 ? it.needM / it.own : 0;
      const behind = 1 - clamp(it.m.done / Math.max(1, it.m.total), 0, 1);
      const pr = 0.6 * subNeed + 0.4 * ownFrac + 0.25 * behind - 0.18 * (assigned[it.key] || 0);
      if (!best || pr > best.pr + 1e-9 || (Math.abs(pr - best.pr) <= 1e-9 && want > best.want)){
        best = { kind:'mat', it, want, pr, key: it.key };
      }
    }
    for (const s of state.subjects){
      if (needS[s.id] < MIN_NEED) continue;
      const servedByMaterial = items.some(it => it.cap >= MIN_DUR && it.m.subjectIds.includes(s.id));
      if (servedByMaterial) continue;
      const key = 's:' + s.id;
      const pr = 0.6 * (needS[s.id] / Math.max(1, goal[s.id])) + 0.1 - 0.18 * (assigned[key] || 0);
      if (!best || pr > best.pr + 1e-9){ best = { kind:'subj', s, want: needS[s.id], pr, key }; }
    }
    if (!best) break;

    const k = Math.max(1, Math.round(best.want / pdur));
    let dur = clamp(round5(best.want / k), MIN_DUR, MAX_DUR);
    if (best.kind === 'mat') dur = Math.min(dur, Math.floor(best.it.cap / 5) * 5);
    if (dur < MIN_DUR || capacity < dur){
      /* can't use this item any more */
      if (best.kind === 'mat') best.it.cap = 0; else needS[best.s.id] = 0;
      continue;
    }
    capacity -= dur + BREAK;
    assigned[best.key] = (assigned[best.key] || 0) + 1;
    if (best.kind === 'mat'){
      const subs = best.it.m.subjectIds;
      for (const sid of subs) needS[sid] = Math.max(0, (needS[sid] || 0) - dur);
      best.it.needM = Math.max(0, best.it.needM - dur);
      best.it.cap -= dur;
      chunks.push({ kind:'mat', m: best.it.m, subs, dur, title: best.it.m.title });
    } else {
      needS[best.s.id] = Math.max(0, needS[best.s.id] - dur);
      chunks.push({ kind:'subj', s: best.s, subs: [best.s.id], dur, title: best.s.name });
    }
  }
  if (!chunks.length){ toast('Daily goals already met'); return; }
  chunks.forEach((c, i) => { c.rank = chunks.length > 1 ? 1 - i / (chunks.length - 1) : 1; });

  /* ---- 3. placement ---- */
  const prof = hourProfile();
  const hasHistory = state.history.length >= 3;
  const wE = hasHistory ? 1.8 : 1.0, wSpread = hasHistory ? 0.7 : 1.2, wVar = 0.9;
  const placed = keptStudy.map(t => ({ start: t.start, end: t.start + t.dur, subs: subjectsOfTask(t) }));
  const created = [];

  const segLoad = s => {
    const seg = Math.floor((s - wake) / 120);
    return placed.reduce((a, p) => Math.floor((p.start - wake) / 120) === seg ? a + (p.end - p.start) : a, 0);
  };
  const chainLen = (s, e) => {
    const all = [...placed, { start: s, end: e }].sort((a, b) => a.start - b.start);
    let best = 1, cur = 1;
    for (let i = 1; i < all.length; i++){
      cur = (all[i].start - all[i-1].end <= BREAK + 5) ? cur + 1 : 1;
      best = Math.max(best, cur);
    }
    return best;
  };
  const bestStart = (c, dur) => {
    let best = null;
    for (const [a, b] of free){
      const cands = new Set([a, b - dur]);
      for (let s = Math.ceil(a / 15) * 15; s + dur <= b; s += 15) cands.add(s);
      for (const s of cands){
        if (s < a || s + dur > b) continue;
        const e = s + dur;
        if (placed.some(p => s < p.end + BREAK && e > p.start - BREAK)) continue;

        let sc = wE * clamp(slotScore(prof, s, dur) / 5, 0, 1) * (1 + 0.5 * c.rank);
        sc += wSpread * (1 - clamp(segLoad(s) / 90, 0, 1));
        for (const p of placed){
          const gap = s >= p.end ? s - p.end : (p.start >= e ? p.start - e : 999);
          if (gap > 60) continue;
          if (p.subs.some(x => c.subs.includes(x))) sc -= wVar; else sc += 0.12;
          if (gap <= BREAK + 5) sc += 0.2;
        }
        if (s === a || e === b) sc += 0.15;
        const chain = chainLen(s, e);
        if (chain > 2) sc -= 0.4 * (chain - 2);
        if (e > hi - 45) sc -= 0.4;
        if (s < wake + 20) sc -= 0.15;
        if (s % 15 === 0) sc += 0.05;
        if (!best || sc > best.sc + 1e-9) best = { s, sc };
      }
    }
    return best;
  };

  for (const c of chunks){
    let spot = null, dur = c.dur;
    for (; dur >= Math.max(MIN_DUR, c.dur - 20); dur -= 5){
      spot = bestStart(c, dur);
      if (spot) break;
    }
    if (!spot) continue;
    placed.push({ start: spot.s, end: spot.s + dur, subs: c.subs });
    created.push({
      id: uid(), type: 'study',
      matId: c.kind === 'mat' ? c.m.id : null,
      subjectId: c.subs[0] || null,
      subjectIds: [...c.subs],
      title: c.title,
      start: spot.s, dur, done: false, pct: 0, eff: 0
    });
  }
  if (!created.length){ toast('No room for a block'); return; }

  created.sort((a, b) => a.start - b.start);
  state.tasks[state.date] = [...kept, ...created];
  resolve(state.tasks[state.date]);
  save();
  render();
  scrollToTime(created[0].start);
  haptic([10, 30, 10]);
  const mins = created.reduce((a, t) => a + t.dur, 0);
  offerUndo(`${created.length} block${created.length > 1 ? 's' : ''} · ${fmtDur(mins)}`, before);
}

  const done = ts.filter(t => t.type === 'study')
                 .reduce((a,t) => a + t.dur * ((t.pct||0)/100), 0);

function renderTimeline(){

  let html = '';

  }
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  if (state.date === iso(now) && nowMin >= lo && nowMin <= hi){
    html += `<div class="now-line" style="top:${(nowMin-lo)*PXPM}px"></div>`;
  }

    const c = colorForTask(t);
    const top = (t.start - lo) * PXPM;
    const h = Math.max(t.dur * PXPM, 24);

    const tag = isFixed ? ` · ${catOf(t).name}` : ((t.pct > 0) ? ` · ${t.pct}%` : '');

    html += `<div class="blk ${t.done ? 'done' : ''} ${isFixed ? 'fixed' : ''} ${t.dur <= 30 ? 'sm' : ''}"

function scrollToTime(min, instant){

/* ============================================================
   DRAG (grip, 8px threshold)
============================================================ */
const tlEl = $('#tl');
let dragRaf = null;
let dragPendingY = null;

tlEl.addEventListener('pointerdown', e => {
  const grip = e.target.closest('.grip');
  if (!grip) return;
  const blk = grip.closest('.blk');
  const t = findTask(blk.dataset.id);
  if (!t || t.type === 'fixed') return;
  const [lo, hi] = dayWindow();
  drag = {
    id: t.id, el: blk, y0: e.clientY, x0: e.clientX,
    s0: t.start, ns: t.start, moved: false, started: false,
    dur: t.dur, lo, hi, pointerId: e.pointerId, before: snapState()
  };
});

window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started){
    const dy = Math.abs(e.clientY - drag.y0);
    const dx = Math.abs(e.clientX - drag.x0);
    if (dy < 8 && dx < 8) return;
    drag.started = true;
    try { drag.el.setPointerCapture(drag.pointerId); } catch(_){}
    drag.el.classList.add('dragging');
    haptic(8);
  }
  const dy = e.clientY - drag.y0;
  drag.moved = true;
  let ns = Math.round((drag.s0 + dy / PXPM) / SNAP) * SNAP;
  ns = clamp(ns, drag.lo, Math.max(drag.lo, drag.hi - drag.dur));
  if (ns !== drag.ns) haptic(2);
  drag.ns = ns;
  dragPendingY = (ns - drag.s0) * PXPM;
  if (dragRaf === null){
    dragRaf = requestAnimationFrame(() => {
      if (drag && dragPendingY !== null){
        drag.el.style.transform = `translate3d(0, ${dragPendingY}px, 0)`;
      }
      dragRaf = null;
    });
  }
  e.preventDefault();
}, { passive: false });

function endDrag(commit){
  if (!drag) return;
  const d = drag; drag = null;
  if (dragRaf){ cancelAnimationFrame(dragRaf); dragRaf = null; }
  dragPendingY = null;
  d.el.classList.remove('dragging');
  d.el.style.transform = '';
  if (commit && d.started && d.moved && d.ns !== d.s0){
    const t = findTask(d.id);
    if (t){
      t.start = d.ns;
      resolve(tasksOn(state.date));
      save();
      render();
      haptic(6);
      offerUndo('Moved to ' + fmtTime(t.start), d.before, 3200);
    }
  }
}
window.addEventListener('pointerup', () => endDrag(true));
window.addEventListener('pointercancel', () => endDrag(false));

tlEl.addEventListener('click', e => {
  const chk = e.target.closest('.chk');
  if (chk){
    const t = findTask(chk.closest('.blk').dataset.id);
    if (t){
      t.done = !t.done;
      t.pct = t.done ? 100 : 0;
      save();
      haptic(t.done ? 10 : 5);
      render();
    }
    return;
  }
  const body = e.target.closest('.blk-body');
  if (body){
    const id = body.closest('.blk').dataset.id;
    if (id.startsWith('rec:')){
      openSheet('recurring', { recurringId: id.split(':')[1] });
    } else {
      openBlockSheet(id);
    }
    return;
  }
  /* tap on empty timeline → new block at that time */
  if (!e.target.closest('.blk')){
    const [lo, hi] = dayWindow();
    const y = e.clientY - tlEl.getBoundingClientRect().top;
    const start = clamp(Math.floor((lo + y / PXPM) / 15) * 15, lo, Math.max(lo, hi - 30));
    openNewBlock({ start });
  }
});

  const m = state.materials.find(v => v.id === card.dataset.id);
  if (!m) return false;
  const nd = clamp(m.done + d, 0, m.total);
  if (nd === m.done) return false;

  card.querySelector('.fill').style.width = matPct(m) + '%';
  card.querySelector('.pct').textContent = matPct(m) + '%';

  mHold.t = setTimeout(() => {

    tick();
    mHold.i = setInterval(tick, 130);
  }, 420);
});
function endMatHold(){
  if (mHold.t === null && mHold.i === null) return;
  clearTimeout(mHold.t); clearInterval(mHold.i);
  mHold.t = mHold.i = null;
  if (mHold.fired){ save(); }
}

/* ============================================================
   SHEET — typed + stepped fields
   A field is addressed by a key (e.g. "b.start", "sj:abc123"); everything that edits a number
   or a time of day goes through fieldSpec(), so +/-, hold-to-repeat, presets and typing all
   share the same clamping rules.
============================================================ */
function fieldSpec(f){
  const [key, arg] = f.split(':');
  const [lo, hi] = dayWindow();
  const T = () => findTask(sheetCtx.id);
  const R = () => state.recurring.find(x => x.id === sheetCtx.recurringId);
  const D = () => sheetCtx.draft;
  const S = state.settings;
  switch (key){
    case 'b.start': if (!T()) return null; return { kind:'time', get:() => T().start,
      set:v => { const t = T(); t.start = clamp(v, lo, Math.max(lo, hi - t.dur)); resolve(tasksOn(state.date)); } };
    case 'b.dur': if (!T()) return null; return { kind:'dur', unit:'min', get:() => T().dur,
      set:v => { const t = T(); t.dur = clamp(v, minDur(t.type), maxDur(t.type));
        if (t.start + t.dur > hi) t.start = Math.max(lo, hi - t.dur); resolve(tasksOn(state.date)); } };
    case 'b.pct': if (!T()) return null; return { kind:'num', unit:'%', get:() => T().pct || 0,
      set:v => { const t = T(); t.pct = clamp(v, 0, 100); t.done = t.pct >= 100; if (t.eff > 0) logFeedback(t); } };
    case 'r.start': if (!R()) return null; return { kind:'time', get:() => R().start,
      set:v => { const r = R(); r.start = clamp(v, 0, 1440 - r.dur); } };
    case 'r.dur': if (!R()) return null; return { kind:'dur', unit:'min', get:() => R().dur,
      set:v => { const r = R(); r.dur = clamp(v, MIN_FIXED, MAX_FIXED); r.start = Math.min(r.start, 1440 - r.dur); } };
    case 'n.start': if (!D()) return null; return { kind:'time', get:() => D().start,
      set:v => { D().start = clamp(v, lo, Math.max(lo, hi - D().dur)); } };
    case 'n.dur': if (!D()) return null; return { kind:'dur', unit:'min', get:() => D().dur,
      set:v => { const d = D(); d.dur = clamp(v, minDur(d.type), maxDur(d.type)); d.start = clamp(d.start, lo, Math.max(lo, hi - d.dur)); } };
    case 'w': return { kind:'time', get:() => S.wake, set:v => { S.wake = clamp(v, 0, 720); } };
    case 'z': return { kind:'time', get:() => S.sleep, set:v => { S.sleep = clamp(v === 0 ? 1440 : v, 720, 1440); } };
    case 'sj': { const s = state.subjects.find(x => x.id === arg); if (!s) return null;
      return { kind:'num', unit:'m', get:() => s.dailyGoalMin || 0, set:v => { s.dailyGoalMin = clamp(v, 0, 600); } }; }
    case 'mg': { const m = state.materials.find(x => x.id === arg); if (!m) return null;
      return { kind:'num', unit:'m', get:() => m.dailyGoalMin || 0, set:v => { m.dailyGoalMin = clamp(v, 0, 600); } }; }
    case 'm.total': if (!D()) return null; return { kind:'num', get:() => D().total,
      set:v => { const m = D(); m.total = clamp(v, 1, 999); m.done = Math.min(m.done || 0, m.total); } };
    case 'm.unit': if (!D()) return null; return { kind:'num', unit:'min', get:() => D().unitMin, set:v => { D().unitMin = clamp(v, 1, 120); } };
    case 'm.goal': if (!D()) return null; return { kind:'num', unit:'min', get:() => D().dailyGoalMin, set:v => { D().dailyGoalMin = clamp(v, 0, 600); } };
    case 'm.done': if (!D()) return null; return { kind:'num', get:() => D().done || 0, set:v => { D().done = clamp(v, 0, D().total); } };
    case 'sg': if (!D()) return null; return { kind:'num', unit:'min', get:() => D().dailyGoalMin, set:v => { D().dailyGoalMin = clamp(v, 0, 600); } };
  }
  return null;
}
const fieldText = f => { const sp = fieldSpec(f); return !sp ? '' : (sp.kind === 'time' ? fmtTime(sp.get()) : String(sp.get())); };

function stepField(f, delta){
  const sp = fieldSpec(f);
  if (!sp) return false;
  const v = sp.get(), s = Math.abs(delta);
  let nv = v + delta;
  if ((sp.kind === 'time' || sp.kind === 'dur') && v % s !== 0) nv = delta > 0 ? Math.ceil(v / s) * s : Math.floor(v / s) * s;
  sp.set(nv);
  return sp.get() !== v;
}
function stp(f, step){
  const sp = fieldSpec(f);
  if (!sp) return '';
  const time = sp.kind === 'time';
  return `<div class="stepper">
    <button data-a="step:${f}:${-step}" data-rep>−</button>
    <label class="fld ${time ? 'wide' : ''}"><input class="num" data-f="${f}" type="text" inputmode="${time ? 'text' : 'numeric'}" enterkeyhint="done" autocomplete="off" spellcheck="false" value="${esc(fieldText(f))}">${sp.unit ? `<i>${sp.unit}</i>` : ''}</label>
    <button data-a="step:${f}:${step}" data-rep>+</button>
  </div>`;
}
const frow = (label, f, step) => `<div class="ctl-row"><span>${label}</span>${stp(f, step)}</div>`;
const presets = (f, cur, vals, suffix) => `<div class="presets">${vals.map(v =>
  `<button class="pchip ${cur === v ? 'sel' : ''}" data-a="set:${f}:${v}">${v}${suffix || ''}</button>`).join('')}</div>`;
const catChips = (cur, prefix) => `<div class="chiprow cats">${CAT_KEYS.map(k =>

/* keep inputs in sync without rebuilding the sheet (used while a +/- button is held) */
function refreshFields(){
  sheet.querySelectorAll('input.num').forEach(i => { if (document.activeElement !== i) i.value = fieldText(i.dataset.f); });
  const sub = sheet.querySelector('[data-live="sub"]');
  if (sub) sub.textContent = liveSub();
}
function liveSub(){
  if (sheetCtx.mode === 'block'){
    const t = findTask(sheetCtx.id);
    if (!t) return '';
    const meta = t.type === 'fixed' ? catOf(t).name : (subjectNames(subjectsOfTask(t)) || 'Study');
    return `${meta} · ${fmtTime(t.start)} – ${fmtTime(t.start + t.dur)}`;
  }
  if (sheetCtx.mode === 'recurring'){
    const r = state.recurring.find(x => x.id === sheetCtx.recurringId);
    return r ? `Weekly · ${fmtTime(r.start)} – ${fmtTime(r.start + r.dur)}` : '';
  }
  return '';
}
function afterChange(quiet){
  const mode = sheetCtx.mode;
  if (!mode) return;
  if (quiet){
    refreshFields();
    if (mode === 'block' || mode === 'recurring') renderTimeline();
    return;
  }
  const draftOnly = mode === 'newblock' || mode === 'newsubj' || (mode === 'mat' && !sheetCtx.id);
  if (!draftOnly){ save(); render(); }
  renderSheet();
}

/* ---------- new block ---------- */
function nextFreeStart(dur = 45){
  const [lo, hi] = dayWindow();
  const list = allTasksOn(state.date);
  const now = new Date();
  let from = state.date === iso(now) ? now.getHours()*60 + now.getMinutes() : lo;
  from = Math.max(lo, Math.round(from / 15) * 15);
  for (let s = from; s + dur <= hi; s += 15){
    if (!overlaps(list, s, dur)) return s;
  }
  return lo;
}
function openNewBlock(opts){
  opts = opts || {};
  const last = state.prefs.last || {};
  const type = opts.type || last.type || 'study';
  const mat = state.materials.find(m => m.id === last.matId) || null;
  const subj = state.subjects.find(s => s.id === last.subjectId) || null;
  let matId = null, subjectId = null;
  if (mat) matId = mat.id;
  else if (subj) subjectId = subj.id;
  else if (state.materials[0]) matId = state.materials[0].id;
  else if (state.subjects[0]) subjectId = state.subjects[0].id;
  const dur = type === 'fixed' ? (last.fixedDur || 60) : (last.studyDur || preferredDur());
  const [lo, hi] = dayWindow();
  const start = opts.start != null ? clamp(opts.start, lo, Math.max(lo, hi - dur)) : nextFreeStart(dur);
  openSheet('newblock', { draft: {
    type, cat: CATS[last.cat] ? last.cat : 'cl', subjectId, matId,
    title: '', start, dur, repeat: false, days: []
  }});
}

/* ============================================================
   SHEET — events
============================================================ */
function textSet(key, val, commit){
  const d = sheetCtx.draft;
  if (key === 'nb.title'){ d.title = val; return; }
  if (key === 'sj.name'){ d.name = val; return; }
  if (key === 'm.title'){
    d.title = val;
    if (commit && sheetCtx.id){ if (!val.trim()) d.title = 'Material'; save(); render(); }
    return;
  }
  if (key === 'b.title'){
    const t = findTask(sheetCtx.id); if (!t) return;
    t.title = val;
    if (commit){ if (!val.trim()) t.title = catOf(t).name; save(); render(); const h = sheet.querySelector('.sheet-title'); if (h) h.textContent = t.title; }
    return;
  }
  if (key === 'r.title'){
    const r = state.recurring.find(x => x.id === sheetCtx.recurringId); if (!r) return;
    r.title = val;
    if (commit){ if (!val.trim()) r.title = (CATS[r.cat] || CATS.cl).name; save(); render(); const h = sheet.querySelector('.sheet-title'); if (h) h.textContent = r.title; }
  }
}
sheet.addEventListener('input', e => { if (e.target.dataset.t) textSet(e.target.dataset.t, e.target.value, false); });
sheet.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('input.num')){
    const sp = fieldSpec(el.dataset.f);
    if (!sp){ return; }
    const v = sp.kind === 'time' ? parseTime(el.value, sp.get()) : (sp.kind === 'dur' ? parseDur(el.value) : parseDur(el.value));
    if (Number.isNaN(v)){ el.value = fieldText(el.dataset.f); toast('Not a valid value'); return; }
    sp.set(v);
    const mode = sheetCtx.mode;
    if (!(mode === 'newblock' || mode === 'newsubj' || (mode === 'mat' && !sheetCtx.id))){ save(); render(); }
    refreshFields();
    haptic(4);
    return;
  }
  if (el.dataset.t) textSet(el.dataset.t, el.value, true);
});
sheet.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input')){ e.preventDefault(); e.target.blur(); }
});
sheet.addEventListener('focusin', e => {
  if (e.target.matches('input.num')) setTimeout(() => { try { e.target.select(); } catch(_){} }, 0);
});

/* hold a +/- button to repeat */
const hold = { t: null, i: null, fired: false, a: null };
sheet.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-rep]');
  if (!b) return;
  hold.fired = false; hold.a = b.dataset.a;
  hold.t = setTimeout(() => {
    hold.fired = true;
    const tick = () => handleAction(hold.a, true);
    tick();
    hold.i = setInterval(tick, 110);
  }, 380);
});
function endHold(){
  if (hold.t === null && hold.i === null) return;
  clearTimeout(hold.t); clearInterval(hold.i);
  hold.t = hold.i = null;
  if (hold.fired) afterChange(false);
}
window.addEventListener('pointerup', endHold);
window.addEventListener('pointercancel', endHold);

sheet.addEventListener('click', e => {
  if (hold.fired && e.target.closest('[data-rep]')){ hold.fired = false; return; }
  const btn = e.target.closest('[data-a]');
  if (!btn) return;
  handleAction(btn.dataset.a);
});

function lastPrefs(patch){ state.prefs.last = Object.assign({}, state.prefs.last || {}, patch); }

function handleAction(a, quiet){
  /* ---- generic: step / preset on any field ---- */
  if (a.startsWith('step:') || a.startsWith('set:')){
    const p = a.split(':');
    const n = parseInt(p[p.length - 1], 10);
    const f = p.slice(1, -1).join(':');
    if (a.startsWith('step:')){ if (stepField(f, n)) haptic(3); }
    else { const sp = fieldSpec(f); if (sp){ sp.set(n); haptic(4); } }
    afterChange(!!quiet);
    return;
  }

  const mode = sheetCtx.mode;

  /* ---- block ---- */
  if (mode === 'block'){
    const t = findTask(sheetCtx.id);
    if (!t) return;
    if (a.startsWith('bcat:')){ t.cat = a.slice(5); save(); render(); renderSheet(); }
    else if (/^e[1-5]$/.test(a)){ t.eff = parseInt(a[1], 10); logFeedback(t); save(); haptic(4); renderSheet(); }
    else if (a === 'del'){ deleteTaskObj(t); hideSheet(); }
    else if (a === 'close'){ hideSheet(); render(); }
    return;
  }

  /* ---- recurring ---- */
  if (mode === 'recurring'){
    const r = state.recurring.find(x => x.id === sheetCtx.recurringId);
    if (!r) return;
    if (a.startsWith('rcat:')){ r.cat = a.slice(5); }
    else if (a.startsWith('rday:')){
      const n = parseInt(a.slice(5), 10);
      const days = new Set(r.days || []);
      if (days.has(n)) days.delete(n); else days.add(n);
      r.days = [...days].sort((x, y) => x - y);
      if (!r.days.length) r.days = [n];
    }
    else if (a === 'rdel'){ deleteRecurring(r.id); hideSheet(); return; }
    else if (a === 'close'){ hideSheet(); render(); return; }
    else return;
    save(); render(); renderSheet();
    return;
  }

  /* ---- new block ---- */
  if (mode === 'newblock'){
    const d = sheetCtx.draft;
    const last = state.prefs.last || {};
    const [lo, hi] = dayWindow();
    if (a === 'type:fixed'){ d.type = 'fixed'; d.dur = clamp(last.fixedDur || 60, MIN_FIXED, MAX_FIXED); }
    else if (a === 'type:study'){ d.type = 'study'; d.repeat = false; d.dur = clamp(last.studyDur || preferredDur(), MIN_DUR, MAX_DUR); }
    else if (a.startsWith('ncat:')){ d.cat = a.slice(5); }
    else if (a === 'repeat:toggle'){ d.repeat = !d.repeat; if (d.repeat && !(d.days || []).length) d.days = [isoDow(state.date)]; }
    else if (a.startsWith('nday:')){
      const n = parseInt(a.slice(5), 10);
      d.days = d.days || [];
      d.days = d.days.includes(n) ? d.days.filter(x => x !== n) : [...d.days, n].sort((x, y) => x - y);
    }
    else if (a.startsWith('subj:')){ d.subjectId = a.slice(5) || null; d.matId = null; }
    else if (a.startsWith('mat:')){ d.matId = a.slice(4) || null; }
    else if (a === 'close'){ hideSheet(); return; }
    else if (a === 'create'){
      const before = snapState();
      d.start = clamp(d.start, lo, Math.max(lo, hi - d.dur));
      if (d.type === 'fixed'){
        const title = (d.title || '').trim() || CATS[d.cat].name;
        if (d.repeat && d.days && d.days.length){
          state.recurring.push({ id: uid(), title, cat: d.cat, start: d.start, dur: d.dur,
            days: [...new Set(d.days)].sort((x, y) => x - y), until: null });
        } else {
          tasksOn(state.date).push({ id: uid(), type: 'fixed', cat: d.cat, title, start: d.start, dur: d.dur });
        }
        lastPrefs({ type: 'fixed', cat: d.cat, fixedDur: d.dur });
      } else {
        const m = d.matId ? state.materials.find(x => x.id === d.matId) : null;
        const s = d.subjectId ? state.subjects.find(x => x.id === d.subjectId) : null;
        if (!m && !s){ toast('Pick a material or subject'); return; }
        const subs = m ? [...m.subjectIds] : [s.id];
        tasksOn(state.date).push({
          id: uid(), type: 'study',
          matId: m ? m.id : null,
          subjectId: subs[0] || null, subjectIds: subs,
          title: m ? m.title : s.name,
          start: d.start, dur: d.dur, done: false, pct: 0, eff: 0
        });
        lastPrefs({ type: 'study', matId: m ? m.id : null, subjectId: m ? null : s.id, studyDur: d.dur });
      }
      resolve(tasksOn(state.date));
      save();
      hideSheet(); render();
      haptic(10);
      offerUndo('Block added', before, 3200);
      return;
    }
    else return;
    renderSheet();
    return;
  }

  /* ---- material ---- */
  if (mode === 'mat'){
    const m = sheetCtx.draft;
    const editing = !!sheetCtx.id;
    if (a.startsWith('msub:')){
      const id = a.slice(5);
      const ids = new Set(m.subjectIds);
      if (ids.has(id)) ids.delete(id); else ids.add(id);
      m.subjectIds = state.subjects.filter(s => ids.has(s.id)).map(s => s.id);
      m.subjectId = m.subjectIds[0] || null;
      if (editing){ save(); render(); }
      renderSheet();
    }
    else if (a === 'mdel'){ const id = sheetCtx.id; hideSheet(); deleteMaterial(id); }
    else if (a === 'close'){ hideSheet(); if (editing) render(); }
    else if (a === 'createMat'){
      const title = (m.title || '').trim();
      if (!title){ toast('Name it first'); return; }
      const before = snapState();
      const first = state.subjects.find(s => s.id === m.subjectIds[0]);
      state.materials.push({
        id: uid(), title,
        subjectIds: [...m.subjectIds], subjectId: m.subjectIds[0] || null,
        total: Math.max(1, m.total), done: 0,
        unitMin: Math.max(1, m.unitMin), dailyGoalMin: Math.max(0, m.dailyGoalMin),
        color: first ? first.color : COLORS[state.materials.length % COLORS.length]
      });
      save();
      hideSheet(); render();
      haptic(10);
      offerUndo('Material added', before, 3200);
    }
    return;
  }

  /* ---- new subject ---- */
  if (mode === 'newsubj'){
    const d = sheetCtx.draft;
    if (a === 'close'){ hideSheet(); return; }
    if (a === 'createSubj'){
      const name = (d.name || '').trim();
      if (!name){ toast('Name it first'); return; }
      const before = snapState();
      state.subjects.push({ id: uid(), name, dailyGoalMin: Math.max(0, d.dailyGoalMin),
        color: COLORS[state.subjects.length % COLORS.length] });
      save();
      hideSheet(); render();
      haptic(10);
      offerUndo('Subject added', before, 3200);
    }
    return;
  }

  /* ---- settings ---- */
  if (mode === 'settings'){
    const s = state.settings;
    let changed = true;
    if (a.startsWith('sjx:')){ deleteSubject(a.slice(4)); renderSheet(); return; }
    else if (a === 'newsubj'){ openSheet('newsubj', { draft: { name:'', dailyGoalMin: 60 } }); return; }
    else if (a === 'newmat'){ openNewMat(); return; }
    else if (a.startsWith('medit:')){ openSheet('mat', { id: a.slice(6) }); return; }
    else if (a.startsWith('redit:')){ openSheet('recurring', { recurringId: a.slice(6) }); return; }
    else if (a.startsWith('rdelt:')){ deleteRecurring(a.slice(6)); renderSheet(); return; }
    else if (a === 'n:start'){ s.notif.start = !s.notif.start; }
    else if (a === 'n:end'){ s.notif.end = !s.notif.end; }
    else if (a === 'n:fixed'){ s.notif.fixed = !s.notif.fixed; }
    else if (a === 'n:lead-' || a === 'n:lead+'){
      const steps = [0, 5, 10, 15, 30];
      let i = steps.indexOf(s.notif.lead); if (i < 0) i = 0;
      i = clamp(i + (a === 'n:lead+' ? 1 : -1), 0, steps.length - 1);
      s.notif.lead = steps[i];
    }
    else if (a === 'n:perm'){ if (NATIVE) NATIVE.requestNotifPermission(); changed = false; }
    else if (a === 'n:exact'){ if (NATIVE) NATIVE.openExactAlarmSettings(); changed = false; }
    else if (a === 'n:test'){
      toast(NATIVE && NATIVE.testNotification() ? 'Sent' : 'Allow notifications first');
      changed = false;
    }
    else if (a === 'data:export'){ exportBackup(); changed = false; }
    else if (a === 'data:import'){ importBackup(); changed = false; }
    else if (a === 'close'){ hideSheet(); render(); return; }
    else changed = false;
    if (changed){ save(); render(); }
    renderSheet();
    return;
  }

  /* ---- review ---- */
  if (mode === 'review'){
    if (a === 'close'){ hideSheet(); return; }
    if (a.startsWith('open:')){ openBlockSheet(a.slice(5)); return; }
  }

  /* ---- share ---- */
  if (mode === 'share'){
    if (a === 'share:plan'){ doShare('plan'); return; }
    if (a === 'share:report'){ doShare('report'); return; }
  }
}

const FONT = "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif";
function cardBase(W, H){
  return `<defs>
    <radialGradient id="bg1" cx="15%" cy="5%" r="60%">
      <stop offset="0%" stop-color="#3a4358" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg2" cx="90%" cy="98%" r="55%">
      <stop offset="0%" stop-color="#2c4048" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="${W}" height="${H}" fill="#0a0b0e"/>
  <rect width="${W}" height="${H}" fill="url(#bg1)"/>
  <rect width="${W}" height="${H}" fill="url(#bg2)"/>`;
}

/* Day plan: always a chronological vertical timeline (earliest → latest) */
function buildDayPlanSVG(){
  const W = SHARE_W, P = 64;
  const list = allTasksOn(state.date).slice().sort((a, b) => a.start - b.start || a.dur - b.dur);
  const study = list.filter(t => t.type === 'study');
  const planned = study.reduce((a, t) => a + t.dur, 0);
  const dateStr = dateObj(state.date).toLocaleDateString(undefined,
    { weekday:'long', month:'long', day:'numeric', year:'numeric' });

  const n = list.length;
  const rowH = n <= 8 ? 100 : n <= 12 ? 84 : 70;
  const big = rowH >= 84;
  const lineX = P + 214, cardX = P + 258, cardW = W - P - cardX;
  const y0 = 372;

  let body = '';
  let y = y0;
  let prevEnd = null, firstCy = null, lastCy = null;
  if (!n){
    body += `<text x="${P}" y="${y + 30}" font-family="${FONT}" font-size="26" font-weight="500" fill="#6a7083">Nothing scheduled</text>`;
    y += 80;
  }
  for (const t of list){
    if (prevEnd !== null && t.start - prevEnd >= 45){
      body += `<text x="${cardX + 4}" y="${y + 30}" font-family="${FONT}" font-size="20" font-weight="500" font-style="italic" fill="#555c70">${fmtDur(t.start - prevEnd)} free</text>`;
      y += 44;
    }
    const c = colorForTask(t);
    const fixed = t.type === 'fixed';
    const cy = y + rowH / 2;
    if (firstCy === null) firstCy = cy;
    lastCy = cy;
    body += `<text x="${lineX - 30}" y="${cy - 2}" text-anchor="end" font-family="${FONT}" font-size="${big ? 27 : 24}" font-weight="700" fill="${fixed ? '#9aa3b8' : '#e8eaf0'}">${esc(fmtTime(t.start))}</text>`;
    body += `<text x="${lineX - 30}" y="${cy + (big ? 28 : 24)}" text-anchor="end" font-family="${FONT}" font-size="19" font-weight="600" fill="#6a7083">${fmtDur(t.dur)}</text>`;
    body += `<rect x="${cardX}" y="${y + 6}" width="${cardW}" height="${rowH - 12}" rx="18" fill="${c}" fill-opacity="${fixed ? 0.07 : 0.14}" stroke="${c}" stroke-opacity="${fixed ? 0.4 : 0.25}" ${fixed ? 'stroke-dasharray="7 6"' : ''}/>`;
    body += `<rect x="${cardX}" y="${y + 6}" width="7" height="${rowH - 12}" rx="3.5" fill="${c}"/>`;
    body += `<text x="${cardX + 32}" y="${cy - (big ? 1 : 0)}" font-family="${FONT}" font-size="${big ? 30 : 26}" font-weight="700" fill="${fixed ? '#c3c8d6' : '#f0f2f6'}">${esc(trunc(t.title, big ? 34 : 38))}</text>`;
    const sub = fixed ? catOf(t).name : (subjectNames(subjectsOfTask(t)) || 'Study');
    body += `<text x="${cardX + 32}" y="${cy + (big ? 32 : 28)}" font-family="${FONT}" font-size="${big ? 22 : 20}" font-weight="600" fill="#868da1">${esc(trunc(sub, 44))}</text>`;
    prevEnd = t.start + t.dur;
    y += rowH;
  }
  if (firstCy !== null){
    /* spine + nodes (drawn last so nodes sit on top of the line) */
    let spine = `<line x1="${lineX}" y1="${firstCy}" x2="${lineX}" y2="${lastCy}" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>`;
    let yy = y0, pe = null;
    for (const t of list){
      if (pe !== null && t.start - pe >= 45) yy += 44;
      spine += `<circle cx="${lineX}" cy="${yy + rowH / 2}" r="11" fill="#0a0b0e" stroke="${colorForTask(t)}" stroke-width="4"/>`;
      pe = t.start + t.dur;
      yy += rowH;
    }
    body = spine + body;
  }

  const footTop = y + 50;
  const H = Math.max(1350, footTop + 170);
  let s = cardBase(W, H);
  s += `<text x="${P}" y="${P + 30}" font-family="${FONT}" font-size="22" font-weight="700" fill="#95a0b8" letter-spacing="4">FOCUSFLOW</text>`;
  s += `<text x="${P}" y="${P + 130}" font-family="${FONT}" font-size="76" font-weight="700" fill="#f0f2f6" letter-spacing="-2">My Day Plan</text>`;
  s += `<text x="${P}" y="${P + 180}" font-family="${FONT}" font-size="26" font-weight="500" fill="#868da1">${esc(dateStr)}</text>`;
  s += `<text x="${P}" y="${P + 246}" font-family="${FONT}" font-size="26" font-weight="700" fill="#dfe1e8">${study.length} study block${study.length === 1 ? '' : 's'} · ${fmtDur(planned)}</text>`;
  s += body;
  s += `<line x1="${P}" y1="${footTop}" x2="${W - P}" y2="${footTop}" stroke="#ffffff" stroke-opacity="0.08"/>`;
  s += `<text x="${P}" y="${footTop + 62}" font-family="${FONT}" font-size="28" font-weight="700" fill="#dfe1e8">Hold me accountable</text>`;
  s += `<text x="${W - P}" y="${H - P + 6}" text-anchor="end" font-family="${FONT}" font-size="15" font-weight="600" fill="#4e5566">focusflow · ${state.date}</text>`;
  return { svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>`, w: W, h: H };
}

function buildDayReportSVG(){
  const W = SHARE_W, P = 64;
  const list = allTasksOn(state.date);
  const study = list.filter(t => t.type === 'study');
  const planned = study.reduce((a,t) => a + t.dur, 0);
  const done = study.reduce((a,t) => a + t.dur * ((t.pct||0)/100), 0);
  const pct = planned ? Math.round(done/planned*100) : 0;
  const effList = study.filter(t => t.eff > 0).map(t => t.eff);
  const avgEff = effList.length ? (effList.reduce((a,b)=>a+b,0) / effList.length) : 0;
  const dateStr = dateObj(state.date).toLocaleDateString(undefined,
    { weekday:'long', month:'long', day:'numeric', year:'numeric' });

  const nSubj = Math.min(5, state.subjects.filter(x => x.dailyGoalMin > 0).length);
  const nBlk = Math.min(6, study.length);
  const H = Math.max(1350, 786 + 40 + Math.max(1, nSubj) * 52 + 40 + 36 + Math.max(1, nBlk) * 40 + 150);
  let s = cardBase(W, H);

  s += `<text x="${P}" y="${P+30}" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="700" fill="#95a0b8" letter-spacing="4">FOCUSFLOW</text>`;
  s += `<text x="${P}" y="${P+130}" font-family="-apple-system,sans-serif" font-size="76" font-weight="700" fill="#f0f2f6" letter-spacing="-2">My Day Report</text>`;
  s += `<text x="${P}" y="${P+180}" font-family="-apple-system,sans-serif" font-size="26" font-weight="500" fill="#868da1">${esc(dateStr)}</text>`;

  // Big circle
  const cx = W/2, cy = 420, r = 130;
  const circ = 2 * Math.PI * r;
  const off = circ * (1 - pct/100);
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="14"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#a3b3c9" stroke-opacity="0.95" stroke-width="14" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})"/>`;
  s += `<text x="${cx}" y="${cy+28}" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="92" font-weight="800" fill="#f0f2f6" letter-spacing="-3">${pct}%</text>`;
  s += `<text x="${cx}" y="${cy+68}" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="18" font-weight="700" fill="#868da1" letter-spacing="4">COMPLETED</text>`;

  // Stats
  const statY = cy + r + 70;
  s += `<text x="${cx}" y="${statY}" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="26" font-weight="600" fill="#dfe1e8">${Math.round(done)} of ${planned} minutes studied</text>`;

  // Stars
  const starY = statY + 56;
  const starGap = 46;
  const startX = cx - (5-1) * starGap / 2;
  for (let i = 0; i < 5; i++){
    const filled = i < Math.round(avgEff);
    s += `<text x="${startX + i*starGap}" y="${starY}" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="40" fill="${filled ? '#dde3f0' : '#2a2e3a'}">★</text>`;
  }
  s += `<text x="${cx}" y="${starY+40}" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="18" font-weight="500" fill="#868da1">${avgEff ? avgEff.toFixed(1) + ' / 5 average efficiency' : 'no efficiency logged'}</text>`;

  // Subject progress
  const subjStartY = starY + 110;
  s += `<text x="${P}" y="${subjStartY}" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#666c80" letter-spacing="3">SUBJECT GOALS</text>`;

  const bySubj = subjectMinutes(study, true);

  let rowY = subjStartY + 40;
  const subjList = state.subjects.filter(x => x.dailyGoalMin > 0).slice(0, 5);
  if (!subjList.length){
    s += `<text x="${P}" y="${rowY+14}" font-family="-apple-system,sans-serif" font-size="20" font-weight="500" fill="#6a7083">No subjects yet</text>`;
  } else {
    for (const sj of subjList){
      const d = bySubj[sj.id] || 0;
      const goal = sj.dailyGoalMin || 1;
      const p = Math.min(1, d / goal);
      const barY = rowY + 24;
      const barW = W - P*2 - 200;
      s += `<circle cx="${P+8}" cy="${rowY-6}" r="6" fill="${sj.color}"/>`;
      s += `<text x="${P+26}" y="${rowY}" font-family="-apple-system,sans-serif" font-size="20" font-weight="600" fill="#dfe1e8">${esc(sj.name)}</text>`;
      s += `<text x="${W-P}" y="${rowY}" text-anchor="end" font-family="-apple-system,sans-serif" font-size="18" font-weight="700" fill="#a3aabd">${Math.round(d)} / ${sj.dailyGoalMin}m</text>`;
      s += `<rect x="${P+26}" y="${barY}" width="${barW}" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>`;
      s += `<rect x="${P+26}" y="${barY}" width="${barW*p}" height="6" rx="3" fill="${sj.color}" fill-opacity="0.9"/>`;
      rowY += 52;
    }
  }

  // Completed blocks
  const blocksStartY = rowY + 40;
  s += `<text x="${P}" y="${blocksStartY}" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#666c80" letter-spacing="3">TODAY'S BLOCKS</text>`;

  const blocks = [...study].sort((a,b) => a.start - b.start).slice(0, 6);
  let bY = blocksStartY + 36;
  if (!blocks.length){
    s += `<text x="${P}" y="${bY+14}" font-family="-apple-system,sans-serif" font-size="20" font-weight="500" fill="#6a7083">No study blocks today</text>`;
  } else {
    for (const t of blocks){
      const c = colorForTask(t);
      const p = t.pct || 0;
      const mark = p >= 100 ? '✓' : p > 0 ? '·' : '○';
      const markColor = p >= 100 ? '#8bb59a' : p > 0 ? '#a3aabd' : '#4e5566';
      s += `<text x="${P+6}" y="${bY+8}" font-family="-apple-system,sans-serif" font-size="22" font-weight="700" fill="${markColor}">${mark}</text>`;
      s += `<circle cx="${P+42}" cy="${bY}" r="6" fill="${c}"/>`;
      s += `<text x="${P+60}" y="${bY+8}" font-family="-apple-system,sans-serif" font-size="20" font-weight="600" fill="#dfe1e8">${esc(t.title)}</text>`;
      s += `<text x="${W-P}" y="${bY+8}" text-anchor="end" font-family="-apple-system,sans-serif" font-size="18" font-weight="700" fill="#a3aabd">${p}%</text>`;
      bY += 40;
    }
  }

  // Footer
  s += `<line x1="${P}" y1="${H-P-64}" x2="${W-P}" y2="${H-P-64}" stroke="#ffffff" stroke-opacity="0.08"/>`;
  s += `<text x="${P}" y="${H-P-24}" font-family="-apple-system,sans-serif" font-size="20" font-weight="600" fill="#868da1">Keep going. Small consistent days win.</text>`;
  s += `<text x="${W-P}" y="${H-P+6}" text-anchor="end" font-family="-apple-system,sans-serif" font-size="15" font-weight="600" fill="#4e5566">focusflow · ${state.date}</text>`;

  return { svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>`, w: W, h: H };
}

/* ============================================================
   SHARE — PNG EXPORT
============================================================ */
async function svgToPngBlob(svgStr, w, h, scale = 2){
  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error('SVG load failed'));
      img.src = url;
    });
    const canvas = document.createElement('canvas');
    canvas.width = w * scale;
    canvas.height = h * scale;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return await new Promise((res, rej) => {
      canvas.toBlob(b => b ? res(b) : rej(new Error('toBlob failed')), 'image/png');
    });
  } finally {
    URL.revokeObjectURL(url);
  }
}

function blobToBase64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}
async function shareOrDownload(blob, filename, title){
  if (NATIVE){
    NATIVE.shareFile(await blobToBase64(blob), filename, 'image/png', title);
    return 'shared';
  }
  const file = new File([blob], filename, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try {
      await navigator.share({ files: [file], title });
      return 'shared';
    } catch(e){
      if (e.name === 'AbortError') return 'cancelled';
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return 'downloaded';
}

async function doShare(kind){
  const list = allTasksOn(state.date);
  if (!list.length){ toast('Nothing to share yet'); return; }
  const isPlan = kind === 'plan';
  const built = isPlan ? buildDayPlanSVG() : buildDayReportSVG();
  const filename = `focusflow-${state.date}-${isPlan ? 'plan' : 'report'}.png`;
  toast('Generating image…', { duration: 4000 });
  try {
    const blob = await svgToPngBlob(built.svg, built.w, built.h, 2);
    const result = await shareOrDownload(blob, filename, isPlan ? 'My day plan' : 'My day report');
    if (result === 'downloaded') toast('Image saved');
    else if (result === 'shared') toast('Shared');
    haptic(12);
  } catch(e){
    console.warn(e);
    toast('Could not generate image');
  }
}
