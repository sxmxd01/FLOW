/* ============================================================
   MATERIAL PROGRESS — one unit per tap, hold to repeat
============================================================ */
const matsEl = $('#mats'), mHold = { t:null, i:null, fired:false };
function stepMat(card, d){
  const m = materialById(card.dataset.id);
  if (!m) return false;
  const nd = clamp(m.done + d, 0, m.total);
  if (nd === m.done) return false;
  m.done = nd;
  card.querySelector('.fill').style.width = matPct(m) + '%';
  card.querySelector('.pct').textContent = matPct(m) + '%';
  const u = card.querySelector('.units');
  u.innerHTML = `${m.done}<span>/${m.total}</span>`;
  pop(u);
  return true;
}
matsEl.addEventListener('pointerdown', e => {
  const b = e.target.closest('.mstep');
  if (!b) return;
  const card = b.closest('.mat'), d = parseInt(b.dataset.mstep, 10);
  mHold.fired = false;
  mHold.t = setTimeout(() => {
    mHold.fired = true;
    const step = () => { if (stepMat(card, d)) haptic(3); };
    step(); mHold.i = setInterval(step, 130);
  }, 420);
});
function endMatHold(){
  if (mHold.t === null && mHold.i === null) return;
  clearTimeout(mHold.t); clearInterval(mHold.i); mHold.t = mHold.i = null;
  if (mHold.fired) save();
}
window.addEventListener('pointerup', endMatHold);
window.addEventListener('pointercancel', endMatHold);
matsEl.addEventListener('click', e => {
  const b = e.target.closest('.mstep');
  if (b){
    if (mHold.fired){ mHold.fired = false; return; }
    if (stepMat(b.closest('.mat'), parseInt(b.dataset.mstep, 10))){ save(); haptic(6); }
    return;
  }
  if (e.target.closest('#addMat')){ openNewMat(); return; }
  const ed = e.target.closest('[data-edit]');
  if (ed) openSheet('mat', { id:ed.closest('.mat').dataset.id });
});

/* ============================================================
   SHEET SHELL — a navigation stack, so child sheets (add subject, edit material, share …)
   always return to where you came from instead of dumping you on the main screen.
============================================================ */
const sheet = $('#sheet'), backdrop = $('#backdrop');
const sheetStack = [];
let sheetOpen = false;
const PARENT_TITLE = { settings:'Settings', set:'Settings', review:'Review', newblock:'New block', block:'Block', mat:'Material' };

function setCtx(mode, p){
  p = p || {};
  Object.assign(sheetCtx, { mode, id:p.id || null, recurringId:p.recurringId || null, draft:p.draft || null, phase:p.phase || null, tab:p.tab || null, armed:false });
  if (mode === 'mat' && sheetCtx.id) sheetCtx.draft = materialById(sheetCtx.id) || null;
}
const ctxSnap = () => ({ mode:sheetCtx.mode, id:sheetCtx.id, recurringId:sheetCtx.recurringId, draft:sheetCtx.draft, phase:sheetCtx.phase, tab:sheetCtx.tab });
function showSheet(){
  sheetOpen = true; backdrop.classList.add('show'); sheet.classList.add('show'); sheet.scrollTop = 0;
  if (NATIVE){ try { NATIVE.setSheetOpen(true); } catch(_){} }
}
function hideSheet(){
  sheetOpen = false; sheetStack.length = 0; sheetCtx.mode = null;
  backdrop.classList.remove('show'); sheet.classList.remove('show');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (NATIVE){ try { NATIVE.setSheetOpen(false); } catch(_){} }
}
backdrop.addEventListener('click', () => backSheet());
function openSheet(mode, payload){
  sheetStack.length = 0;
  setCtx(mode, payload);
  if (sheetCtx.mode === 'mat' && !sheetCtx.draft){ sheetCtx.mode = null; return; }
  renderSheet('open');
  if (!sheetOpen) showSheet();
  haptic(4);
}
function pushSheet(mode, payload){
  if (!sheetOpen){ openSheet(mode, payload); return; }
  sheetStack.push(ctxSnap());
  setCtx(mode, payload);
  renderSheet('fwd');
  sheet.scrollTop = 0; haptic(3);
}
function backSheet(){
  if (!sheetOpen) return;
  if (!sheetStack.length){ hideSheet(); return; }
  Object.assign(sheetCtx, sheetStack.pop(), { armed:false });
  renderSheet('back');
  sheet.scrollTop = 0;
}
function renderSheet(kind){
  switch (sheetCtx.mode){
    case 'block':     renderBlockSheet(); break;
    case 'recurring': renderRecurringSheet(); break;
    case 'newblock':  renderNewBlockSheet(); break;
    case 'settings':  renderSettingsHome(); break;
    case 'set':       renderSettingsGroup(); break;
    case 'mat':       renderMatSheet(); break;
    case 'newsubj':   renderNewSubjSheet(); break;
    case 'review':    renderReviewSheet(); break;
    case 'share':     renderShareSheet(); break;
    case 'startday':  renderStartDaySheet(); break;
    case 'endday':    renderEndDaySheet(); break;
    default: return;
  }
  if (sheetStack.length){
    const parent = sheetStack[sheetStack.length - 1];
    const handle = sheet.querySelector('.handle');
    if (handle) handle.insertAdjacentHTML('afterend',
      `<button class="sheet-back" data-a="back">${ICON.back}<span>${PARENT_TITLE[parent.mode] || 'Back'}</span></button>`);
  }
  if (kind){ sheet.classList.remove('in-open', 'in-fwd', 'in-back'); void sheet.offsetWidth; sheet.classList.add('in-' + kind); }
}
const refreshOpenSheet = () => { if (sheetOpen && sheetCtx.mode){ if (sheetCtx.mode === 'mat' && sheetCtx.id && !materialById(sheetCtx.id)) hideSheet(); else renderSheet(); } };
function openBlockSheet(id){ openSheet('block', { id }); }

/* ============================================================
   FIELDS — one registry for typed input, +/- (hold to repeat) and presets
============================================================ */
function fieldSpec(f){
  const [key, arg] = f.split(':');
  const S = state.settings;
  const [lo, hi] = dayWindow();
  const T = () => findTask(sheetCtx.id), R = () => state.recurring.find(x => x.id === sheetCtx.recurringId), D = () => sheetCtx.draft;
  switch (key){
    case 'b.start': if (!T()) return null; return { kind:'time', get:() => T().start,
      set:v => { const t = T(); t.start = clamp(v, lo, Math.max(lo, hi - t.dur)); resolve(tasksOn(taskDate(t.id) || state.date)); } };
    case 'b.dur': if (!T()) return null; return { kind:'dur', unit:'min', get:() => T().dur,
      set:v => { const t = T(); t.dur = clamp(v, minDur(t.type), maxDur(t.type)); if (t.start + t.dur > hi) t.start = Math.max(lo, hi - t.dur); resolve(tasksOn(taskDate(t.id) || state.date)); } };
    case 'b.pct': if (!T()) return null; return { kind:'num', unit:'%', get:() => T().pct || 0,
      set:v => { const t = T(); t.pct = clamp(v, 0, 100); t.done = t.pct >= 100; learnFrom(t, false); } };
    case 'r.start': if (!R()) return null; return { kind:'time', get:() => R().start, set:v => { const r = R(); r.start = clamp(v, 0, 1440 - r.dur); } };
    case 'r.dur': if (!R()) return null; return { kind:'dur', unit:'min', get:() => R().dur,
      set:v => { const r = R(); r.dur = clamp(v, MIN_FIXED, MAX_FIXED); r.start = Math.min(r.start, 1440 - r.dur); } };
    case 'n.start': if (!D()) return null; return { kind:'time', get:() => D().start, set:v => { D().start = clamp(v, lo, Math.max(lo, hi - D().dur)); } };
    case 'n.dur': if (!D()) return null; return { kind:'dur', unit:'min', get:() => D().dur,
      set:v => { const d = D(); d.dur = clamp(v, minDur(d.type), maxDur(d.type)); d.start = clamp(d.start, lo, Math.max(lo, hi - d.dur)); } };
    case 'sd.start': if (!D()) return null; return { kind:'time', get:() => D().start, set:v => { D().start = clamp(v, 0, 1380); } };
    case 'w': return { kind:'time', get:() => S.wake, set:v => { S.wake = clamp(v, 0, 720); } };
    case 'z': return { kind:'time', get:() => S.sleep, set:v => { S.sleep = clamp(v < 600 ? v + 1440 : v, 720, MAX_BED); } };
    case 'sj': { const s = subjectById(arg); if (!s) return null;
      return { kind:'num', unit:'m', get:() => s.dailyGoalMin || 0, set:v => { s.dailyGoalMin = clamp(v, 0, 600); } }; }
    case 'mg': { const m = materialById(arg); if (!m) return null;
      return { kind:'num', unit:'m', get:() => m.dailyGoalMin || 0, set:v => { m.dailyGoalMin = clamp(v, 0, 600); } }; }
    case 'm.total': if (!D()) return null; return { kind:'num', get:() => D().total, set:v => { const m = D(); m.total = clamp(v, 1, 999); m.done = Math.min(m.done || 0, m.total); } };
    case 'm.unit': if (!D()) return null; return { kind:'num', unit:'min', get:() => D().unitMin, set:v => { D().unitMin = clamp(v, 1, 120); } };
    case 'm.goal': if (!D()) return null; return { kind:'num', unit:'min', get:() => D().dailyGoalMin, set:v => { D().dailyGoalMin = clamp(v, 0, 600); } };
    case 'm.done': if (!D()) return null; return { kind:'num', get:() => D().done || 0, set:v => { D().done = clamp(v, 0, D().total); } };
    case 'sg': if (!D()) return null; return { kind:'num', unit:'min', get:() => D().dailyGoalMin, set:v => { D().dailyGoalMin = clamp(v, 0, 600); } };
    case 'ui': return { kind:'num', get:() => S.ui[arg], set:v => { S.ui[arg] = v; } };
    case 'cfg': {
      const m = CFG[arg] || (arg === 'plan.variety' ? { min:0, max:2 } : arg === 'plan.tone' ? { min:-1, max:1 } : arg === 'plan.learnDays' ? { min:3, max:60 } : null);
      if (!m) return null;
      return { kind:'num', unit:m.unit, zero:m.zero, get:() => getPath(S, arg),
        set:v => {
          setPath(S, arg, clamp(v, m.min, m.max));
          const P = S.plan;
          if (arg === 'plan.minBlock' && P.minBlock > P.maxBlock) P.maxBlock = P.minBlock;
          if (arg === 'plan.maxBlock' && P.maxBlock < P.minBlock) P.minBlock = P.maxBlock;
        } };
    }
  }
  return null;
}
function fieldText(f){
  const sp = fieldSpec(f);
  if (!sp) return '';
  const v = sp.get();
  if (sp.kind === 'time') return fmtTime(v);
  return v === 0 && sp.zero ? sp.zero : String(v);
}
function stepField(f, delta){
  const sp = fieldSpec(f);
  if (!sp) return false;
  const v = sp.get(), s = Math.abs(delta);
  let nv = v + delta;
  if ((sp.kind === 'time' || sp.kind === 'dur') && v % s !== 0) nv = delta > 0 ? ceilTo(v, s) : Math.floor(v / s) * s;
  sp.set(nv);
  return sp.get() !== v;
}
function stp(f, step){
  const sp = fieldSpec(f);
  if (!sp) return '';
  const time = sp.kind === 'time', zero = sp.zero && sp.get() === 0;
  return `<div class="stepper">
    <button data-a="step:${f}:${-step}" data-rep>−</button>
    <label class="fld ${time || zero ? 'wide' : ''}"><input class="num" data-f="${f}" type="text" inputmode="${time ? 'text' : 'numeric'}" enterkeyhint="done" autocomplete="off" spellcheck="false" value="${esc(fieldText(f))}">${sp.unit && !zero ? `<i>${sp.unit}</i>` : ''}</label>
    <button data-a="step:${f}:${step}" data-rep>+</button></div>`;
}
const frow = (label, f, step) => `<div class="ctl-row"><span>${label}</span>${stp(f, step)}</div>`;
const cfgRow = (label, path) => frow(label, 'cfg:' + path, CFG[path].step);
/* [value,label] pairs or plain values */
const presets = (f, cur, vals, suffix) => `<div class="presets">${vals.map(v => { const [val, label] = Array.isArray(v) ? v : [v, v + (suffix || '')];
  return `<button class="pchip ${cur === val ? 'sel' : ''}" data-a="set:${f}:${val}">${label}</button>`; }).join('')}</div>`;
const catChips = (cur, prefix) => `<div class="chiprow cats">${CAT_KEYS.map(k =>
  `<button class="mchip ${cur === k ? 'sel' : ''}" data-a="${prefix}:${k}"><span class="cdot" style="background:${CATS[k].color}"></span>${CATS[k].name}</button>`).join('')}</div>`;
const tog = (a, v) => `<div class="stepper"><button class="tgl ${v ? 'on' : ''}" data-a="${a}" role="switch" aria-checked="${!!v}"><i></i></button></div>`;
const trow = (label, path, hint) => `<div class="ctl-row"><span>${label}${hint ? `<em>${hint}</em>` : ''}</span>${tog('tg:' + path, getPath(state.settings, path))}</div>`;
const dayNames = ['M','T','W','T','F','S','S'];
const dayChips = (days, prefix) => `<div class="chiprow">${[1,2,3,4,5,6,7].map(n =>
  `<button class="day-mini ${(days || []).includes(n) ? 'on' : ''}" data-a="${prefix}:${n}">${dayNames[n-1]}</button>`).join('')}</div>`;

function liveSub(){
  const m = sheetCtx.mode;
  if (m === 'block'){
    const t = findTask(sheetCtx.id); if (!t) return '';
    const meta = t.type === 'fixed' ? catOf(t).name : (subjectNames(subjectsOfTask(t)) || 'Study');
    return `${meta} · ${fmtTime(t.start)} – ${fmtTime(t.start + t.dur)}`;
  }
  if (m === 'recurring'){ const r = state.recurring.find(x => x.id === sheetCtx.recurringId); return r ? `Weekly · ${fmtTime(r.start)} – ${fmtTime(r.start + r.dur)}` : ''; }
  if (m === 'startday'){
    const T = sheetCtx.draft.start, n = tasksOn(todayKey()).filter(t => t.type === 'study' && !t.done && !(t.pct > 0) && t.start < T).length;
    return n ? `${n} block${n > 1 ? 's' : ''} before ${fmtTime(T)} will be re-fit` : 'Nothing to re-fit';
  }
  return '';
}
/* update values in place (no rebuild) — used while a +/- is held and after typing */
function refreshFields(){
  sheet.querySelectorAll('input.num').forEach(i => { if (document.activeElement !== i) i.value = fieldText(i.dataset.f); });
  sheet.querySelectorAll('.pchip[data-a^="set:"]').forEach(b => {
    const p = b.dataset.a.split(':'), v = parseInt(p[p.length - 1], 10), sp = fieldSpec(p.slice(1, -1).join(':'));
    if (sp) b.classList.toggle('sel', sp.get() === v);
  });

  if (sub) sub.textContent = liveSub();
}
const draftOnly = () => ['newblock','newsubj','startday','endday'].includes(sheetCtx.mode) || (sheetCtx.mode === 'mat' && !sheetCtx.id);
function afterChange(quiet){
  const mode = sheetCtx.mode;
  if (!mode) return;
  if (quiet){ refreshFields(); if (mode === 'block' || mode === 'recurring') renderTimeline(); return; }
  if (!draftOnly()){ applyUi(); modelDirty = true; save(); render(); }
  renderSheet();
}

/* ============================================================
   STUDY BLOCK PICKERS — a block can reference a material AND subjects
============================================================ */
function studyPickers(o){
  const subs = new Set(o.subjectIds || []);
  const mats = state.materials.map(m => `<button class="mchip ${o.matId === m.id ? 'sel' : ''}" data-a="pm:${m.id}"><span class="cdot" style="background:${m.color}"></span>${esc(m.title)}</button>`).join('');
  const sj = state.subjects.map(s => `<button class="mchip ${subs.has(s.id) ? 'sel' : ''}" data-a="ps:${s.id}"><span class="cdot" style="background:${s.color}"></span>${esc(s.name)}</button>`).join('');
  return `<div class="sec">Material</div><div class="chiprow">${mats}<button class="mchip add" data-a="addmat">+</button></div>
          <div class="sec">Subjects</div><div class="chiprow">${sj}<button class="mchip add" data-a="addsub">+</button></div>`;
}
/* returns true when the action was a picker action */
function pickerAction(o, a, onChange){
  if (a.startsWith('pm:')){
    const id = a.slice(3);
    if (o.matId === id) o.matId = null;
    else { o.matId = id; const m = materialById(id); if (m && m.subjectIds.length) o.subjectIds = [...m.subjectIds]; }
  } else if (a.startsWith('ps:')){
    const id = a.slice(3), s = new Set(o.subjectIds || []);
    s.has(id) ? s.delete(id) : s.add(id);
    o.subjectIds = state.subjects.filter(x => s.has(x.id)).map(x => x.id);
  } else if (a === 'addsub'){
    pushSheet('newsubj', { draft:{ name:'', dailyGoalMin:60, after:s => { o.subjectIds = [...(o.subjectIds || []), s.id]; onChange && onChange(); renderSheet(); } } });
    return true;
  } else if (a === 'addmat'){
    pushSheet('mat', { draft:{ title:'', subjectIds:[...(o.subjectIds || [])], total:20, unitMin:6, dailyGoalMin:30, done:0,
      after:m => { o.matId = m.id; if (m.subjectIds.length) o.subjectIds = [...m.subjectIds]; onChange && onChange(); renderSheet(); } } });
    return true;
  } else return false;
  o.subjectId = (o.subjectIds || [])[0] || null;
  onChange && onChange();
  return true;
}

/* ---------- new block ---------- */
function nextFreeStart(dur = 45){
  const [lo, hi] = dayWindow(), list = allTasksOn(state.date);
  let from = state.date === todayKey() ? nowMinutes() : lo;
  from = Math.max(lo, roundTo(from, 15));
  for (let s = from; s + dur <= hi; s += 15) if (!overlaps(list, s, dur)) return s;
  return lo;
}
function openNewBlock(opts){
  opts = opts || {};
  const last = state.prefs.last || {};
  const type = opts.type || last.type || 'study';
  const mat = materialById(last.matId) || null;
  const dur = type === 'fixed' ? (last.fixedDur || 60) : (last.studyDur || preferredDur());
  const [lo, hi] = dayWindow();
  const subjectIds = mat ? [...mat.subjectIds] : (last.subjectIds || []).filter(subjectById);
  openSheet('newblock', { draft:{
    type, cat:CATS[last.cat] ? last.cat : 'cl',
    matId: mat ? mat.id : null,
    subjectIds: subjectIds.length || mat ? subjectIds : (state.materials[0] ? [] : (state.subjects[0] ? [state.subjects[0].id] : [])),
    title:'', repeat:false, days:[], dur,
    start: opts.start != null ? clamp(opts.start, lo, Math.max(lo, hi - dur)) : nextFreeStart(dur)
  }});
  if (!sheetCtx.draft.matId && !sheetCtx.draft.subjectIds.length && state.materials[0] && type === 'study'){
    sheetCtx.draft.matId = state.materials[0].id; sheetCtx.draft.subjectIds = [...state.materials[0].subjectIds]; renderSheet();
  }
}
function renderNewBlockSheet(){
  const d = sheetCtx.draft, fixed = d.type === 'fixed';
  sheet.innerHTML = `
    <div class="handle"></div>
    <div class="chiprow" style="padding-top:0">

function reviewDay(){
  const key = state.date, all = allTasksOn(key), st = dayStats(key), w = workload(key);
  const cat = { study:st.planned };
  for (const t of all) if (t.type === 'fixed') cat[t.cat || 'cl'] = (cat[t.cat || 'cl'] || 0) + t.dur;
  const split = [['study','Study','#95a5bc'], ...CAT_KEYS.map(k => [k, CATS[k].name, CATS[k].color])].filter(([k]) => cat[k] > 0)
    .map(([k, n, c]) => `<span class="split"><i style="background:${c}"></i>${n} <b>${fmtDur(cat[k])}</b></span>`).join('');
  const bySubj = subjectMinutes(st.ts, true);
  const rows = state.subjects.filter(s => s.dailyGoalMin > 0).map(s => {
    const done = bySubj[s.id] || 0, pct = Math.min(100, done / s.dailyGoalMin * 100);
    return `<div class="row" style="border:0;padding:7px 0"><div style="min-width:0;flex:1"><div class="nm"><span class="cdot" style="background:${s.color}"></span>${esc(s.name)}</div>
      <div class="goalbar"><i style="width:${pct}%;background:${s.color}"></i></div></div><div class="right"><div class="sub" style="margin:0">${Math.round(done)}/${s.dailyGoalMin}m</div></div></div>`;
  }).join('');
  return `<div class="sheet-title" style="margin-top:12px">${Math.round(st.done)} / ${st.planned} min${st.avg ? ` · ★ ${st.avg.toFixed(1)}` : ''}</div>
    ${w.over ? `<div class="warnline">Heavy day — ${fmtDur(st.planned)} planned vs ${fmtDur(w.cap)} you usually manage</div>` : ''}
    ${split ? `<div class="splits">${split}</div>` : ''}
    ${rows ? `<div class="sec">Goals</div>${rows}` : ''}
    ${st.ts.length ? `<div class="sec">Blocks</div>` + [...st.ts].sort((a, b) => a.start - b.start).map(t => `
      <div class="row tap" data-a="open:${t.id}"><div style="min-width:0"><div class="nm"><span class="cdot" style="background:${colorForTask(t)}"></span>${esc(t.title)}</div>
        <div class="sub">${fmtShort(t.start)} – ${fmtShort(t.start + t.dur)} · ${t.dur}m</div></div>
        <div class="right"><div class="sub" style="margin:0">${t.pct || 0}%</div><div class="sub" style="margin:0;color:#95a5bc;min-width:46px;text-align:right">${t.eff ? '★'.repeat(t.eff) : '—'}</div></div></div>`).join('')
      : `<div class="note">No study blocks.</div>`}`;
}
function reviewWeek(){
  const days = weekDates().map(d => { const key = iso(d), st = dayStats(key); return { key, d, st }; });
  const maxP = Math.max(60, ...days.map(x => Math.max(x.st.planned, x.st.done)));
  const totDone = days.reduce((a, x) => a + x.st.done, 0), totPlan = days.reduce((a, x) => a + x.st.planned, 0);
  const active = days.filter(x => x.st.planned > 0).length;
  const bySubj = {};
  for (const x of days) for (const [sid, v] of Object.entries(subjectMinutes(x.st.ts, true))) bySubj[sid] = (bySubj[sid] || 0) + v;
  const rows = state.subjects.filter(s => bySubj[s.id] || s.dailyGoalMin).map(s => {
    const goal = (s.dailyGoalMin || 0) * Math.max(1, active), done = bySubj[s.id] || 0;
    return `<div class="row" style="border:0;padding:7px 0"><div style="min-width:0;flex:1"><div class="nm"><span class="cdot" style="background:${s.color}"></span>${esc(s.name)}</div>
      <div class="goalbar"><i style="width:${goal ? Math.min(100, done / goal * 100) : 100}%;background:${s.color}"></i></div></div>
      <div class="right"><div class="sub" style="margin:0">${fmtDur(done)}${goal ? ' / ' + fmtDur(goal) : ''}</div></div></div>`;
  }).join('');
  return `<div class="wk">${days.map(x => `<div class="wk-c ${x.key === todayKey() ? 'today' : ''}"><div class="wk-bar"><i class="plan" style="height:${x.st.planned / maxP * 100}%"></i><i class="done" style="height:${x.st.done / maxP * 100}%"></i></div>
      <span>${'SMTWTFS'[x.d.getDay()]}</span></div>`).join('')}</div>
    <div class="stats3"><div><b>${fmtDur(totDone)}</b><small>Done</small></div><div><b>${totPlan ? Math.round(totDone / totPlan * 100) : 0}%</b><small>Of planned</small></div><div><b>${streak()}</b><small>Day streak</small></div></div>
    ${rows ? `<div class="sec">Subjects</div>${rows}` : ''}`;
}

  const d = sheetCtx.draft;
  if (key === 'nb.title'){ d.title = val; return; }
  if (key === 'sj.name'){ d.name = val; return; }
  const finish = (obj, fallback) => { if (!val.trim()) obj.title = fallback; save(); render(); const h = sheet.querySelector('.sheet-title'); if (h && sheetCtx.mode !== 'mat') h.textContent = obj.title; };

const lastPrefs = patch => { state.prefs.last = Object.assign({}, state.prefs.last || {}, patch); };
const closeSheet = () => { backSheet(); render(); };
const toggleIn = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v].sort((a, b) => a - b);

function handleAction(a, quiet){
  /* ---- generic: step / preset / toggle ---- */
  if (a.startsWith('step:') || a.startsWith('set:')){
    const p = a.split(':'), n = parseInt(p[p.length - 1], 10), f = p.slice(1, -1).join(':');
    if (a.startsWith('step:')){ if (stepField(f, n)) haptic(3); }
    else { const sp = fieldSpec(f); if (sp){ sp.set(n); haptic(4); } }
    afterChange(!!quiet);
    return;
  }
  if (a.startsWith('tg:')){
    const path = a.slice(3);
    setPath(state.settings, path, !getPath(state.settings, path));
    if (path.startsWith('notif.') || path.startsWith('plan.') || path.startsWith('ui.')) haptic(4);
    afterChange(false);
    return;
  }
  if (a === 'back'){ closeSheet(); return; }

  const mode = sheetCtx.mode;

  if (mode === 'block'){
    const t = findTask(sheetCtx.id);
    if (!t) return;
    if (a.startsWith('bcat:')){ t.cat = a.slice(5); save(); render(); renderSheet(); }
    else if (/^e[1-5]$/.test(a)){ t.eff = parseInt(a[1], 10); learnFrom(t, false); save(); haptic(4); renderSheet(); }
    else if (a === 'del'){ deleteTaskObj(t); backSheet(); }
    else if (a === 'close') closeSheet();
    else if (t.type === 'study') pickerAction(t, a, () => { t.title = studyTitle(t.matId, t.subjectIds); save(); render(); renderSheet(); });
    return;
  }

  if (mode === 'recurring'){
    const r = state.recurring.find(x => x.id === sheetCtx.recurringId);
    if (!r) return;
    if (a.startsWith('rcat:')) r.cat = a.slice(5);
    else if (a.startsWith('rday:')){ const n = parseInt(a.slice(5), 10); const nd = toggleIn(r.days || [], n); r.days = nd.length ? nd : [n]; }
    else if (a === 'rdel'){ deleteRecurring(r.id); backSheet(); return; }
    else if (a === 'close'){ closeSheet(); return; }
    else return;
    save(); render(); renderSheet();
    return;
  }

  if (mode === 'newblock'){
    const d = sheetCtx.draft, last = state.prefs.last || {}, [lo, hi] = dayWindow();
    if (a === 'type:fixed'){ d.type = 'fixed'; d.dur = clamp(last.fixedDur || 60, MIN_FIXED, MAX_FIXED); }
    else if (a === 'type:study'){ d.type = 'study'; d.repeat = false; d.dur = clamp(last.studyDur || preferredDur(), MIN_STUDY, MAX_STUDY); }
    else if (a.startsWith('ncat:')) d.cat = a.slice(5);
    else if (a === 'repeat:toggle'){ d.repeat = !d.repeat; if (d.repeat && !(d.days || []).length) d.days = [isoDow(state.date)]; }
    else if (a.startsWith('nday:')) d.days = toggleIn(d.days || [], parseInt(a.slice(5), 10));
    else if (a === 'close'){ backSheet(); return; }
    else if (a === 'create'){
      const before = snapState();
      d.start = clamp(d.start, lo, Math.max(lo, hi - d.dur));
      if (d.type === 'fixed'){
        const title = (d.title || '').trim() || CATS[d.cat].name;
        if (d.repeat && d.days.length) state.recurring.push({ id:uid(), title, cat:d.cat, start:d.start, dur:d.dur, days:[...new Set(d.days)].sort((x, y) => x - y), until:null });
        else tasksOn(state.date).push({ id:uid(), type:'fixed', cat:d.cat, title, start:d.start, dur:d.dur });
        lastPrefs({ type:'fixed', cat:d.cat, fixedDur:d.dur });
      } else {
        if (!d.matId && !(d.subjectIds || []).length){ toast('Pick a material or subject'); return; }
        tasksOn(state.date).push({ id:uid(), type:'study', matId:d.matId || null, subjectId:d.subjectIds[0] || null,
          subjectIds:[...d.subjectIds], title:studyTitle(d.matId, d.subjectIds), start:d.start, dur:d.dur, done:false, pct:0, eff:0 });
        lastPrefs({ type:'study', matId:d.matId || null, subjectIds:[...d.subjectIds], studyDur:d.dur });
      }
      resolve(tasksOn(state.date)); save(); backSheet(); render(); haptic(10);
      offerUndo('Block added', before, 3200);
      return;
    }
    else if (pickerAction(d, a)){ renderSheet(); return; }
    else return;
    renderSheet();
    return;
  }

  if (mode === 'mat'){
    const m = sheetCtx.draft, editing = !!sheetCtx.id;
    if (a.startsWith('msub:')){
      const s = new Set(m.subjectIds); const id = a.slice(5); s.has(id) ? s.delete(id) : s.add(id);
      m.subjectIds = state.subjects.filter(x => s.has(x.id)).map(x => x.id); m.subjectId = m.subjectIds[0] || null;
      if (editing){ save(); render(); }
      renderSheet();
    }
    else if (a === 'addsub') pushSheetAfter(m);
    else if (a === 'mdel'){ const id = sheetCtx.id; backSheet(); deleteMaterial(id); }
    else if (a === 'close') closeSheet();
    else if (a === 'createMat'){
      const title = (m.title || '').trim();
      if (!title){ toast('Name it first'); return; }
      const before = snapState(), first = subjectById(m.subjectIds[0]);
      const nm = { id:uid(), title, subjectIds:[...m.subjectIds], subjectId:m.subjectIds[0] || null, total:Math.max(1, m.total), done:0,
        unitMin:Math.max(1, m.unitMin), dailyGoalMin:Math.max(0, m.dailyGoalMin), color:first ? first.color : COLORS[state.materials.length % COLORS.length] };
      state.materials.push(nm); save();
      const cb = m.after; backSheet(); render(); haptic(10);
      if (cb) cb(nm); else offerUndo('Material added', before, 3200);
    }
    return;
  }

  if (mode === 'newsubj'){
    const d = sheetCtx.draft;
    if (a === 'close'){ backSheet(); return; }
    if (a === 'createSubj'){
      const name = (d.name || '').trim();
      if (!name){ toast('Name it first'); return; }
      const before = snapState();
      const s = { id:uid(), name, dailyGoalMin:Math.max(0, d.dailyGoalMin), color:COLORS[state.subjects.length % COLORS.length] };
      state.subjects.push(s); save();
      const cb = d.after; backSheet(); render(); haptic(10);
      if (cb) cb(s); else offerUndo('Subject added', before, 3200);
    }
    return;
  }

  if (mode === 'settings'){
    if (a.startsWith('go:')) pushSheet('set', { id:a.slice(3) });
    else if (a === 'close') backSheet();
    return;
  }

  if (mode === 'set'){
    if (a.startsWith('sjx:')){ deleteSubject(a.slice(4)); renderSheet(); }
    else if (a === 'newsubj') pushSheet('newsubj', { draft:{ name:'', dailyGoalMin:60 } });
    else if (a === 'newmat') pushSheet('mat', { draft:{ title:'', subjectIds:[], total:20, unitMin:6, dailyGoalMin:30, done:0 } });
    else if (a.startsWith('medit:')) pushSheet('mat', { id:a.slice(6) });
    else if (a.startsWith('redit:')) pushSheet('recurring', { recurringId:a.slice(6) });
    else if (a.startsWith('rdelt:')){ deleteRecurring(a.slice(6)); renderSheet(); }
    else if (a === 'reset:plan'){ const before = snapState(); state.settings.plan = { ...DEFAULT_PLAN }; save(); renderSheet(); offerUndo('Planner reset', before, 3000); }
    else if (a === 'reset:learn'){
      const old = state.history; state.history = []; modelDirty = true; save(); renderSheet();
      toast('Learning reset', { action:{ label:'Undo', fn:() => { state.history = old; modelDirty = true; save(); refreshOpenSheet(); } } });
    }
    else if (a === 'n:perm'){ if (NATIVE) NATIVE.requestNotifPermission(); }
    else if (a === 'n:exact'){ if (NATIVE) NATIVE.openExactAlarmSettings(); }
    else if (a === 'n:test') toast(NATIVE && NATIVE.testNotification() ? 'Sent' : 'Allow notifications first');
    else if (a.startsWith('snd:')) soundAction(a.slice(4));
    else if (a === 'data:export') exportBackup();
    else if (a === 'data:import') importBackup();
    return;
  }

  if (mode === 'review'){
    if (a === 'close') backSheet();
    else if (a.startsWith('tab:')){ sheetCtx.tab = a.slice(4); renderSheet(); }
    else if (a.startsWith('open:')) pushSheet('block', { id:a.slice(5) });
    return;
  }

  if (mode === 'share'){
    if (a === 'share:plan') doShare('plan'); else if (a === 'share:report') doShare('report');
    return;
  }

  if (mode === 'startday'){
    const d = sheetCtx.draft;
    if (a === 'sd:now') d.start = roundTo(nowMinutes(), 5);
    else if (a === 'sd:wake') d.start = state.settings.wake;
    else if (a === 'sd:refit') d.refit = !d.refit;
    else if (a === 'sd:go'){
      const { res, before } = startDay(d.start, d.refit);
      d.result = res; sheetCtx.phase = 'done'; renderSheet('fwd'); haptic([10, 30, 10]);
      offerUndo(res.moved || res.carried ? refitSummary(res) : 'Day started', before, 5000);
      setTimeout(maybeSuggestWindow, 900);
      return;
    }
    else if (a === 'share-plan'){ openSheet('share', { phase:'plan' }); return; }
    else if (a === 'close'){ backSheet(); return; }
    else return;
    renderSheet();
    return;
  }

  if (mode === 'endday'){
    const d = sheetCtx.draft;
    if (a === 'ed:carry') d.carry = !d.carry;
    else if (a === 'ed:go'){
      const r = endDay(d.carry);
      d.carried = r.carried; sheetCtx.phase = 'done'; renderSheet('fwd'); haptic([10, 30, 10]);
      offerUndo('Day closed', r.before, 5000);
      setTimeout(maybeSuggestWindow, 900);
      return;
    }
    else if (a === 'share-report'){ openSheet('share', { phase:'report' }); return; }
    else if (a === 'close'){ backSheet(); return; }
    else return;
    renderSheet();
  }
}

function pills(items, x, y, maxW){
  let cx = x, out = '';

function categoryTotals(list){

  /* ring + headline numbers */
  body += `<circle cx="${P + r + 12}" cy="${ringY}" r="${r}" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="22"/>
    <circle cx="${P + r + 12}" cy="${ringY}" r="${r}" fill="none" stroke="${ringC}" stroke-width="22" stroke-linecap="round" stroke-dasharray="${(C * st.pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${P + r + 12} ${ringY})"/>`;
  body += txt(P + r + 12, ringY + 20, pct + '%', { size:72, weight:700, fill:'#f0f2f6', anchor:'middle', ls:-2 });
  const rx = P + 2 * r + 70;
  body += txt(rx, ringY - 52, fmtDur(st.done), { size:56, weight:700, fill:'#f0f2f6', ls:-1 }) + txt(rx, ringY - 16, `of ${fmtDur(st.planned)} planned`, { size:23, weight:500, fill:'#868da1' });
  body += txt(rx, ringY + 40, `${blocksDone}/${st.ts.length}`, { size:34, weight:700, fill:'#dfe1e8' }) + txt(rx + 112, ringY + 40, 'blocks', { size:22, weight:600, fill:'#868da1' });
  const sk = streak();
  body += txt(rx, ringY + 92, st.avg ? `★ ${st.avg.toFixed(1)}` : '★ —', { size:30, weight:700, fill:'#e0b57c' }) + txt(rx + 112, ringY + 92, sk >= 2 ? `focus · ${sk}-day streak` : 'focus', { size:22, weight:600, fill:'#868da1' });
  /* when the day actually ran */
  if (info.startedAt != null || info.endedAt != null){
    body += pills([info.startedAt != null && { t:`Started ${fmtTime(info.startedAt)}` }, info.endedAt != null && { t:`Closed ${fmtTime(info.endedAt)}` }].filter(Boolean), P, y - 30, W - 2 * P);
    y += 44;
  }
  /* time split strip */
  body += txt(P, y + 4, 'WHERE THE DAY WENT', { size:19, weight:700, fill:'#6a7083', ls:2.5 });
  let sx = P; const sw = W - 2 * P;
  const segs = [['study', 'Study', '#95a5bc'], ...CAT_KEYS.map(k => [k, CATS[k].name, CATS[k].color])].filter(([k]) => cat[k] > 0);
  body += box(P, y + 24, sw, 22, 11, 'rgba(255,255,255,0.06)');
  for (const [k, , c] of segs){ const w = cat[k] / total * sw; body += box(sx, y + 24, Math.max(6, w - 3), 22, 6, c); sx += w; }
  let lx = P; const ly = y + 82;
  for (const [k, n, c] of segs){ body += `<circle cx="${lx + 8}" cy="${ly - 7}" r="6.5" fill="${c}"/>` + txt(lx + 24, ly, `${n} ${fmtDur(cat[k])}`, { size:21, weight:600, fill:'#aab0c0' }); lx += 40 + (n.length + fmtDur(cat[k]).length + 1) * 12.5; }
  y += 130;
  /* subject goals */
  if (subj.length){
    body += txt(P, y + 4, 'SUBJECT GOALS', { size:19, weight:700, fill:'#6a7083', ls:2.5 }); y += 34;
    for (const s of subj){
      const done = bySubj[s.id] || 0, goal = s.dailyGoalMin || 0, f = goal ? clamp(done / goal, 0, 1) : 1;
      body += txt(P, y + 24, trunc(s.name, 22), { size:25, weight:700, fill:'#dfe1e8' });
      body += txt(W - P, y + 24, `${Math.round(done)}${goal ? ' / ' + goal : ''} min`, { size:22, weight:600, fill:'#868da1', anchor:'end' });
      body += box(P, y + 40, sw, 12, 6, 'rgba(255,255,255,0.08)') + box(P, y + 40, Math.max(12, sw * f), 12, 6, s.color);
      y += 76;
    }
    y += 10;
  }
  /* blocks, chronological */
  body += txt(P, y + 4, 'BLOCKS', { size:19, weight:700, fill:'#6a7083', ls:2.5 }); y += 28;
  if (!shown.length) body += txt(P, y + 40, 'No study blocks today', { size:24, weight:500, fill:'#6a7083' }), y += 70;
  for (const t of shown){
    const cy = y + 34, c = colorForTask(t), p = t.pct || 0;
    if (t.done || p >= 100) body += `<circle cx="${P + 16}" cy="${cy}" r="14" fill="#9fd0b0"/><path d="M${P + 9} ${cy + 1} l5 5 l9 -11" fill="none" stroke="#0a0b0e" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>`;
    else if (p > 0) body += `<circle cx="${P + 16}" cy="${cy}" r="12" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="4"/><circle cx="${P + 16}" cy="${cy}" r="12" fill="none" stroke="#e0b57c" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(2 * Math.PI * 12 * p / 100).toFixed(1)} 100" transform="rotate(-90 ${P + 16} ${cy})"/>`;
    else body += `<circle cx="${P + 16}" cy="${cy}" r="12" fill="none" stroke="#6a7083" stroke-width="3" stroke-dasharray="4 5"/>`;
    body += box(P + 52, cy - 17, 6, 34, 3, c);
    body += txt(P + 74, cy - 2, trunc(t.title, 30), { size:26, weight:700, fill:(t.done || p >= 100) ? '#f0f2f6' : '#aab0c0' });
    body += txt(P + 74, cy + 24, `${fmtShort(t.start)} – ${fmtShort(t.start + t.dur)} · ${fmtDur(t.dur)}`, { size:19, weight:600, fill:'#6a7083' });
    body += txt(W - P, cy + 8, t.eff ? '★'.repeat(t.eff) : (p ? p + '%' : 'missed'), { size:t.eff ? 24 : 22, weight:700, fill:t.eff ? '#e0b57c' : '#6a7083', anchor:'end' });
    y += 72;
  }
  if (more > 0){ body += txt(P, y + 28, `+${more} more`, { size:21, weight:600, fill:'#6a7083' }); y += 44; }

  const footTop = y + 30, H = Math.max(1350, footTop + 150);
  return wrapSvg(W, H, headerBlock('Day Report', W, P, dateStr) + body +
    footerBlock(W, H, P, footTop, pct >= 70 ? 'Showed up. Delivered.' : pct >= 40 ? 'Progress made. Back at it.' : 'Tomorrow is a clean slate.'));
}

/* ============================================================
   SOUND (Android): pick a custom alert sound, optionally force-play it
============================================================ */
let nativeSound = { title:'Default', custom:false, force:false };
function soundRefresh(){ if (NATIVE && NATIVE.getSound){ try { nativeSound = JSON.parse(NATIVE.getSound()); } catch(_){} } }
function soundAction(k){
  if (!NATIVE || !NATIVE.getSound) return;
  if (k === 'pick') NATIVE.pickSound();
  else if (k === 'preview') NATIVE.previewSound();
  else if (k === 'clear'){ NATIVE.clearSound(); soundRefresh(); renderSheet(); }
  else if (k === 'force'){ NATIVE.setSoundForce(!nativeSound.force); soundRefresh(); renderSheet(); }
}
window.__ffSoundChanged = () => { soundRefresh(); if (sheetCtx.mode === 'set') renderSheet(); };

/* ============================================================
   SHARE — PNG EXPORT
============================================================ */
async function svgToPngBlob(svgStr, w, h, scale = 2){
  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error('SVG load failed'));
      img.src = url;
    });
    const canvas = document.createElement('canvas');
    canvas.width = w * scale;
    canvas.height = h * scale;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return await new Promise((res, rej) => {
      canvas.toBlob(b => b ? res(b) : rej(new Error('toBlob failed')), 'image/png');
    });
  } finally {
    URL.revokeObjectURL(url);
  }
}

function blobToBase64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}
async function shareOrDownload(blob, filename, title){
  if (NATIVE){
    NATIVE.shareFile(await blobToBase64(blob), filename, 'image/png', title);
    return 'shared';
  }
  const file = new File([blob], filename, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try {
      await navigator.share({ files: [file], title });
      return 'shared';
    } catch(e){
      if (e.name === 'AbortError') return 'cancelled';
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return 'downloaded';
}

async function doShare(kind){
  const list = allTasksOn(state.date);
  if (!list.length){ toast('Nothing to share yet'); return; }
  const isPlan = kind === 'plan';
  const built = isPlan ? buildDayPlanSVG() : buildDayReportSVG();
  const filename = `focusflow-${state.date}-${isPlan ? 'plan' : 'report'}.png`;
  toast('Generating image…', { duration: 4000 });
  try {
    const blob = await svgToPngBlob(built.svg, built.w, built.h, 2);
    const result = await shareOrDownload(blob, filename, isPlan ? 'My day plan' : 'My day report');
    if (result === 'downloaded') toast('Image saved');
    else if (result === 'shared') toast('Shared');
    haptic(12);
  } catch(e){
    console.warn(e);
    toast('Could not generate image');
  }
}

   TOP-LEVEL
============================================================ */
$('#addBtn').addEventListener('click', () => openNewBlock());
$('#autoBtn').addEventListener('click', autoPlan);
$('#setBtn').addEventListener('click', () => openSheet('settings'));
$('#reviewBtn').addEventListener('click', () => openSheet('review'));
$('#shareBtn').addEventListener('click', () => openSheet('share', { phase: dayGet(todayKey()).startedAt != null && state.date === todayKey() ? 'report' : 'plan' }));

/* ============================================================
   TOAST (tappable action, e.g. Undo) — floats above sheets when one is open
============================================================ */
let toastTimer, toastAction = null;
function toast(msg, opts){
  opts = opts || {};
  const el = $('#toast');
  toastAction = opts.action || null;
  el.innerHTML = `<span class="tmsg">${esc(msg)}</span>${toastAction ? `<button id="toastAction">${esc(toastAction.label)}</button>` : ''}`;
  el.classList.toggle('act', !!toastAction);
  el.classList.toggle('top', sheetOpen);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), opts.duration || 1800);
}
$('#toast').addEventListener('click', e => {
  if (!e.target.closest('#toastAction') || !toastAction) return;
  const a = toastAction; toastAction = null;
  clearTimeout(toastTimer); $('#toast').classList.remove('show');
  a.fn();
});

/* ============================================================
   NATIVE BRIDGE (Android) — all no-ops in a normal browser
============================================================ */
let lastSeenDay = todayKey();
function nativeStatusRefresh(){ if (NATIVE){ try { nativeStatus = JSON.parse(NATIVE.getStatus()); } catch(_){} } }
function reloadFromNative(){
  if (!NATIVE || drag) return;
  const saved = load();
  if (!saved) return;
  const keepDate = state.date;
  state = saved; normalizeState(); state.date = keepDate;
  modelDirty = true;
  render();
  refreshOpenSheet();
}
window.__ffExternalChange = reloadFromNative;
window.__ffResume = function(){
  nativeStatusRefresh(); reloadFromNative();
  const today = todayKey();
  if (today !== lastSeenDay){ lastSeenDay = lastToday = today; state.date = today; render(); scrollDefault(true); }
  else if (sheetOpen && sheetCtx.mode === 'set') renderSheet();
  tick();
};
window.__ffStatus = json => { try { nativeStatus = JSON.parse(json); } catch(_){} if (sheetOpen && ['set','settings'].includes(sheetCtx.mode)) renderSheet(); };
window.__ffOpenBlock = function(id, date){
  if (!id) return;
  hideSheet();
  if (date && date !== state.date) state.date = date;
  render();
  const t = findTask(id);
  if (!t) return;
  scrollToTime(t.start);
  String(id).startsWith('rec:') ? openSheet('recurring', { recurringId:String(id).split(':')[1] }) : openBlockSheet(id);
};
window.__ffNewBlock = () => { hideSheet(); openNewBlock(); };
window.__ffStartDay = () => { hideSheet(); if (state.date !== todayKey()) goDate(todayKey()); openStartDay(); };
window.__ffEndDay = () => { hideSheet(); if (state.date !== todayKey()) goDate(todayKey()); openEndDay(); };
window.__ffBack = () => { if (sheetOpen){ backSheet(); return true; } return false; };

function exportBackup(){
  if (!NATIVE) return;
  const bytes = new TextEncoder().encode(JSON.stringify(state));
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  NATIVE.shareFile(btoa(bin), `focusflow-backup-${todayKey()}.json`, 'application/json', 'FocusFlow backup');
}
function importBackup(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || data.version !== 2 || typeof data.tasks !== 'object') throw new Error('bad backup');
      const before = snapState();
      state = data; normalizeState(); state.date = todayKey(); modelDirty = true;
      save(); hideSheet(); render(); scrollDefault(true);
      offerUndo('Backup imported', before, 5000);
    } catch(e){ toast('Not a FocusFlow backup'); }
  };
  inp.click();
}
document.addEventListener('contextmenu', e => { if (!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) e.preventDefault(); });

/* ============================================================
   BOOT
============================================================ */
function boot(){
  initState();
  $('#reviewBtn').innerHTML = ICON.review;
  $('#shareBtn').innerHTML = ICON.share;
  $('#setBtn').innerHTML = ICON.set;
  render();
  requestAnimationFrame(() => scrollDefault(true));
  tick();
  if (NATIVE){ nativeStatusRefresh(); soundRefresh(); try { NATIVE.ready(); } catch(_){} }
}
boot();
